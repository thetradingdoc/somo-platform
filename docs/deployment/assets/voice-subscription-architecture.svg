<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="system-ui,Segoe UI,sans-serif">
  <title>Voice subscription billing architecture</title>
  <rect width="920" height="520" fill="#f8fafc"/>
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Voice SaaS billing architecture (target)</text>

  <!-- Stripe -->
  <rect x="20" y="48" width="200" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="120" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Stripe</text>
  <text x="120" y="92" text-anchor="middle" font-size="10" fill="#334155">Subscriptions $79 / $199 / $399</text>
  <text x="120" y="108" text-anchor="middle" font-size="10" fill="#334155">Top-ups $20 / $30 / $50</text>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#64748b">invoice.paid · subscription.* · checkout</text>

  <!-- Webhooks -->
  <rect x="250" y="48" width="200" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="350" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Webhook handler</text>
  <text x="350" y="92" text-anchor="middle" font-size="10" fill="#334155">Grant plan minutes</text>
  <text x="350" y="108" text-anchor="middle" font-size="10" fill="#334155">Top-up minutes</text>
  <text x="350" y="124" text-anchor="middle" font-size="10" fill="#334155">Update subscription_status</text>
  <text x="350" y="140" text-anchor="middle" font-size="10" fill="#334155">Provision number (post-pay)</text>

  <!-- Core -->
  <rect x="480" y="40" width="220" height="116" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Middleware core</text>
  <text x="590" y="84" text-anchor="middle" font-size="10" fill="#334155">plan-catalog.json</text>
  <text x="590" y="100" text-anchor="middle" font-size="10" fill="#334155">applyUsage() idempotent</text>
  <text x="590" y="116" text-anchor="middle" font-size="10" fill="#334155">billing-access gate</text>
  <text x="590" y="132" text-anchor="middle" font-size="10" fill="#334155">billing-lifecycle-sweep</text>
  <text x="590" y="148" text-anchor="middle" font-size="9" fill="#64748b">pack-only at zero</text>

  <!-- DB -->
  <rect x="730" y="48" width="170" height="100" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="815" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Database</text>
  <text x="815" y="92" text-anchor="middle" font-size="10" fill="#334155">customers</text>
  <text x="815" y="108" text-anchor="middle" font-size="10" fill="#334155">customer_credits</text>
  <text x="815" y="124" text-anchor="middle" font-size="10" fill="#334155">usage_events</text>
  <text x="815" y="140" text-anchor="middle" font-size="9" fill="#64748b">monthly_usage (legacy)</text>

  <!-- Telephony -->
  <rect x="20" y="200" width="280" height="120" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="160" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">Telephony</text>
  <text x="160" y="246" text-anchor="middle" font-size="10" fill="#334155">Twilio POST /voice/incoming</text>
  <text x="160" y="262" text-anchor="middle" font-size="10" fill="#334155">Balance check ’ Say+Hangup or SIP</text>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#334155">Retell WebSocket + status callback</text>
  <text x="160" y="298" text-anchor="middle" font-size="9" fill="#64748b">both ’ applyUsage</text>

  <!-- Portal -->
  <rect x="330" y="200" width="200" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="430" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">Provider portal</text>
  <text x="430" y="246" text-anchor="middle" font-size="10" fill="#334155">Settings: balance bar</text>
  <text x="430" y="262" text-anchor="middle" font-size="10" fill="#334155">Top-up + change plan</text>
  <text x="430" y="278" text-anchor="middle" font-size="10" fill="#334155">Signup: tier ’ Checkout</text>
  <text x="430" y="298" text-anchor="middle" font-size="9" fill="#64748b">separate from RCM billing.html</text>

  <!-- Lifecycle box -->
  <rect x="560" y="180" width="340" height="160" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 2"/>
  <text x="730" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Billing lifecycle</text>
  <text x="580" y="228" font-size="10" fill="#334155">1. Signup ’ pick tier ’ Stripe Checkout</text>
  <text x="580" y="246" font-size="10" fill="#334155">2. invoice.paid ’ grant minutes + provision Twilio #</text>
  <text x="580" y="264" font-size="10" fill="#334155">3. Inbound call ’ gate if minutes d 0</text>
  <text x="580" y="282" font-size="10" fill="#334155">4. Call end ’ applyUsage (plan then top-up)</text>
  <text x="580" y="300" font-size="10" fill="#334155">5. Top-up Checkout ’ add topup_balance</text>
  <text x="580" y="318" font-size="10" fill="#334155">6. past_due: 3d grace ’ suspend ’ Retell pause</text>
  <text x="580" y="336" font-size="10" fill="#334155">7. cancel + 30d ’ release Twilio number</text>

  <!-- Arrows -->
  <path d="M220 98 L250 98" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M450 98 L480 98" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M700 98 L730 98" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M590 156 L590 180" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M160 320 L160 360 L590 360 L590 156" fill="none" stroke="#64748b" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="460" y="500" text-anchor="middle" font-size="9" fill="#64748b">RCM patient invoices (billing.html) are a separate revenue system</text>
</svg>
