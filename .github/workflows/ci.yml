name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      clinical_prep_appointment_id:
        description: "Appointment ID for clinical prep gate"
        required: false
        default: "appt-5f04ffbd3a29"
      staging_api_base:
        description: "Optional staging API base for route evidence (e.g. https://staging.example.com)"
        required: false
        default: ""

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: middleware-platform/package-lock.json
      
      - name: Install dependencies
        working-directory: ./middleware-platform
        run: npm ci

      - name: Install and build littlelab-landing (reasoning scan-chat gate)
        if: matrix.node-version == '20.x'
        working-directory: ./unified-dashboard/littlelab-landing
        run: npm ci && npm run build
      
      - name: Run linter (if configured)
        working-directory: ./middleware-platform
        run: npm run lint --if-present
      
      - name: Check for syntax errors
        working-directory: ./middleware-platform
        run: |
          # Basic syntax check using node
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            node --check "$file" || exit 1
          done
      
      - name: Validate OpenAPI spec
        working-directory: ./middleware-platform
        run: |
          if [ -f "openapi.yaml" ]; then
            npx -y @apidevtools/swagger-cli validate openapi.yaml
          else
            echo "No OpenAPI spec found, skipping validation"
          fi
      
      - name: Run Jest tests (middleware-platform)
        working-directory: ./middleware-platform
        run: npm test

      - name: Run reasoning regression guard suites
        run: npm run test:reasoning-regression

      - name: Reasoning eval harness (pre-ramp gate)
        working-directory: ./middleware-platform
        run: npm run eval:reasoning:harness

      - name: Category representative guard baseline flow
        working-directory: ./middleware-platform
        run: |
          npm run catalog:observability:report -- --output ./tmp/category-route-observability.local.json --limit 2000
          npm run catalog:guard:baseline:freeze -- --report ./tmp/category-route-observability.local.json --output ./tmp/category-route-guard-baseline.local.json --sample-source ci_local_db --map-version ci
          cp ./tmp/category-route-observability.local.json ./tmp/category-route-observability.representative.json
          npm run catalog:guard:sensitivity-check -- --local ./tmp/category-route-observability.local.json --representative ./tmp/category-route-observability.representative.json --output ./tmp/category-route-guard-sensitivity.json

      - name: Upload category guard evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: category-guard-evidence
          path: |
            middleware-platform/tmp/category-route-observability.local.json
            middleware-platform/tmp/category-route-guard-baseline.local.json
            middleware-platform/tmp/category-route-guard-sensitivity.json
          if-no-files-found: error

      - name: Security gate (redaction + forbidden data scan)
        working-directory: ./middleware-platform
        run: npm run release:security-gate

      - name: Clinical prep payload gate
        working-directory: ./middleware-platform
        env:
          CLINICAL_PREP_APPOINTMENT_ID: ${{ github.event.inputs.clinical_prep_appointment_id || vars.CLINICAL_PREP_APPOINTMENT_ID || 'appt-5f04ffbd3a29' }}
        run: |
          if [ -f "scripts/check-clinical-prep-payload.js" ]; then
            npm run check:clinical-prep -- --appointment "$CLINICAL_PREP_APPOINTMENT_ID"
          else
            echo "No clinical prep payload script found, skipping"
          fi

      # mvp-79: CI gates (perf budgets + retention dry-run + Cypress E2E)
      - name: Performance budgets (repo root)
        run: |
          if [ -f "scripts/check-performance-budgets.cjs" ]; then
            node scripts/check-performance-budgets.cjs
          else
            echo "No perf budget script found, skipping"
          fi

      - name: Auth UI guardrails (repo root)
        run: |
          if [ -f "scripts/check-auth-ui-guardrails.cjs" ]; then
            node scripts/check-auth-ui-guardrails.cjs
          else
            echo "No auth UI guardrails script found, skipping"
          fi

      - name: Retention cleanup dry-run (repo root)
        env:
          RETENTION_DRY_RUN: "1"
        run: |
          if [ -f "scripts/retention-cleanup.cjs" ]; then
            node scripts/retention-cleanup.cjs
          else
            echo "No retention script found, skipping"
          fi

      - name: Agentic checkout static verification (repo root)
        run: node scripts/verify-agentic-checkout.cjs

      - name: Docs parity check (routes/services)
        run: node scripts/check-docs-route-service-parity.cjs

      - name: Install patient-app dependencies
        working-directory: ./patient-app
        run: npm ci

      - name: Typecheck patient-app (Expo)
        working-directory: ./patient-app
        run: npx tsc --noEmit

      - name: Start API server (for Cypress)
        working-directory: ./middleware-platform
        env:
          NODE_ENV: test
          PORT: 4000
          DB_PATH: ./middleware-test.db
          NOTIFICATION_QUEUE_ENABLED: "0"
        run: |
          node server.js &
          echo $! > /tmp/api_pid
          sleep 3

      - name: Run Cypress E2E (middleware-platform)
        working-directory: ./middleware-platform
        env:
          CYPRESS_BASE_URL: http://localhost:4000
        run: |
          if [ -d "cypress" ]; then
            npx cypress run
          else
            echo "No middleware-platform/cypress directory — browser E2E skipped (see docs/deployment/README.md#ci-and-deploy-source-of-truth)"
          fi

      - name: Reasoning scan-chat gate (Playwright)
        if: matrix.node-version == '20.x'
        working-directory: ./middleware-platform
        env:
          UI_BASE_URL: http://127.0.0.1:5199
          MIDDLEWARE_API_BASE: http://127.0.0.1:4000
        run: |
          node scripts/serve-cra-build.cjs "../unified-dashboard/littlelab-landing/build" 5199 &
          echo $! > /tmp/landing_static_pid
          sleep 2
          npx playwright install chromium
          node scripts/playwright-chat-scan-two-turn-gate.cjs
          kill "$(cat /tmp/landing_static_pid)" 2>/dev/null || true

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api_pid ]; then
            kill $(cat /tmp/api_pid) || true
          fi

      - name: Route-field evidence (local API)
        working-directory: ./middleware-platform
        run: |
          node ./scripts/category-staging-route-field-check.cjs --api-base http://127.0.0.1:4000 --output ./tmp/category-route-field-evidence.local.json

      - name: Route-field evidence (staging API)
        if: ${{ github.event.inputs.staging_api_base != '' }}
        working-directory: ./middleware-platform
        run: |
          node ./scripts/category-staging-route-field-check.cjs --api-base "${{ github.event.inputs.staging_api_base }}" --output ./tmp/category-route-field-evidence.staging.json

      - name: Upload route-field evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: category-route-field-evidence
          path: |
            middleware-platform/tmp/category-route-field-evidence.local.json
            middleware-platform/tmp/category-route-field-evidence.staging.json
          if-no-files-found: warn

      - name: Run accuracy evaluation (Section 4)
        working-directory: ./middleware-platform
        env:
          ACCURACY_THRESHOLD: 50
        run: |
          if [ -f "scripts/evaluate-accuracy.js" ]; then
            node scripts/evaluate-accuracy.js
          else
            echo "evaluate-accuracy.js not found, skipping"
          fi

  security:
    name: Security Scan
    # Heuristic grep below is not a substitute for GitHub Advanced Security / secret scanning / gitleaks in org settings.
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: middleware-platform/package-lock.json
      
      - name: Install dependencies
        working-directory: ./middleware-platform
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./middleware-platform
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Check for sensitive data
        run: |
          # Check for potential secrets in code
          if grep -r "password\|secret\|api_key\|token" --include="*.js" --include="*.json" middleware-platform/ | grep -v "node_modules" | grep -v ".git" | grep -v "package.json" | grep -v "package-lock.json" | grep -v "process.env" | grep -v "require('dotenv')" | grep -v "\.env" | grep -v "example"; then
            echo "⚠️  Warning: Potential secrets found in code. Review manually."
            exit 1
          else
            echo "✅ No obvious secrets found in code"
          fi
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: middleware-platform/package-lock.json
      
      - name: Install dependencies
        working-directory: ./middleware-platform
        run: npm ci
      
      - name: Verify server starts
        working-directory: ./middleware-platform
        env:
          NODE_ENV: test
          PORT: 4000
        run: |
          timeout 10s node server.js || true
          echo "✅ Server can start (timeout expected)"

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://web-production-a783d.up.railway.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: middleware-platform/package-lock.json

      - name: Install middleware dependencies
        working-directory: ./middleware-platform
        run: npm ci

      - name: Production routing readiness smoke
        env:
          UI_BASE_URL: https://myskinandcare.com
          MIDDLEWARE_API_BASE: ${{ vars.PROD_API_BASE || 'https://web-production-a783d.up.railway.app' }}
        run: npm run verify:prod:routing-smoke --prefix middleware-platform
      
      - name: Deploy to Railway
        run: |
          echo "✅ All checks passed. Railway will auto-deploy on push to main/master"
          echo "If using Railway CLI, add deployment step here"
