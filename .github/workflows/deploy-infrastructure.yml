# Legacy Azure Bicep deploy only. Production Somo voice/UI uses GCP + myskinandcare.com
# (see docs/deployment/EDGE_ROUTING_CONFIGS.md). Default name_prefix "doclittle" matches
# existing Azure resource names — do not rename live Azure resources in a brand pass.
name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
      name_prefix:
        description: 'Resource name prefix'
        required: true
        default: 'doclittle'
      location:
        description: 'Azure region'
        required: true
        default: 'westus2'
  push:
    branches:
      - main
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/deploy-infrastructure.yml'

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ env.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ env.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ env.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ env.AZURE_TENANT_ID }}"
            }

      - name: Set deployment variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "prefix=${{ github.event.inputs.name_prefix }}" >> $GITHUB_OUTPUT
            echo "location=${{ github.event.inputs.location }}" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "prefix=doclittle-staging" >> $GITHUB_OUTPUT
            echo "location=westus2" >> $GITHUB_OUTPUT
          fi

      - name: Create resource group
        run: |
          az group create \
            --name "rg-${{ steps.vars.outputs.prefix }}-${{ steps.vars.outputs.env }}" \
            --location "${{ steps.vars.outputs.location }}"

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group "rg-${{ steps.vars.outputs.prefix }}-${{ steps.vars.outputs.env }}" \
            --template-file infra/bicep/app-service-with-postgres.bicep \
            --parameters \
              namePrefix="${{ steps.vars.outputs.prefix }}-${{ steps.vars.outputs.env }}" \
              location="${{ steps.vars.outputs.location }}" \
              adminLogin="${{ secrets.POSTGRES_ADMIN_LOGIN }}" \
              adminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              appServiceSku="B1" \
              postgresSku="Standard_B1ms"

      - name: Get deployment outputs
        id: outputs
        run: |
          OUTPUTS=$(az deployment group show \
            --resource-group "rg-${{ steps.vars.outputs.prefix }}-${{ steps.vars.outputs.env }}" \
            --name "app-service-with-postgres" \
            --query properties.outputs \
            --output json)
          
          echo "appServiceUrl=$(echo $OUTPUTS | jq -r '.appServiceUrl.value')" >> $GITHUB_OUTPUT
          echo "postgresHost=$(echo $OUTPUTS | jq -r '.postgresHost.value')" >> $GITHUB_OUTPUT
          
          # Store connection string as secret (masked in logs)
          echo "::add-mask::$(echo $OUTPUTS | jq -r '.connectionString.value')"
          echo "postgresConnectionString=$(echo $OUTPUTS | jq -r '.connectionString.value')" >> $GITHUB_OUTPUT

      - name: Display deployment results
        run: |
          echo "✅ Deployment complete!"
          echo "App Service URL: ${{ steps.outputs.outputs.appServiceUrl }}"
          echo "Postgres Host: ${{ steps.outputs.outputs.postgresHost }}"
          echo ""
          echo "⚠️  Next steps:"
          echo "1. Update App Service environment variables with connection string"
          echo "2. Run database migrations on Postgres"
          echo "3. Configure DNS and SSL certificates"

      - name: Save outputs to GitHub Actions output
        run: |
          echo "app_service_url=${{ steps.outputs.outputs.appServiceUrl }}" >> $GITHUB_ENV
          echo "postgres_host=${{ steps.outputs.outputs.postgresHost }}" >> $GITHUB_ENV

