name: coding-eval-nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: coding-eval-nightly
  cancel-in-progress: false

jobs:
  eval-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: middleware-platform
        run: npm ci
      - name: CI coding DB fixture
        working-directory: middleware-platform
        run: node scripts/ci-coding-db-fixture.cjs
      - name: eval:coding:prod
        working-directory: middleware-platform
        env:
          EVAL_USE_SEMANTIC: 'true'
          EVAL_PRIMARY_RANKING: 'true'
          EVAL_MEDICAL_ONLY: '1'
          RAG_API_URL: disabled
          DB_PATH: ./var/db/middleware-dev.db
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        run: npm run eval:coding:prod
      - name: Notify on failure (DP-04)
        if: failure()
        run: echo "::error::coding-eval-nightly failed — reset K-02 consecutive count (Appendix B)"
