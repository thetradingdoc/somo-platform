<svg width="100%" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Payor Pipeline Architecture - Current State</title>
  <desc>Current payor pipeline status with completed components, partial components, and remaining gaps.</desc>

<defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #1a1a1a; }
      .section { font: 700 16px Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 600 13px Arial, sans-serif; fill: #1a1a1a; }
      .meta { font: 12px Arial, sans-serif; fill: #3f3f3f; }
      .small { font: 11px Arial, sans-serif; fill: #555; }
      .ok { fill: #e5f7ee; stroke: #2a8f62; stroke-width: 1.2; }
      .partial { fill: #f6f2e8; stroke: #8a8478; stroke-width: 1.2; }
      .gap { fill: #fff6f3; stroke: #d85a30; stroke-width: 1.2; stroke-dasharray: 5 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#666" stroke-width="1.5"/>
  </marker>
</defs>

  <text x="28" y="34" class="title">Payor Pipeline Architecture - Current State</text>
  <text x="28" y="54" class="small">Snapshot: canonical registry built, MA bridge partial, ER decision scaling in progress.</text>

  <!-- Legend -->
  <rect x="28" y="70" width="16" height="16" rx="3" class="ok"/>
  <text x="52" y="83" class="small">Built</text>
  <rect x="120" y="70" width="16" height="16" rx="3" class="partial"/>
  <text x="144" y="83" class="small">Partial / In progress</text>
  <rect x="292" y="70" width="16" height="16" rx="3" class="gap"/>
  <text x="316" y="83" class="small">Gap / Not started</text>

  <!-- Row 1 -->
  <text x="28" y="118" class="section">1) Data Foundation</text>
  <rect x="28" y="130" width="220" height="70" rx="8" class="ok"/>
  <text x="40" y="152" class="label">Raw payer records</text>
  <text x="40" y="172" class="meta">payor_source_records: ~1.92M</text>
  <text x="40" y="188" class="small">NPPES org + MA inputs loaded</text>

  <rect x="272" y="130" width="220" height="70" rx="8" class="ok"/>
  <text x="284" y="152" class="label">Normalization</text>
  <text x="284" y="172" class="meta">payor_normalized_records: 1,914,944</text>
  <text x="284" y="188" class="small">~99.8% normalized coverage</text>

  <line x1="248" y1="165" x2="270" y2="165" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <text x="28" y="242" class="section">2) Entity Resolution</text>
  <rect x="28" y="254" width="220" height="82" rx="8" class="ok"/>
  <text x="40" y="276" class="label">Blocking + candidates</text>
  <text x="40" y="296" class="meta">payor_match_candidates: 37,173,214</text>
  <text x="40" y="314" class="small">Candidate graph built</text>

  <rect x="272" y="254" width="220" height="82" rx="8" class="partial"/>
  <text x="284" y="276" class="label">Fuzzy scoring</text>
  <text x="284" y="296" class="meta">payor_similarity_scores: 100,000</text>
  <text x="284" y="314" class="small">Needs large-scale replay</text>

  <rect x="516" y="254" width="220" height="82" rx="8" class="partial"/>
  <text x="528" y="276" class="label">Resolution decisions</text>
  <text x="528" y="296" class="meta">payor_resolution_decisions: 150,000</text>
  <text x="528" y="314" class="small">In progress vs 37M candidates</text>

  <line x1="248" y1="294" x2="270" y2="294" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="492" y1="294" x2="514" y2="294" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 3 -->
  <text x="28" y="378" class="section">3) Canonical Registry + Routing</text>
  <rect x="28" y="390" width="464" height="98" rx="8" class="ok"/>
  <text x="40" y="412" class="label">Canonical registry built</text>
  <text x="40" y="432" class="meta">entities: 1,914,944 | aliases: 3,085,432 | links: 1,914,944</text>
  <text x="40" y="450" class="small">Integrity checks passed (no orphan links/aliases)</text>
  <text x="40" y="468" class="small">Bridge quality still needs disambiguation pass</text>

  <rect x="516" y="390" width="220" height="98" rx="8" class="partial"/>
  <text x="528" y="412" class="label">Operational payer catalog</text>
  <text x="528" y="432" class="meta">insurance_payers: 1,915,439</text>
  <text x="528" y="450" class="meta">MA linked: 285 / 922</text>
  <text x="528" y="468" class="small">Target: &gt;= 700 (needs tie-break signals)</text>

  <line x1="492" y1="438" x2="514" y2="438" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 4 -->
  <text x="28" y="532" class="section">4) Eligibility / Claims / Benefits</text>
  <rect x="28" y="544" width="220" height="82" rx="8" class="partial"/>
  <text x="40" y="566" class="label">Eligibility + claims wrappers</text>
  <text x="40" y="586" class="meta">Present in app services</text>
  <text x="40" y="604" class="small">Still not full live EDI lifecycle</text>

  <rect x="272" y="544" width="220" height="82" rx="8" class="gap"/>
  <text x="284" y="566" class="label">Benefits layer (CMS PBP)</text>
  <text x="284" y="586" class="meta">Not started</text>
  <text x="284" y="604" class="small">Needed for plan/service coverage answers</text>

  <rect x="516" y="544" width="220" height="82" rx="8" class="gap"/>
  <text x="528" y="566" class="label">Payer+plan coverage model</text>
  <text x="528" y="586" class="meta">Not started</text>
  <text x="528" y="604" class="small">Map: plan -&gt; covered services + limits</text>

  <line x1="248" y1="584" x2="270" y2="584" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="492" y1="584" x2="514" y2="584" stroke="#666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="28" y="702" class="small">Current priority: finish ER scaling + MA disambiguation bridge, then ingest CMS PBP benefits data.</text>
</svg>
