<svg width="100%" viewBox="0 0 920 760" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>OBF data pipeline architecture</title>
  <desc>Open Beauty Facts data pipeline from ingestion to serving, with quality, retry, and observability paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .h { fill:#141413; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .t { fill:#3d3d3a; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .s { fill:#5f5e5a; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ok { fill:#e1f5ee; stroke:#0f6e56; stroke-width:1; rx:9; }
      .part { fill:#f1efe8; stroke:#5f5e5a; stroke-width:1; rx:9; }
      .warn { fill:#fff8ef; stroke:#d97706; stroke-width:1; rx:9; }
      .miss { fill:none; stroke:#d85a30; stroke-width:1; stroke-dasharray:4 3; rx:9; }
      .flow { fill:none; stroke:#73726c; stroke-width:1.6; marker-end:url(#arrow); }
      .warnflow { fill:none; stroke:#d97706; stroke-width:1.6; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect class="ok" x="36" y="18" width="14" height="14"/>
  <text class="s" x="56" y="30">Built</text>
  <rect class="part" x="106" y="18" width="14" height="14"/>
  <text class="s" x="126" y="30">Partial</text>
  <rect class="warn" x="184" y="18" width="14" height="14"/>
  <text class="s" x="204" y="30">Risk / monitor</text>
  <rect class="miss" x="304" y="18" width="14" height="14"/>
  <text class="s" x="324" y="30">Missing</text>

  <text class="h" x="36" y="64">1 - Source acquisition (OBF)</text>
  <rect class="ok" x="36" y="76" width="190" height="58"/>
  <text class="t" x="131" y="100" text-anchor="middle">OBF API pull</text>
  <text class="s" x="131" y="118" text-anchor="middle">search and product endpoints</text>
  <rect class="ok" x="246" y="76" width="190" height="58"/>
  <text class="t" x="341" y="100" text-anchor="middle">Scheduled fetch jobs</text>
  <text class="s" x="341" y="118" text-anchor="middle">incremental and backfill mode</text>
  <rect class="warn" x="456" y="76" width="210" height="58"/>
  <text class="t" x="561" y="100" text-anchor="middle">Rate-limit and retry guard</text>
  <text class="s" x="561" y="118" text-anchor="middle">backoff, jitter, budget caps</text>
  <line class="flow" x1="226" y1="105" x2="244" y2="105"/>
  <line class="flow" x1="436" y1="105" x2="454" y2="105"/>

  <text class="h" x="36" y="172">2 - Raw landing and provenance</text>
  <rect class="ok" x="36" y="184" width="210" height="58"/>
  <text class="t" x="141" y="208" text-anchor="middle">Raw payload store</text>
  <text class="s" x="141" y="226" text-anchor="middle">json blob plus fetched_at and source</text>
  <rect class="ok" x="266" y="184" width="220" height="58"/>
  <text class="t" x="376" y="208" text-anchor="middle">Ingestion audit log</text>
  <text class="s" x="376" y="226" text-anchor="middle">job_id, cursor, status, latency</text>
  <rect class="part" x="506" y="184" width="220" height="58"/>
  <text class="t" x="616" y="208" text-anchor="middle">DLQ and replay queue</text>
  <text class="s" x="616" y="226" text-anchor="middle">failed payload replay control</text>
  <line class="flow" x1="246" y1="213" x2="264" y2="213"/>
  <line class="flow" x1="486" y1="213" x2="504" y2="213"/>

  <text class="h" x="36" y="280">3 - Normalize and map</text>
  <rect class="ok" x="36" y="292" width="210" height="58"/>
  <text class="t" x="141" y="316" text-anchor="middle">Canonical mapper</text>
  <text class="s" x="141" y="334" text-anchor="middle">barcode, brand, name, ingredients</text>
  <rect class="ok" x="266" y="292" width="210" height="58"/>
  <text class="t" x="371" y="316" text-anchor="middle">Quality validators</text>
  <text class="s" x="371" y="334" text-anchor="middle">required fields plus schema gates</text>
  <rect class="part" x="496" y="292" width="230" height="58"/>
  <text class="t" x="611" y="316" text-anchor="middle">Taxonomy enrichers</text>
  <text class="s" x="611" y="334" text-anchor="middle">category, concern, ingredient aliases</text>
  <line class="flow" x1="246" y1="321" x2="264" y2="321"/>
  <line class="flow" x1="476" y1="321" x2="494" y2="321"/>

  <text class="h" x="36" y="388">4 - Merge and index</text>
  <rect class="ok" x="36" y="400" width="210" height="58"/>
  <text class="t" x="141" y="424" text-anchor="middle">Dedup and upsert</text>
  <text class="s" x="141" y="442" text-anchor="middle">barcode-first identity merge</text>
  <rect class="ok" x="266" y="400" width="220" height="58"/>
  <text class="t" x="376" y="424" text-anchor="middle">products_obf_index</text>
  <text class="s" x="376" y="442" text-anchor="middle">search table for patient flows</text>
  <rect class="part" x="506" y="400" width="220" height="58"/>
  <text class="t" x="616" y="424" text-anchor="middle">products_catalog union</text>
  <text class="s" x="616" y="442" text-anchor="middle">catalog, obf, and off harmonization</text>
  <line class="flow" x1="246" y1="429" x2="264" y2="429"/>
  <line class="flow" x1="486" y1="429" x2="504" y2="429"/>

  <text class="h" x="36" y="496">5 - Serving layer</text>
  <rect class="ok" x="36" y="508" width="220" height="58"/>
  <text class="t" x="146" y="532" text-anchor="middle">Catalog search API</text>
  <text class="s" x="146" y="550" text-anchor="middle">/api/customer/catalog/search</text>
  <rect class="ok" x="276" y="508" width="220" height="58"/>
  <text class="t" x="386" y="532" text-anchor="middle">Routine and shelf consumers</text>
  <text class="s" x="386" y="550" text-anchor="middle">onboarding, products, journal</text>
  <rect class="warn" x="516" y="508" width="210" height="58"/>
  <text class="t" x="621" y="532" text-anchor="middle">Health metrics endpoint</text>
  <text class="s" x="621" y="550" text-anchor="middle">index available and stale checks</text>
  <line class="flow" x1="256" y1="537" x2="274" y2="537"/>
  <line class="flow" x1="496" y1="537" x2="514" y2="537"/>

  <text class="h" x="36" y="604">6 - User decision support (information overload)</text>
  <rect class="warn" x="36" y="616" width="240" height="58"/>
  <text class="t" x="156" y="640" text-anchor="middle">Problem: too many products</text>
  <text class="s" x="156" y="658" text-anchor="middle">users do not know what is good</text>
  <rect class="ok" x="296" y="616" width="220" height="58"/>
  <text class="t" x="406" y="640" text-anchor="middle">System help: ranked shortlist</text>
  <text class="s" x="406" y="658" text-anchor="middle">top picks, avoid list, why it fits</text>
  <rect class="ok" x="536" y="616" width="190" height="58"/>
  <text class="t" x="631" y="640" text-anchor="middle">Outcome: clearer choices</text>
  <text class="s" x="631" y="658" text-anchor="middle">faster decisions, better routine</text>
  <line class="warnflow" x1="276" y1="645" x2="294" y2="645"/>
  <line class="flow" x1="516" y1="645" x2="534" y2="645"/>

  <text class="h" x="36" y="694">7 - Observability and operations</text>
  <rect class="ok" x="36" y="706" width="240" height="46"/>
  <text class="t" x="156" y="724" text-anchor="middle">Search metrics and miss queries</text>
  <text class="s" x="156" y="734" text-anchor="middle">success, latency, no-results trends</text>
  <rect class="part" x="296" y="706" width="220" height="46"/>
  <text class="t" x="406" y="724" text-anchor="middle">Alerting policies</text>
  <text class="s" x="406" y="742" text-anchor="middle">empty index and stale ingest windows</text>
  <rect class="miss" x="536" y="706" width="190" height="46"/>
  <text class="t" x="631" y="724" text-anchor="middle" fill="#8a3b1d">Auto remediator</text>
  <text class="s" x="631" y="742" text-anchor="middle" fill="#8a3b1d">self-heal and replay orchestration</text>
  <line class="flow" x1="276" y1="729" x2="294" y2="729"/>
  <line class="warnflow" x1="516" y1="729" x2="534" y2="729"/>

  <line class="flow" x1="760" y1="105" x2="760" y2="735"/>
</svg>
