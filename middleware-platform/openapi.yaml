openapi: 3.0.3
info:
  title: Agentic Commerce Platform API
  description: |
    Middleware platform that enables AI agents (ChatGPT, Google, Voice) to process payments.
    Acts as "Plaid for AI Agents" - connecting agent platforms to payment processing.
    
    **Naming migration (safe aliases):**
    - Preferred terminology: `provider` and `prescription`
    - Backward compatible terminology: `merchant` and `product`
    - Endpoints currently accept both field styles during migration.
    
    **Key Features:**
    - Multi-platform support (ACP, AP2, Voice)
    - Multiple payment methods (Stripe, Circle USDC, Mastercard, Visa)
    - Fraud detection and security
    - Healthcare integration (FHIR, insurance, EHR)
  version: 3.0.0
  contact:
    name: API Support
    email: info@callsomo.com
  license:
    name: Proprietary

servers:
  - url: https://web-production-a783d.up.railway.app
    description: Production server
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: Voice Agent
    description: Voice agent endpoints (Retell, VAPI, etc.)
  - name: ACP
    description: Agentic Commerce Protocol (ChatGPT)
  - name: AP2
    description: Agent Payments Protocol (Google)
  - name: Payment
    description: Payment processing endpoints
  - name: Merchant
    description: Merchant registration and product management
  - name: Admin
    description: Admin dashboard and analytics
  - name: Patient Portal
    description: Patient self-service endpoints
  - name: Circle
    description: Circle USDC wallet and payment endpoints
  - name: FHIR
    description: FHIR R4 compliant healthcare endpoints
  - name: Fraud
    description: Fraud detection and monitoring
  - name: Insurance
    description: Insurance verification and claims
  - name: Public
    description: Unauthenticated catalog and checkout (amounts are server-trusted; do not send authoritative prices from clients)

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication (optional for public endpoints)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message here"
    
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
    
    PaymentRequest:
      type: object
      required:
        - provider_id
        - customer
        - items
        - totals
      properties:
        transaction_id:
          type: string
          example: "tx_abc123"
        provider_id:
          type: string
          example: "provider_123"
        merchant_id:
          type: string
          example: "merchant_123"
          deprecated: true
        customer:
          type: object
          properties:
            name:
              type: string
              example: "John Doe"
            phone:
              type: string
              example: "+1234567890"
            email:
              type: string
              example: "john@example.com"
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                deprecated: true
              prescription_id:
                type: string
              name:
                type: string
              price:
                type: number
              quantity:
                type: integer
        totals:
          type: object
          properties:
            subtotal:
              type: number
            tax:
              type: number
            shipping:
              type: number
            total:
              type: number
        payment:
          type: object
          properties:
            method:
              type: string
              enum: [stripe, link, mastercard, visa, circle]
            currency:
              type: string
              default: USD
    
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: "appt_123"
        patient_name:
          type: string
        patient_phone:
          type: string
        patient_email:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
          example: "14:00"
        appointment_type:
          type: string
        status:
          type: string
          enum: [scheduled, confirmed, cancelled, completed]

paths:
  # ==========================================
  # Voice Agent Endpoints
  # ==========================================
  /voice/incoming:
    post:
      tags: [Voice Agent]
      summary: Handle incoming voice call
      description: Webhook endpoint for voice agent platforms (Retell, VAPI)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /voice/appointments/schedule:
    post:
      tags: [Voice Agent]
      summary: Schedule appointment via voice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_name
                - patient_phone
                - date
                - time
              properties:
                patient_name:
                  type: string
                patient_phone:
                  type: string
                patient_email:
                  type: string
                date:
                  type: string
                  format: date
                time:
                  type: string
                appointment_type:
                  type: string
      responses:
        '200':
          description: Appointment scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  appointment:
                    $ref: '#/components/schemas/Appointment'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /voice/appointments/available-slots:
    post:
      tags: [Voice Agent]
      summary: Get available appointment slots
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
      responses:
        '200':
          description: Available slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  slots:
                    type: array
                    items:
                      type: string

  /voice/appointments/checkout:
    post:
      tags: [Voice Agent, Payment]
      summary: Create checkout for appointment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appointment_id
              properties:
                appointment_id:
                  type: string
                patient_phone:
                  type: string
                patient_email:
                  type: string
      responses:
        '200':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  checkout_id:
                    type: string
                  amount:
                    type: number
                  payment_token:
                    type: string
                  requires_verification:
                    type: boolean
                  email_sent:
                    type: boolean

  /voice/checkout/verify:
    post:
      tags: [Voice Agent, Payment]
      summary: Verify email code and get payment link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_token
                - verification_code
              properties:
                payment_token:
                  type: string
                verification_code:
                  type: string
      responses:
        '200':
          description: Verification successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  payment_link:
                    type: string
                  payment_link_sent:
                    type: boolean

  # ==========================================
  # ACP (ChatGPT) Endpoints
  # ==========================================
  /acp/products:
    get:
      tags: [ACP]
      summary: Get product feed for ChatGPT
      security: []
      parameters:
        - name: merchant_id
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Product feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object

  /acp/checkout:
    post:
      tags: [ACP, Payment]
      summary: Create checkout session for ChatGPT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchant_id
                - session_id
                - items
      responses:
        '200':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object

  # ==========================================
  # AP2 (Google) Endpoints
  # ==========================================
  /ap2/products:
    get:
      tags: [AP2]
      summary: Search products for Google Agent
      security: []
      parameters:
        - name: merchant_id
          in: query
          required: true
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
        - name: intent_mandate
          in: query
          schema:
            type: string
            description: JSON-encoded intent mandate
      responses:
        '200':
          description: Products found
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object

  /ap2/cart:
    post:
      tags: [AP2]
      summary: Create or update cart
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Cart created/updated
          content:
            application/json:
              schema:
                type: object

  /ap2/payment:
    post:
      tags: [AP2, Payment]
      summary: Process payment with AP2 mandate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                type: object

  # ==========================================
  # Payment Endpoints
  # ==========================================
  /api/payment/checkout/{token}:
    get:
      tags: [Payment]
      summary: Get checkout details by token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checkout details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  checkout:
                    type: object
                    description: |
                      Voice checkout row. Includes legacy fields (merchant_id, product_id, product_name)
                      and commerce aliases (provider_id, prescription_id, prescription_name).
                  stripe_publishable_key:
                    type: string

  /api/orders:
    get:
      tags: [Merchant]
      summary: List orders for authenticated tenant (commerce aliases included)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Orders for provider; each row includes provider_id and prescription_id aliases
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  orders:
                    type: array
                    items:
                      type: object
                  prescription_orders:
                    type: array
                    items:
                      type: object
                    description: Same as orders; preferred naming for new clients
                  provider_id:
                    type: string
                  merchant_id:
                    type: string
                  count:
                    type: integer

  /api/prescription-orders:
    get:
      tags: [Merchant]
      summary: Alias of GET /api/orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Same as /api/orders

  /api/payment/process:
    post:
      tags: [Payment]
      summary: Process payment with Stripe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_token
              properties:
                payment_token:
                  type: string
                payment_method_id:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                  default: usd
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  payment_intent_id:
                    type: string
                  status:
                    type: string
                  checkout_id:
                    type: string
                  prescription_checkout_id:
                    type: string
                    description: Alias of checkout_id (voice checkout id)
                  provider_id:
                    type: string
                  merchant_id:
                    type: string
                  prescription_id:
                    type: string
                  product_id:
                    type: string

  /payment/{token}:
    get:
      tags: [Payment]
      summary: Serve payment page
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment page HTML
          content:
            text/html:
              schema:
                type: string

  # ==========================================
  # Merchant Endpoints
  # ==========================================
  /api/merchant/register:
    post:
      tags: [Merchant]
      summary: Register a new merchant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - api_url
              properties:
                name:
                  type: string
                api_url:
                  type: string
                webhook_url:
                  type: string
                enabled_platforms:
                  type: array
                  items:
                    type: string
                    enum: [acp, ap2]
      responses:
        '200':
          description: Merchant registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  merchant:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      api_key:
                        type: string

  /api/merchant/sync-products:
    post:
      tags: [Merchant]
      summary: Sync products from merchant API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchant_id
              properties:
                merchant_id:
                  type: string
                platforms:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Products synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  # ==========================================
  # Admin Endpoints
  # ==========================================
  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get dashboard overview
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  merchants:
                    type: array
                  transactions:
                    type: array
                  revenue:
                    type: object

  /api/admin/appointments:
    get:
      tags: [Admin]
      summary: Get all appointments
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Appointments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  appointments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'

  # ==========================================
  # Patient Portal Endpoints
  # ==========================================
  /api/patient/verify/send:
    post:
      tags: [Patient Portal]
      summary: Send verification code to patient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /api/patient/verify/confirm:
    post:
      tags: [Patient Portal]
      summary: Confirm verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Verification confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  session_id:
                    type: string

  /api/patient/appointments:
    get:
      tags: [Patient Portal]
      summary: Get patient appointments
      security: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  appointments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'

  # ==========================================
  # Circle USDC Endpoints
  # ==========================================
  /api/circle/wallets:
    post:
      tags: [Circle]
      summary: Create Circle wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entityType
                - entityId
              properties:
                entityType:
                  type: string
                  enum: [patient, provider, insurer]
                entityId:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Wallet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  wallet:
                    type: object

  /api/circle/accounts/{entityType}/{entityId}:
    get:
      tags: [Circle]
      summary: Get wallet balance
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [patient, provider, insurer]
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  balance:
                    type: number
                  currency:
                    type: string

  # ==========================================
  # FHIR Endpoints
  # ==========================================
  /fhir/Patient:
    get:
      tags: [FHIR]
      summary: Search patients
      security: []
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: phone
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
      responses:
        '200':
          description: FHIR Bundle of patients
          content:
            application/fhir+json:
              schema:
                type: object
    post:
      tags: [FHIR]
      summary: Create patient
      security: []
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              type: object
      responses:
        '201':
          description: Patient created
          content:
            application/fhir+json:
              schema:
                type: object

  /fhir/Patient/{id}:
    get:
      tags: [FHIR]
      summary: Get patient by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient resource
          content:
            application/fhir+json:
              schema:
                type: object

  /fhir/metadata:
    get:
      tags: [FHIR]
      summary: Get FHIR capability statement
      security: []
      responses:
        '200':
          description: Capability statement
          content:
            application/fhir+json:
              schema:
                type: object

  # ==========================================
  # Fraud Detection Endpoints
  # ==========================================
  /api/fraud/dashboard:
    get:
      tags: [Fraud]
      summary: Get fraud dashboard
      parameters:
        - name: timeframe
          in: query
          schema:
            type: string
            default: 24h
      responses:
        '200':
          description: Fraud dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                  high_risk_pending:
                    type: integer
                  recent_checks:
                    type: array

  # ==========================================
  # Public (catalog + agentic commerce checkout)
  # ==========================================
  /api/public/commerce/quote:
    post:
      tags: [Public, Payment]
      summary: Create a server-locked commerce quote
      description: |
        Persists amount_cents in `checkout_sessions` (platform `commerce_quote`). Use returned `quote_id` with
        `POST /api/public/checkout/start`. Amounts are derived from DB product price × quantity only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
                prescription_id:
                  type: string
                  description: Alias of product_id during naming migration
                provider_id:
                  type: string
                  description: Merchant / provider id
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  quote_id:
                    type: string
                  amount:
                    type: number
                    format: float
                    description: Final total amount charged (may include tax if tax_included is true)
                  subtotal:
                    type: number
                    format: float
                    description: Pre-tax amount
                  tax_amount:
                    type: number
                    format: float
                    description: Tax portion of the total (0 if no tax applies)
                  tax_rate:
                    type: number
                    format: float
                    description: Effective tax rate as a decimal (e.g. 0.08 = 8%)
                  tax_included:
                    type: boolean
                    description: True if amount already includes tax; false if taxes may be added at checkout
                  price_note:
                    type: string
                    description: Human-readable pricing disclosure to relay verbatim for tax status
                  currency:
                    type: string
                  product_id:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/public/checkout/start:
    post:
      tags: [Public, Payment]
      summary: Ensure customer and start product checkout
      description: |
        Payment amounts come from PaymentOrchestrator / DB product price × quantity only.
        Optional `quote_id` must match a live `commerce_quote` session (same merchant/product; stale quotes return 409).
        Idempotency-Key header uses operation `public_checkout_start` (24h dedupe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                phone:
                  type: string
                name:
                  type: string
                product_id:
                  type: string
                prescription_id:
                  type: string
                provider_id:
                  type: string
                quantity:
                  type: integer
                payment_method:
                  type: string
                quote_id:
                  type: string
                  description: From POST /api/public/commerce/quote
                checkout_session_id:
                  type: string
                  description: Alias of quote_id
                idempotency_key:
                  type: string
                  description: Alternative to Idempotency-Key header
      responses:
        '200':
          description: Customer ensured and/or checkout payload
        '400':
          description: Bad request
        '409':
          description: Quote stale (price drift) or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==========================================
  # Webhooks
  # ==========================================
  /webhooks/stripe:
    post:
      tags: [Payment]
      summary: Stripe webhook handler
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

  /webhook/circle:
    post:
      tags: [Circle]
      summary: Circle webhook handler
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

