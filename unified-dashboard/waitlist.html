<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin & Care Waitlist</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --border: #dbe3ef;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 0.95rem;
    }
    textarea { min-height: 88px; resize: vertical; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    button, .secondary {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button { background: var(--accent); color: #fff; flex: 1; }
    button:hover { background: var(--accent-strong); }
    .secondary {
      background: #eef2ff;
      color: #1e293b;
    }
    .status {
      margin-top: 14px;
      font-size: 0.92rem;
      color: var(--muted);
      min-height: 1.25rem;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Join the Skin &amp; Care waitlist</h1>
      <p>Request access now. Approved users receive an invite code and log in via the invite flow.</p>

      <form id="waitlistForm">
        <label for="name">Name</label>
        <input id="name" name="name" required autocomplete="name" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />

        <label for="note">How will you use Skin &amp; Care?</label>
        <textarea id="note" name="note" placeholder="Optional"></textarea>

        <div class="actions">
          <button type="submit" id="submitBtn">Request Access</button>
          <a href="/" class="secondary">Back to Home</a>
        </div>
        <p class="status" id="statusMsg" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('waitlistForm');
    const statusMsg = document.getElementById('statusMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      statusMsg.textContent = 'Submitting...';

      const payload = {
        name: String(form.name.value || '').trim(),
        email: String(form.email.value || '').trim(),
        source: 'web_waitlist_page',
        notes: String(form.note.value || '').trim() || null
      };

      try {
        const res = await fetch('/api/public/waitlist', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        statusMsg.textContent = 'Success. We will send your invite code if approved.';
        form.reset();
      } catch (err) {
        statusMsg.textContent = 'Could not submit right now. Please try again shortly.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
