<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
        }

        body {
            margin: 0;
            padding: 32px;
            background: var(--gray-50);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 32px;
            color: var(--gray-900);
        }

        .header p {
            color: var(--gray-600);
            margin: 0;
        }

        .search-section {
            margin-bottom: 32px;
            padding: 24px;
            background: var(--gray-50);
            border-radius: 8px;
        }

        .search-form {
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .tracking-card {
            margin-top: 24px;
            padding: 24px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #dbeafe; color: #1e40af; }
        .status-preparing { background: #e0e7ff; color: #4338ca; }
        .status-out_for_delivery { background: #fce7f3; color: #9f1239; }
        .status-delivered { background: #d1fae5; color: #065f46; }

        .tracking-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-weight: 600;
            color: var(--gray-900);
        }

        .map-container {
            width: 100%;
            height: 300px;
            background: var(--gray-100);
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-600);
        }

        .events-list {
            margin-top: 24px;
        }

        .event-item {
            padding: 12px;
            background: var(--gray-50);
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
        }

        .event-time {
            font-size: 12px;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .event-message {
            font-weight: 500;
        }

        .error-message {
            padding: 16px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Order Tracking</h1>
            <p>Track your order in real-time</p>
        </div>

        <div class="search-section">
            <form class="search-form" onsubmit="searchOrder(event)">
                <input 
                    type="text" 
                    id="orderSearch" 
                    class="search-input" 
                    placeholder="Enter order ID, email, or phone number"
                    required
                >
                <button type="submit" class="btn btn-primary">Track Order</button>
            </form>
        </div>

        <div id="trackingResult"></div>
    </div>

    <script>
        const API_BASE = window.API_BASE || 'http://localhost:4000';

        // Check for order ID in URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        if (orderId) {
            document.getElementById('orderSearch').value = orderId;
            searchOrderById(orderId);
        }

        async function searchOrder(event) {
            event.preventDefault();
            const query = document.getElementById('orderSearch').value.trim();
            if (!query) return;

            // Try to find order by ID first, then by email/phone
            try {
                // If it looks like an order ID (UUID format)
                if (query.length > 20) {
                    await searchOrderById(query);
                } else {
                    // Search by email or phone
                    await searchOrderByContact(query);
                }
            } catch (error) {
                console.error('Error searching order:', error);
                showError('Failed to search for order. Please try again.');
            }
        }

        async function searchOrderById(orderId) {
            try {
                const response = await fetch(`${API_BASE}/api/orders/${orderId}/tracking`);
                const data = await response.json();

                if (data.success && data.tracking) {
                    displayTracking(data.tracking, orderId);
                } else {
                    showError('Order not found. Please check your order ID.');
                }
            } catch (error) {
                console.error('Error fetching tracking:', error);
                showError('Failed to load tracking information.');
            }
        }

        async function searchOrderByContact(contact) {
            // This would need a new endpoint to search by email/phone
            // For now, show error
            showError('Please enter a full order ID to track your order.');
        }

        function displayTracking(tracking, orderId) {
            const resultDiv = document.getElementById('trackingResult');
            const statusClass = `status-${tracking.delivery_status || 'pending'}`;
            const statusText = (tracking.delivery_status || 'pending').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

            const mapHtml = tracking.current_location ? `
                <div class="map-container">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 8px;">📍</div>
                        <div><strong>Current Location</strong></div>
                        <div style="margin-top: 8px; font-size: 14px;">
                            ${tracking.current_location.address || 
                              `Lat: ${tracking.current_location.latitude.toFixed(6)}, Lng: ${tracking.current_location.longitude.toFixed(6)}`}
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: var(--gray-600);">
                            ${tracking.current_location.latitude.toFixed(6)}, ${tracking.current_location.longitude.toFixed(6)}
                        </div>
                    </div>
                </div>
            ` : '<div class="map-container">Location data not available</div>';

            resultDiv.innerHTML = `
                <div class="tracking-card">
                    <div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="tracking-info">
                        <div class="info-item">
                            <span class="info-label">Order ID</span>
                            <span class="info-value">${orderId.substring(0, 8)}</span>
                        </div>
                        ${tracking.driver_name ? `
                            <div class="info-item">
                                <span class="info-label">Driver</span>
                                <span class="info-value">${tracking.driver_name}</span>
                            </div>
                        ` : ''}
                        ${tracking.driver_phone ? `
                            <div class="info-item">
                                <span class="info-label">Driver Phone</span>
                                <span class="info-value">${tracking.driver_phone}</span>
                            </div>
                        ` : ''}
                        ${tracking.estimated_arrival ? `
                            <div class="info-item">
                                <span class="info-label">Estimated Arrival</span>
                                <span class="info-value">${new Date(tracking.estimated_arrival).toLocaleString()}</span>
                            </div>
                        ` : ''}
                        ${tracking.last_location_update ? `
                            <div class="info-item">
                                <span class="info-label">Last Update</span>
                                <span class="info-value">${new Date(tracking.last_location_update).toLocaleString()}</span>
                            </div>
                        ` : ''}
                    </div>
                    ${mapHtml}
                    ${tracking.events && tracking.events.length > 0 ? `
                        <div class="events-list">
                            <h3 style="margin-bottom: 16px;">Tracking History</h3>
                            ${tracking.events.map(event => `
                                <div class="event-item">
                                    <div class="event-time">${new Date(event.timestamp).toLocaleString()}</div>
                                    <div class="event-message">
                                        <strong>${event.status || 'Update'}</strong>
                                        ${event.message ? ` - ${event.message}` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function showError(message) {
            const resultDiv = document.getElementById('trackingResult');
            resultDiv.innerHTML = `
                <div class="error-message">
                    ${message}
                </div>
            `;
        }
    </script>
</body>
</html>
