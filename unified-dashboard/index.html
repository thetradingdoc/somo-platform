<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>#1 Medical Billing Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Header Section */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 50px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.5px;
            margin: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
        }

        /* Main Content - Logo Section */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo-container {
            text-align: center;
        }

        .logo {
            font-size: 120px;
            font-weight: 300;
            color: #FFFFFF;
            line-height: 1;
            margin-bottom: 0;
            letter-spacing: -8px;
            white-space: nowrap;
            display: inline-block;
        }

        .logo .doc {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: 400;
            color: #FFFFFF;
            display: inline;
        }

        .logo .little {
            font-family: 'Verdana', Geneva, sans-serif;
            font-weight: 700;
            color: #FFFFFF;
            display: inline;
        }

        .logo .dot {
            color: #FFFFFF;
            font-weight: 700;
            display: inline;
        }

        /* Typewriter Animation */
        @keyframes typewriter {
            from {
                max-width: 0;
            }

            to {
                max-width: 100%;
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .logo .doc {
            overflow: hidden;
            max-width: 0;
            animation: typewriter 1s steps(3) 0.5s forwards;
        }

        .logo .little {
            overflow: hidden;
            max-width: 0;
            animation: typewriter 1.2s steps(6) 1.8s forwards;
        }

        .logo .dot {
            opacity: 0;
            animation: fadeInDot 0.3s ease-in 3.2s forwards;
        }

        @keyframes fadeInDot {
            to {
                opacity: 1;
            }
        }

        /* Blinking cursor effect */
        .logo::after {
            content: '|';
            display: inline-block;
            margin-left: 5px;
            animation: blink 0.7s infinite, removeCursor 0.1s 3.5s forwards;
            color: #FFFFFF;
            font-weight: 300;
        }

        @keyframes removeCursor {
            to {
                opacity: 0;
            }
        }

        /* Footer Section */
        .footer {
            position: absolute;
            bottom: 0;
            right: 0;
            padding: 50px 60px;
            z-index: 10;
        }

        .call-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 0;
            background: transparent;
            border: none;
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
        }

        .call-button:hover {
            transform: translateX(5px);
        }

        .call-button::after {
            content: '→';
            font-size: 28px;
            font-weight: 400;
            transition: transform 0.3s ease;
            margin-left: 8px;
        }

        .call-button:hover::after {
            transform: translateX(5px);
        }

        /* Top Right Call Button */
        .top-call-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            background: transparent;
            border: none;
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .top-call-button:hover {
            transform: translateX(5px);
        }

        .top-call-button::after {
            content: '→';
            font-size: 28px;
            font-weight: 400;
            transition: transform 0.3s ease;
        }

        .top-call-button:hover::after {
            transform: translateX(5px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 20px 20px;
                flex-wrap: wrap;
            }

            .header h1 {
                font-size: 18px;
                line-height: 1.3;
                flex: 1;
                min-width: 0;
                word-break: break-word;
            }

            .top-call-button {
                font-size: 18px;
                padding: 8px 0;
                min-width: 60px;
            }

            .top-call-button::after {
                font-size: 20px;
            }

            .logo {
                font-size: 60px;
                letter-spacing: -4px;
            }

            .main-content {
                padding: 20px 15px;
            }

            .footer {
                padding: 20px 20px;
            }

            .call-button {
                font-size: 18px;
                padding: 8px 0;
            }

            .call-button::after {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 15px 15px;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .header h1 {
                font-size: 16px;
                width: 100%;
            }

            .top-call-button {
                font-size: 16px;
                align-self: flex-end;
                padding: 10px 0;
            }

            .top-call-button::after {
                font-size: 18px;
            }

            .logo {
                font-size: 48px;
                letter-spacing: -3px;
            }

            .logo .doc {
                font-size: 1em;
            }

            .logo .little {
                font-size: 1em;
            }

            .main-content {
                padding: 15px 10px;
            }

            .footer {
                padding: 15px 15px;
            }

            .call-button {
                font-size: 16px;
                padding: 10px 0;
                min-height: 44px;
                /* Better touch target */
            }

            .call-button::after {
                font-size: 18px;
            }
        }

        @media (max-width: 360px) {
            .header {
                padding: 12px 12px;
            }

            .header h1 {
                font-size: 14px;
                line-height: 1.2;
            }

            .top-call-button {
                font-size: 14px;
            }

            .logo {
                font-size: 40px;
                letter-spacing: -2px;
            }

            .footer {
                padding: 12px 12px;
            }

            .call-button {
                font-size: 14px;
            }
        }

        /* Ensure buttons are touch-friendly on mobile */
        @media (hover: none) and (pointer: coarse) {

            .top-call-button,
            .call-button {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Animation for smooth entrance */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header,
        .logo-container,
        .footer {
            animation: fadeIn 0.8s ease-out forwards;
        }

        .logo-container {
            animation-delay: 0.2s;
        }

        .footer {
            animation-delay: 0.4s;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <h1>#1 Medical Billing Assistant</h1>
        <button class="top-call-button" onclick="redirectToPortal()">
            Sign in
        </button>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="logo-container">
            <div class="logo">
                <span class="doc">Doc</span><span class="little">Little</span><span class="dot">.</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <button class="call-button" onclick="redirectToAbout()">
            About
        </button>
    </footer>

    <script>
        const apiOrigin = window.location.hostname === 'localhost'
            ? 'http://localhost:4000'
            : '';

        function redirectToPortal() {
            // Single front door for auth: patient vs clinic
            window.location.href = `${apiOrigin}/unified-dashboard/portal.html`;
        }

        function redirectToAbout() {
            // About page is static when served from Netlify, but in local dev we keep it relative
            if (window.location.hostname === 'localhost') {
                window.location.href = 'about.html';
            } else {
                window.location.href = '/about.html';
            }
        }
    </script>
</body>

</html>
