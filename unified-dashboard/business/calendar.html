<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1C35EA">
  <title>Somo Provider - Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FullCalendar (reliable grid) -->

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

  <link rel="stylesheet" href="/assets/css/provider-portal.css">
  <link rel="stylesheet" href="/assets/css/provider-calendar.css">
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-api.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
  <script src="/assets/js/provider-calendar-core.js"></script>

</head>

<body class="provider-portal provider-portal--scroll provider-portal--calendar" data-page="calendar">
  <main class="main-content pp-content pp-content--calendar" id="ppMainContent">
      <div class="pp-page-shell">
      <div class="pp-toolbar">
        <div class="pp-toolbar-brand">
          <span class="pp-toolbar-label">Filters</span>
          <div id="onlineOfflineWrap" style="margin-left:20px;display:flex;align-items:center;gap:8px;">
            <span id="onlineStatusText" class="muted" style="font-size:13px;">Offline</span>
            <button type="button" id="onlineOfflineBtn" class="online-offline-btn offline" title="Toggle Online/Offline">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </button>
          </div>
        </div>
        <div class="pp-toolbar-filters">
          <input type="date" id="dateFilter" class="input" />
          <select id="statusFilter" class="select">
            <option value="">All Statuses</option>
            <option value="scheduled">Scheduled</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input id="providerFilter" placeholder="Provider" class="input" />
          <button type="button" id="createApptBtn" class="pp-btn pp-btn-primary pp-btn-sm">+ Create Appointment</button>
          <button type="button" id="setAvailabilityBtn" class="pp-btn pp-btn-outline pp-btn-sm">Set Availability</button>
          <button type="button" id="outOfOfficeBtn" class="pp-btn pp-btn-ghost pp-btn-sm">Out of Office</button>
          <button type="button" id="refreshBtn" class="pp-btn pp-btn-outline pp-btn-sm">Refresh</button>
        </div>
      </div>

      <div class="pp-cal-controls">
        <div class="pp-cal-layer-toggle" role="group" aria-label="Calendar layer">
          <button type="button" class="pp-cal-layer-btn active" data-layer="appointments">Appointments</button>
          <button type="button" class="pp-cal-layer-btn" data-layer="capacity">Capacity</button>
        </div>
        <div class="pp-cal-view-tabs" role="tablist" aria-label="Calendar view">
          <button type="button" class="pp-cal-view-tab active" data-view="board" role="tab" aria-selected="true">Board</button>
          <button type="button" class="pp-cal-view-tab" data-view="list" role="tab" aria-selected="false">List</button>
          <button type="button" class="pp-cal-view-tab" data-view="week" role="tab" aria-selected="false">Week</button>
          <button type="button" class="pp-cal-view-tab" data-view="month" role="tab" aria-selected="false">Month</button>
        </div>
        <input type="search" id="boardSearch" class="input pp-cal-board-search" placeholder="Search patient…" autocomplete="off" />
      </div>

      <div class="pp-calendar-legend legend">
        <button type="button" class="item legend-filter" data-status-key="scheduled"><span class="dot dot--scheduled"></span> Scheduled</button>
        <button type="button" class="item legend-filter" data-status-key="confirmed"><span class="dot dot--confirmed"></span> Confirmed</button>
        <button type="button" class="item legend-filter" data-status-key="cancelled"><span class="dot dot--cancelled"></span> Cancelled</button>
        <button type="button" class="item legend-filter" data-layer-only="capacity" data-status-key="available"><span class="dot dot--available"></span> Available</button>
        <button type="button" class="item legend-filter" data-layer-only="capacity" data-status-key="out_of_office"><span class="dot dot--ooo"></span> Out of Office</button>
      </div>

      <div id="todayPinnedWrap" style="display:none;">
        <div id="todayPinnedInner">
          <div id="todayPinnedHeader">
            <h2 id="todayPinnedHeadingText">Today</h2>
            <button type="button" id="todayPinnedToggle">Hide</button>
          </div>
          <div id="todayPinnedList"></div>
        </div>
      </div>

      <div id="scheduleBoard" class="pp-schedule-board" data-testid="cal-schedule-board"></div>

      <div id="calendarWrap" hidden>
        <div id="calendar" data-testid="cal-calendar"></div>
      </div>
      </div>
  </main>

  <div id="calendarPanelBackdrop" class="calendar-panel-backdrop" hidden aria-hidden="true"></div>

  <!-- Create Appointment Modal -->
  <div id="createApptModal" class="details-panel" style="display:none;">
    <div class="details-panel-inner">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div style="font-weight:700; color:#0e7490; font-size:18px;">Create New Appointment</div>
        <button onclick="closeCreateModal()" style="border:none;background:none;font-size:20px;cursor:pointer">✖</button>
      </div>
      <form id="createApptForm" style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Patient name *</label>
          <input type="text" id="createPatientSearch" class="input" required placeholder="Type name to search or enter manually" style="width:100%;" autocomplete="off" />
          <div id="createPatientSearchResults" style="display:none; margin-top:4px; max-height:160px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; background:#fff;"></div>
        </div>
        <input type="hidden" id="createPatientId" />
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Patient Phone *</label>
          <input type="tel" id="createPatientPhone" class="input" required style="width:100%;" placeholder="+1234567890" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Patient Email</label>
          <input type="email" id="createPatientEmail" class="input" style="width:100%;" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Appointment Type</label>
          <select id="createApptType" class="select" style="width:100%;">
            <option value="Mental Health Somoation">Mental Health Somoation</option>
            <option value="Video Somoation">Video Somoation</option>
            <option value="Follow-up Session">Follow-up Session</option>
            <option value="Initial Assessment">Initial Assessment</option>
            <option value="Crisis Intervention">Crisis Intervention</option>
            <option value="Group Therapy">Group Therapy</option>
            <option value="Medication Review">Medication Review</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Date *</label>
          <input type="date" id="createApptDate" class="input" required style="width:100%;" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Time *</label>
          <input type="time" id="createApptTime" class="input" required style="width:100%;" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Provider</label>
          <input type="text" id="createProvider" class="input" style="width:100%;" placeholder="Somo Care Team" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Notes</label>
          <textarea id="createNotes" class="input" style="width:100%;min-height:60px;resize:vertical;"></textarea>
        </div>
        <div id="createApptError" style="color:#ef4444;font-size:14px;display:none;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
          <button type="button" onclick="closeCreateModal()" class="btn" style="background:#e5e7eb;color:#374151;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="background:#10b981;">Create Appointment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Set Availability / Out of Office Modal -->
  <div id="availabilityModal" class="details-panel" style="display:none;">
    <div class="details-panel-inner">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div id="availabilityModalTitle" style="font-weight:700; color:#0e7490; font-size:18px;">Set Availability</div>
        <button onclick="closeAvailabilityModal()" style="border:none;background:none;font-size:20px;cursor:pointer">✖</button>
      </div>
      <form id="availabilityForm" style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Start Date *</label>
          <input type="date" id="avbStartDate" class="input" required style="width:100%;" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">Start Time *</label>
          <input type="time" id="avbStartTime" class="input" required style="width:100%;" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">End Date *</label>
          <input type="date" id="avbEndDate" class="input" required style="width:100%;" />
        </div>
        <div>
          <label style="display:block;font-weight:600;margin-bottom:4px;color:#374151;">End Time *</label>
          <input type="time" id="avbEndTime" class="input" required style="width:100%;" />
        </div>
        <div id="avbError" style="color:#ef4444;font-size:14px;display:none;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">

    </div>
  </div>

  <!-- Details Side Panel (replaces full-screen overlay) -->
  <div id="detailsModal" class="details-panel">
    <div class="details-panel-inner">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div style="font-weight:700; color:#0e7490">Appointment Details</div>
        <button onclick="closeModal()" style="border:none;background:none;font-size:20px;cursor:pointer">✖</button>
      </div>
      <div id="detailsModalSubtitle" style="display:none;" aria-live="polite"></div>
      <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:8px;" role="tablist" aria-label="Appointment details">
        <button id="tabOverview" type="button" role="tab" aria-selected="true" aria-controls="modalContent" class="btn btn-primary" style="padding:6px 10px;">Overview</button>
        <button id="tabClinical" type="button" role="tab" aria-selected="false" aria-controls="modalContent" class="btn" style="padding:6px 10px;">Clinical prep</button>
        <button id="tabEHR" type="button" role="tab" aria-selected="false" aria-controls="modalContent" class="btn" style="padding:6px 10px;">EHR</button>

        <input type="date" id="rsDate" class="input" />
        <input type="text" id="rsTime" placeholder="e.g., 3:00 PM" class="input" />
        <select id="rsType" class="select">
          <option>Somoation</option>
          <option>Crisis Intervention</option>
          <option>Follow-up Session</option>
