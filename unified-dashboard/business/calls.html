<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Somo Provider - Calls</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/provider-portal.css">
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-api.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
  <script src="/assets/js/voice-agent-page.js"></script>
  <style>
    .pp-call-row { display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--border,#e5e7eb); cursor:pointer; }
    .pp-call-row.is-active { background:rgba(22,166,55,.08); }
    .pp-call-row-meta { font-size:12px; color:var(--muted,#64748b); }
    .pp-call-pill { font-size:11px; padding:2px 8px; border-radius:999px; background:#f1f5f9; white-space:nowrap; }
    .pp-call-pill--elig { background:#ecfdf3; color:#166534; }
    .pp-call-pill--copay { background:#eff6ff; color:#1d4ed8; }
    @media (max-width:720px) { .pp-call-row { grid-template-columns:1fr; } }
  </style>
</head>
<body class="provider-portal provider-portal--scroll" data-page="calls">
  <div class="pp-app" id="ppAppMount"></div>
  <script>
    const API_BASE = window.API_BASE || window.location.origin;

    function escapeHtml(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatWhen(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString(); } catch (_) { return iso; }
    }

    function pill(label, cls) {
      return label ? `<span class="pp-call-pill ${cls || ''}">${escapeHtml(label)}</span>` : '';
    }

    async function loadCalls() {
      const listEl = document.getElementById('ppCallsList');
      listEl.innerHTML = '<div class="pp-skeleton"></div>';
      try {
        const json = await (window.ppApi?.get('/api/customer/dashboard/calls?limit=50') ||
          fetch(`${API_BASE}/api/customer/dashboard/calls?limit=50`, { credentials: 'include' }).then(r => r.json()));
        const calls = json.calls || [];
        if (!calls.length) {
          listEl.innerHTML = window.ppDentalEmptyState
            ? window.ppDentalEmptyState(
                'No calls yet',
                'When Kelly answers your line, calls appear here with eligibility and copay details.',
                { href: 'agent.html', label: 'Configure Kelly' }
              )
            : '<div class="pp-empty">No calls yet. When Kelly answers your line, calls appear here.</div>';
          return;
        }
        listEl.innerHTML = calls.map((c) => {
          const sid = c.call_id || c.id;
          const disp = c.disposition || c.outcome || '—';
          const dispLabel = window.VoiceAgentPage?.dispositionLabel?.(disp) || disp;
          const elig = c.eligibility_status ? String(c.eligibility_status).replace(/_/g, ' ') : '';
          const copay = c.copay_quote != null ? `$${Number(c.copay_quote).toFixed(2)}` : '';
          return `<div class="pp-call-row" data-session-id="${escapeHtml(sid)}" role="button" tabindex="0">
            <div>
              <div class="pp-call-row-title">${escapeHtml(c.direction || 'inbound')} · ${escapeHtml(c.status || 'completed')}</div>
              <div class="pp-call-row-meta">${formatWhen(c.created_at)}</div>
            </div>
            ${pill(dispLabel)}
            ${pill(elig, 'pp-call-pill--elig')}
            ${pill(copay, 'pp-call-pill--copay')}
          </div>`;
        }).join('');
        listEl.querySelectorAll('.pp-call-row').forEach((row) => {
          row.addEventListener('click', () => selectCall(row.dataset.sessionId, row));
        });
        const deep = new URLSearchParams(location.search).get('session');
        if (deep) {
          const row = listEl.querySelector(`[data-session-id="${CSS.escape(deep)}"]`);
          selectCall(deep, row);
        }
      } catch (e) {
        listEl.innerHTML = `<div class="pp-provision-banner error">${escapeHtml(e.message)}</div>`;
      }
    }

    async function selectCall(sessionId, rowEl) {
      document.querySelectorAll('.pp-call-row').forEach((r) => r.classList.remove('is-active'));
      if (rowEl) rowEl.classList.add('is-active');
      const detail = document.getElementById('ppCallDetail');
      detail.innerHTML = '<div class="pp-skeleton"></div>';
      try {
        const json = await (window.ppApi?.get(`/api/kelly/calls/${encodeURIComponent(sessionId)}`) ||
          fetch(`${API_BASE}/api/kelly/calls/${encodeURIComponent(sessionId)}`, { credentials: 'include' }).then(r => r.json()));
        const summary = json.call_summary || {};
        let html = `<div class="pp-call-detail" data-testid="pp-call-detail">
          <p><strong>Session</strong> ${escapeHtml(sessionId)}</p>
          <p><strong>Events</strong> ${json.event_count || 0}</p>`;
        if (summary.disposition || summary.eligibility_status || summary.copay_quote_display) {
          html += '<div class="pp-call-summary" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">';
          if (summary.disposition) html += pill(window.VoiceAgentPage?.dispositionLabel?.(summary.disposition) || summary.disposition);
          if (summary.eligibility_status) html += pill(summary.eligibility_status, 'pp-call-pill--elig');
          if (summary.copay_quote_display) html += pill(`Copay ${summary.copay_quote_display}`, 'pp-call-pill--copay');
          html += '</div>';
        }
        if (summary.conversation_mode || summary.final_lane) {
          html += '<div class="pp-call-summary">';
          if (summary.routing_world) {
            html += `<span class="pp-status-pill pp-status-pill--world">${escapeHtml(summary.routing_world)}</span> `;
          }
          if (summary.conversation_mode) {
            html += `<span class="pp-status-pill">${escapeHtml(summary.conversation_mode)}</span> `;
          }
          if (summary.final_lane) {
            html += `<span class="pp-status-pill pp-status-pill--muted">Lane: ${escapeHtml(summary.final_lane)}</span>`;
          }
          html += '</div>';
        }
        if (json.appointment) {
          html += `<p><a class="pp-btn pp-btn-link" href="calendar.html?id=${encodeURIComponent(json.appointment.id)}">Open appointment</a></p>`;
        }
        if (json.tools?.length) {
          html += '<h4>Tools</h4>' + json.tools.map((t) =>
            `<div class="pp-event-line">${escapeHtml(t.tool || '—')} · ${escapeHtml(t.type)}${t.success === false ? ' (failed)' : ''}</div>`
          ).join('');
        }
        if (json.booking_outcome) {
          html += `<h4>Booking</h4><div class="pp-event-line">${escapeHtml(JSON.stringify(json.booking_outcome))}</div>`;
        }
        if (json.handoff_escalations?.length) {
          html += '<h4>Handoff escalations</h4>' + json.handoff_escalations.map((h) =>
            `<div class="pp-event-line">${escapeHtml(h.reason || 'handoff')} · ${escapeHtml(h.outcome || '—')}${h.pstn_target ? ' → ' + escapeHtml(h.pstn_target) : ''} · ${formatWhen(h.created_at)}</div>`
          ).join('');
        }
        html += '</div>';
        detail.innerHTML = html;
      } catch (e) {
        detail.innerHTML = `<div class="pp-provision-banner error">${escapeHtml(e.message)}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.requireAuth === 'function') window.requireAuth();
      mountProviderPage({
        activeId: 'calls',
        eyebrow: 'Voice',
        title: 'Call log',
        subtitle: 'Eligibility, copay quotes, and disposition per call'
      });
      const main = document.getElementById('ppMainContent');
      main.innerHTML = `
        <div class="pp-page-shell">
          <div class="pp-calls-layout">
            <section class="pp-panel">
              <div class="pp-panel-head"><div class="pp-panel-title">Recent calls</div></div>
              <div class="pp-panel-body" id="ppCallsList" data-testid="pp-calls-list"></div>
            </section>
            <section class="pp-panel">
              <div class="pp-panel-head"><div class="pp-panel-title">Call detail</div></div>
              <div class="pp-panel-body" id="ppCallDetail"><div class="pp-empty">Select a call to see Kelly activity.</div></div>
            </section>
          </div>
        </div>`;
      loadCalls();
    });
  </script>
</body>
</html>
