<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16a637">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Somo Provider - Patients</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/provider-portal.css">
  <link rel="stylesheet" href="/assets/css/provider-patients.css?v=7">
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-api.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
</head>
<body class="provider-portal provider-portal--patients" data-page="patients">
  <main class="main-content pp-content pp-content--patients" id="ppMainContent">
        <div class="pp-page-shell">
        <div class="pp-alert-strip pp-alert-strip--compact" id="ppAlertStrip" hidden aria-live="polite"></div>
        <div id="patientsDebugStrip" class="pp-patients-debug" hidden aria-live="polite"></div>
        <div class="pp-kpi-row pp-kpi-row-4" id="patientsKpiRow">
          <div class="pp-kpi-card"><div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div></div>
          <div class="pp-kpi-card"><div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div></div>
          <div class="pp-kpi-card"><div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div></div>
          <div class="pp-kpi-card"><div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div></div>
        </div>
        <section class="pp-panel pp-panel--primary sfd-card">
          <div class="pp-panel-head">
            <div>
              <div class="pp-panel-title">Patient roster</div>
              <div class="pp-panel-sub">Search and open a patient case <span id="patientsBuildTag" class="pp-patients-build" hidden></span></div>
              <div class="pp-patients-filter-hint" id="patientsFilterHint" hidden aria-live="polite"></div>
            </div>
            <div class="pp-panel-tabs" id="patientFilters" role="tablist" aria-label="Patient filters">
              <button type="button" class="pp-ptab act" data-filter="all" role="tab" aria-selected="true">All patients</button>
              <button type="button" class="pp-ptab" data-filter="ehr" role="tab" aria-selected="false">EHR linked</button>
              <button type="button" class="pp-ptab" data-filter="coverage" role="tab" aria-selected="false">With coverage</button>
            </div>
          </div>
          <div class="pp-panel-body pp-panel-body--patients">
            <div class="pp-patients-search">
              <div class="pp-patients-search-wrap">
                <span class="pp-search-icon" aria-hidden="true">&#128269;</span>
                <input type="search" id="searchInput" class="pp-input" data-testid="pp-patient-search" placeholder="Search by name, phone, or email…" autocomplete="off" />
              </div>
            </div>
            <div id="patientsOpenCaseBanner" class="pp-patients-open-case-banner" hidden>
              <span>Patient highlighted from your link.</span>
              <a class="pp-btn pp-btn-primary pp-btn-sm" href="patient-case.html">Open case</a>
            </div>
            <div class="pp-patients-grid" id="patientsRosterGrid" data-testid="pp-patients-list" data-roster-mount>
              <div class="pp-patients-empty sfd-empty-state" id="patientsRosterLoading">
                <div class="sfd-skeleton"><div class="sfd-skeleton-line"></div><div class="sfd-skeleton-line sfd-skeleton-line--short"></div></div>
                <p>Fetching roster from your clinic…</p>
              </div>
            </div>
            <div id="insCoverageMount"></div>
          </div>
        </section>
        </div>
  </main>
  <script>
        const API_BASE = window.API_BASE || window.location.origin || 'http://localhost:4000';
        const MERCHANT_API = `${API_BASE}/api`;
        const PATIENTS_BUILD = 'roster-grid-2026-06-03c';
        const PATIENTS_DEBUG = /[?&]debug=1/.test(location.search)
            || localStorage.getItem('patientsDebug') === '1';
        let allCustomers = [];
        let patientContextMap = {};
        let patientsBooted = false;
        let rosterLoadState = 'idle';
        const PATIENTS_TELEMETRY_PHASES = new Set([
            'init:start', 'init:pre-load', 'init:done', 'init:error',
            'load:merged', 'render:enter', 'render:done', 'render:no-container'
        ]);

        function patientsTelemetry(phase, data, status) {
            if (!PATIENTS_DEBUG || !PATIENTS_TELEMETRY_PHASES.has(phase)) return;
            const detail = JSON.stringify({ build: PATIENTS_BUILD, ...(data || {}) }).slice(0, 480);
            fetch(`${API_BASE}/api/rcm/ui-telemetry`, {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    ...(window.ppGetAuthHeaders?.() || {})
                },
                body: JSON.stringify({ page: 'patients', panel: phase, status: status || 'info', detail })
            }).catch(() => {});
        }

        function patientsDbg(phase, data, status) {
            const payload = { build: PATIENTS_BUILD, phase, ...(data || {}) };
            if (!PATIENTS_DEBUG) return payload;
            console.info('[patients]', payload);
            patientsTelemetry(phase, data, status);
            const strip = document.getElementById('patientsDebugStrip');
            if (strip) {
                strip.hidden = false;
                strip.textContent = `${phase}: ${JSON.stringify(data || {})}`;
            }
            return payload;
        }

        function rosterDomSnapshot() {
            const grid = document.getElementById('patientsRosterGrid');
            const main = document.getElementById('ppMainContent');
            return {
                readyState: document.readyState,
                hasGrid: !!grid,
                hasMain: !!main,
                gridChildCount: grid ? grid.childElementCount : 0,
                cardCount: document.querySelectorAll('#patientsRosterGrid .pp-patient-card').length,
                loadingText: grid ? /Loading patients/i.test(grid.textContent) : null,
                containerId: document.getElementById('patientsRosterGrid')?.id
                    || document.getElementById('customersList')?.id
                    || null
            };
        }
        const requestedPatientId = (() => {
            try {
                const p = new URLSearchParams(window.location.search);
                return p.get('patient_id') || p.get('patientId') || '';
            } catch (_) { return ''; }
        })();
        const openCaseRequested = (() => {
            try {
                return new URLSearchParams(window.location.search).get('open_case') === '1';
            } catch (_) { return false; }
        })();
        if (openCaseRequested && requestedPatientId) {
            window.location.replace(`patient-case.html?patient_id=${encodeURIComponent(requestedPatientId)}`);
        }

        function escapeHtml(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
        }

        function authFetchOpts(extraHeaders) {
            return {
                credentials: 'include',
                headers: {
                    Accept: 'application/fhir+json, application/json',
                    ...(window.ppGetAuthHeaders?.() || {}),
                    ...(extraHeaders || {})
                }
            };
        }

        function patientsPanelBody() {
            return document.querySelector('.pp-panel-body--patients');
        }

        function scrubPatientsPanelDebris(panelBody) {
            const panel = panelBody || patientsPanelBody();
            if (!panel) return;
            panel.classList.remove('pp-inline-iconized');
            const grid = document.getElementById('patientsRosterGrid');
            const keepIds = new Set(['patientsRosterGrid', 'insCoverageMount']);
            [...panel.children].forEach((child) => {
                if (child.classList.contains('pp-patients-search')) return;
                if (keepIds.has(child.id)) return;
                if (/Loading patients/i.test(child.textContent || '')) {
                    child.remove();
                    return;
                }
                if (child.classList.contains('pp-inline-iconized') || child.classList.contains('pp-patients-empty')) {
                    child.remove();
                }
            });
            panel.querySelectorAll('.pp-inline-iconized, .pp-patients-empty').forEach((el) => {
                if (grid && grid.contains(el)) return;
                if (/Loading patients/i.test(el.textContent || '')) el.remove();
            });
            removeOrphanRosterPlaceholders(panel, grid);
        }

        function removeOrphanRosterPlaceholders(panelBody, grid) {
            if (!panelBody) return;
            panelBody.querySelectorAll('#patientsRosterLoading, .pp-patients-empty').forEach((el) => {
                if (grid && (grid === el || grid.contains(el))) return;
                el.remove();
            });
        }

        function showRosterLoading() {
            rosterLoadState = 'loading';
            const container = rosterContainer();
            if (!container) return;
            container.innerHTML = `
                <div class="pp-patients-empty" id="patientsRosterLoading">
                    <div class="pp-patients-empty-title">Loading patients</div>
                    <p>Fetching roster from your clinic…</p>
                </div>`;
        }

        function ensureRosterMount() {
            let grid = document.getElementById('patientsRosterGrid');
            const panelBody = document.querySelector('.pp-panel-body--patients')
                || document.querySelector('.pp-panel-body')
                || document.getElementById('ppMainContent');
            if (grid) {
                scrubPatientsPanelDebris(panelBody);
                return grid;
            }

            const legacy = document.getElementById('customersList');
            if (legacy) {
                legacy.classList.add('pp-patients-grid');
                legacy.id = 'patientsRosterGrid';
                legacy.setAttribute('data-testid', 'pp-patients-list');
                legacy.setAttribute('data-roster-mount', '');
                removeOrphanRosterPlaceholders(panelBody, legacy);
                patientsDbg('mount:legacy-customersList', { className: legacy.className }, 'warn');
                return legacy;
            }

            const oldRoster = document.getElementById('patientsRoster');
            if (oldRoster && oldRoster.parentElement) {
                grid = document.createElement('div');
                grid.className = 'pp-patients-grid';
                grid.id = 'patientsRosterGrid';
                grid.setAttribute('data-testid', 'pp-patients-list');
                grid.setAttribute('data-roster-mount', '');
                while (oldRoster.firstChild) grid.appendChild(oldRoster.firstChild);
                oldRoster.parentElement.replaceChild(grid, oldRoster);
                patientsDbg('mount:replaced-patientsRoster', {}, 'warn');
                return grid;
            }

            if (!panelBody) return null;
            removeOrphanRosterPlaceholders(panelBody, null);
            grid = document.createElement('div');
            grid.className = 'pp-patients-grid';
            grid.id = 'patientsRosterGrid';
            grid.setAttribute('data-roster-mount', '');
            grid.setAttribute('data-testid', 'pp-patients-list');
            grid.innerHTML = `
                <div class="pp-patients-empty" id="patientsRosterLoading">
                    <div class="pp-patients-empty-title">Loading patients</div>
                    <p>Fetching roster from your clinic…</p>
                </div>`;
            const search = panelBody.querySelector('.pp-patients-search');
            if (search && search.nextSibling) {
                panelBody.insertBefore(grid, search.nextSibling);
            } else {
                panelBody.appendChild(grid);
            }
            patientsDbg('mount:created-grid', { panel: panelBody.className }, 'warn');
            scrubPatientsPanelDebris(panelBody);
            return grid;
        }

        function rosterContainer() {
            return (
                ensureRosterMount() ||
                document.querySelector('[data-roster-mount]') ||
                document.querySelector('#ppMainContent .pp-patients-grid') ||
                document.querySelector('.pp-panel-body--patients .pp-patients-grid')
            );
        }

        async function parseJsonResponse(res) {
            const ct = (res.headers.get('content-type') || '').toLowerCase();
            if (ct.includes('text/html')) {
                throw new Error('Server returned HTML instead of data. Restart middleware after pulling latest changes.');
            }
            return res.json();
        }

        function showRosterError(message) {
            rosterLoadState = 'error';
            const container = rosterContainer();
            scrubPatientsPanelDebris();
            if (!container) {
                patientsDbg('render:no-container', { message, ...rosterDomSnapshot() }, 'error');
                console.error('patients roster container missing:', message, rosterDomSnapshot());
                return;
            }
            container.innerHTML = `
                    <div class="pp-patients-empty">
                        <div class="pp-patients-empty-title">Could not load patients</div>
                        <p>${escapeHtml(message || 'Make sure middleware is running.')}</p>
                        <button type="button" class="pp-btn pp-btn-outline pp-btn-sm" id="patientsRetryBtn">Retry</button>
                    </div>
                `;
            document.getElementById('patientsRetryBtn')?.addEventListener('click', () => loadCustomers());
        }

        function wirePatientsPage() {
            document.getElementById('patientFilters')?.addEventListener('click', (ev) => {
                const btn = ev.target.closest('[data-filter]');
                if (!btn) return;
                filterCustomers(btn.getAttribute('data-filter') || 'all');
                document.querySelectorAll('#patientFilters .pp-ptab').forEach((t) => {
                    t.classList.remove('act');
                    t.setAttribute('aria-selected', 'false');
                });
                btn.classList.add('act');
                btn.setAttribute('aria-selected', 'true');
            });
            document.getElementById('searchInput')?.addEventListener('input', () => searchCustomers());
            document.getElementById('ppFocusSearchBtn')?.addEventListener('click', () => {
                document.getElementById('searchInput')?.focus();
            });
            const rosterEl = rosterContainer();
            if (rosterEl && !rosterEl.dataset.rosterClickBound) {
                rosterEl.dataset.rosterClickBound = '1';
                rosterEl.addEventListener('click', (ev) => {
                if (ev.target.closest('[data-action-chip]')) {
                    ev.stopPropagation();
                    return;
                }
                const actionBtn = ev.target.closest('button[data-action]');
                if (actionBtn) {
                    ev.stopPropagation();
                    const card = actionBtn.closest('.pp-patient-card');
                    const pid = card?.getAttribute('data-patient-id');
                    if (!pid) return;
                    const action = actionBtn.getAttribute('data-action');
                    if (action === 'case') viewPatientBilling(pid);
                    else if (action === 'contact') contactCustomer(actionBtn.getAttribute('data-phone') || '');
                    else if (action === 'ehr') viewPatientEhrDetails(pid);
                    return;
                }
                const card = ev.target.closest('.pp-patient-card');
                if (!card) return;
                const href = card.getAttribute('data-case-href');
                if (href) window.location.href = href;
                });
            }
        }

        async function initPatients() {
            patientsDbg('init:start', rosterDomSnapshot());
            if (typeof window.requireAuth === 'function' && !window.requireAuth()) {
                patientsDbg('init:auth-blocked', {});
                return;
            }
            await new Promise((r) => setTimeout(r, 150));
            const searchParams = new URLSearchParams(window.location.search);
            if (searchParams.get('focus') === 'search' || searchParams.has('search')) {
                setTimeout(() => document.getElementById('searchInput')?.focus(), 100);
            }
            if (typeof mountProviderPage === 'function') {
                mountProviderPage({
                    activeId: 'patients',
                    eyebrow: 'Patients',
                    title: 'Patient roster',
                    subtitle: 'Patients, payers, and billing summary.',
                    topbarActions: '<button type="button" class="pp-btn pp-btn-outline pp-btn-sm" id="ppFocusSearchBtn">Search roster</button>'
                });
            } else {
                window.initProviderShell({ activeId: 'patients', useGreeting: false });
            }
            scrubPatientsPanelDebris();
            ensureRosterMount();
            wirePatientsPage();
            patientsDbg('init:pre-load', rosterDomSnapshot());
            await loadRosterStats();
            await loadCustomers();
            patientsDbg('init:done', rosterDomSnapshot());
        }

        function bootPatients(force) {
            if (patientsBooted && !force) return;
            patientsBooted = true;
            const buildTag = document.getElementById('patientsBuildTag');
            if (buildTag) {
                if (PATIENTS_DEBUG) {
                    buildTag.hidden = false;
                    buildTag.textContent = `· ${PATIENTS_BUILD}`;
                } else {
                    buildTag.hidden = true;
                    buildTag.textContent = '';
                }
            }
            if (PATIENTS_DEBUG) document.documentElement.dataset.patientsBuild = PATIENTS_BUILD;
            initPatients().catch((e) => {
                patientsDbg('init:error', { message: e && e.message }, 'error');
                showRosterError(e.message);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => bootPatients(false), { once: true });
        } else {
            bootPatients(false);
        }

        window.addEventListener('pageshow', (ev) => {
            if (!ev.persisted) return;
            patientsBooted = false;
            patientsDbg('pageshow:bfcache', rosterDomSnapshot(), 'warn');
            bootPatients(true);
        });

        window.__patientsPage = {
            build: PATIENTS_BUILD,
            snapshot: rosterDomSnapshot,
            getAllCustomers: () => allCustomers,
            rerender: () => applyPatientFilters()
        };

        function normalizeFhirPatientId(raw) {
            const s = String(raw || '').trim();
            if (!s) return '';
            return s.replace(/^Patient\//i, '');
        }

        function mergeRosterLists(...lists) {
            const byId = new Map();
            for (const list of lists) {
                for (const p of list || []) {
                    const id = normalizeFhirPatientId(p.fhir_id || p.fhir_patient_id || p.id);
                    if (!id) continue;
                    const prev = byId.get(id);
                    byId.set(id, prev ? { ...prev, ...p, fhir_id: id } : { ...p, fhir_id: id });
                }
            }
            return [...byId.values()];
        }

        async function mergePatientsFromAppointments(existing) {
            const byId = new Map((existing || []).map((p) => [normalizeFhirPatientId(p.fhir_id), p]));
            try {
                const end = new Date();
                const start = new Date(end);
                start.setDate(start.getDate() - 90);
                const url = new URL(`${API_BASE}/api/admin/appointments`);
                url.searchParams.set('start_date', start.toISOString().slice(0, 10));
                url.searchParams.set('end_date', end.toISOString().slice(0, 10));
                const res = await fetch(url, authFetchOpts());
                const json = await parseJsonResponse(res);
                if (!json.success || !Array.isArray(json.appointments)) return [...byId.values()];
                for (const appt of json.appointments) {
                    const pid = normalizeFhirPatientId(appt.fhir_patient_id || appt.patient_id || appt.patient_fhir_id);
                    if (!pid || byId.has(pid)) continue;
                    byId.set(pid, {
                        fhir_id: pid,
                        customer_name: appt.patient_name || appt.patient_display || 'Patient',
                        customer_phone: appt.patient_phone || '',
                        customer_email: appt.patient_email || '',
                        birthDate: null,
                        address: null,
                        eligibility: null,
                        ehr_data: null
                    });
                }
            } catch (err) {
                console.debug('Appointments roster fallback skipped', err);
            }
            return [...byId.values()];
        }

        async function fetchFhirPatientRows() {
            const url = new URL(`${API_BASE}/fhir/Patient`);
            url.searchParams.set('_count', '100');
            const response = await fetch(url, authFetchOpts());
            const bundle = await parseJsonResponse(response);
            if (!response.ok || bundle.resourceType === 'OperationOutcome') {
                throw new Error(bundle.issue?.[0]?.diagnostics || 'Failed to load patients');
            }
            if (bundle.resourceType !== 'Bundle') {
                throw new Error('Invalid FHIR response');
            }
            return (bundle.entry || []).map((e) => e.resource).map((r) => {
                const name = (r.name && r.name[0]) ? `${(r.name[0].given || [''])[0]} ${r.name[0].family || ''}`.trim() : 'Unknown Patient';
                const telecom = r.telecom || [];
                const phone = (telecom.find((t) => t.system === 'phone') || {}).value || '';
                const email = (telecom.find((t) => t.system === 'email') || {}).value || '';
                return {
                    fhir_id: normalizeFhirPatientId(r.id),
                    customer_name: name,
                    customer_phone: phone,
                    customer_email: email,
                    birthDate: r.birthDate || null,
                    address: r.address && r.address[0] ? r.address[0] : null,
                    eligibility: null,
                    ehr_data: null
                };
            }).filter((p) => p.fhir_id);
        }

        function clinicQ() {
            const id = localStorage.getItem('clinic_id');
            return id ? `?clinic_id=${encodeURIComponent(id)}` : '';
        }

        async function loadRosterStats() {
            try {
                const res = await fetch(`${API_BASE}/api/tenant/roster/stats${clinicQ()}`, authFetchOpts());
                const data = await res.json();
                if (data.success && data.roster_count != null) {
                    const hint = document.getElementById('patientsFilterHint');
                    if (hint) {
                        hint.hidden = false;
                        hint.textContent = `${data.roster_count} patient(s) on roster · CSV import in Settings → Practice`;
                    }
                }
            } catch (_) {}
        }

        async function enrichPatients(patients) {
            const cap = 40;
            const slice = patients.slice(0, cap);
            const enriched = await Promise.all(slice.map(async (p) => {
                    try {
                        // Fetch eligibility data (Stedi coverage/benefits)
                        let eligibilityData = null;
                        try {
                            const eligRes = await fetch(`${API_BASE}/api/tenant/patients/${encodeURIComponent(p.fhir_id)}/eligibility${clinicQ()}`, authFetchOpts());
                            const eligResult = await eligRes.json();
                            if (eligResult.success && eligResult.eligibility && eligResult.eligibility.length > 0) {
                                // Get the most recent eligibility check
                                eligibilityData = eligResult.eligibility[0];
                            }
                        } catch (eligError) {
                            // Eligibility data not available - silently continue
                            console.debug(`No eligibility data for patient ${p.fhir_id}`);
                        }

                        // Fetch EHR data from Epic
                        let ehrData = null;
                        try {
                            const ehrRes = await fetch(`${API_BASE}/api/admin/patients/${encodeURIComponent(p.fhir_id)}/ehr-summary`, authFetchOpts());
                            if (ehrRes.ok) {
                                const ehrResult = await ehrRes.json();
                                if (ehrResult.success && ehrResult.encounters && ehrResult.encounters.length > 0) {
                                    ehrData = ehrResult;
                                }
                            }
                        } catch (ehrError) {
                            // EHR data not available - silently continue
                            console.debug(`No EHR data for patient ${p.fhir_id}`);
                        }

                        return {
                            ...p,
                            eligibility: eligibilityData,
                            ehr_data: ehrData
                        };
                    } catch { return { ...p, eligibility: null, ehr_data: null }; }
                }));
            if (patients.length > cap) return enriched.concat(patients.slice(cap));
            const enrichedList = enriched;
            try {
                if (typeof window.ppFetchPatientContext === 'function') {
                    const ids = enrichedList.map((p) => p.fhir_id).filter(Boolean);
                    const ctx = await window.ppFetchPatientContext(ids);
                    patientContextMap = { ...patientContextMap, ...ctx };
                }
            } catch (ctxErr) {
                console.debug('[patients] patient context skipped', ctxErr);
            }
            return enrichedList;
        }

        async function loadCustomers() {
            showRosterLoading();
            try {
                const fromAppts = await mergePatientsFromAppointments([]);
                let fromFhir = [];
                try {
                    fromFhir = await fetchFhirPatientRows();
                } catch (fhirErr) {
                    console.warn('[patients] FHIR roster skipped:', fhirErr.message);
                }

                allCustomers = mergeRosterLists(fromFhir, fromAppts);
                patientsDbg('load:merged', { fhir: fromFhir.length, appts: fromAppts.length, total: allCustomers.length });
                applyPatientFilters();
                renderPatientsKpis(allCustomers);

                if (!allCustomers.length) {
                    rosterLoadState = 'ready';
                    applyPatientFilters();
                    return;
                }

                // Enrich eligibility/EHR in background — roster already visible.
                enrichPatients(allCustomers).then((enriched) => {
                    allCustomers = enriched;
                    applyPatientFilters();
                    renderPatientsKpis(allCustomers);
                }).catch((err) => console.warn('[patients] enrichment skipped', err));
            } catch (error) {
                console.error('Error loading patients/customers:', error);
                showRosterError(error.message);
                renderPatientsKpis(allCustomers || []);
            }
        }

        function renderPatientsKpis(customers) {
            const total = customers.length;
            const withEhr = customers.filter(c => c.ehr_data && c.ehr_data.encounters && c.ehr_data.encounters.length > 0).length;
            const withFhir = customers.filter(c => c.fhir_id).length;
            const withCoverage = customers.filter(c => c.eligibility && c.eligibility.eligible).length;
            const row = document.getElementById('patientsKpiRow');
            if (!row) return;
            row.innerHTML = `
                <div class="pp-kpi pp-kpi--blue">
                    <div class="pp-kpi-eyebrow">Total patients</div>
                    <div class="pp-kpi-val">${total}</div>
                    <div class="pp-kpi-trend"><span class="pp-chip">Roster</span></div>
                </div>
                <div class="pp-kpi pp-kpi--teal">
                    <div class="pp-kpi-eyebrow">With EHR data</div>
                    <div class="pp-kpi-val">${withEhr}</div>
                    <div class="pp-kpi-trend"><span class="pp-chip">${withEhr ? 'Synced' : 'None yet'}</span></div>
                </div>
                <div class="pp-kpi pp-kpi--violet">
                    <div class="pp-kpi-eyebrow">FHIR linked</div>
                    <div class="pp-kpi-val">${withFhir}</div>
                    <div class="pp-kpi-trend"><span class="pp-chip">Identifiers</span></div>
                </div>
                <div class="pp-kpi pp-kpi--amber">
                    <div class="pp-kpi-eyebrow">With coverage</div>
                    <div class="pp-kpi-val">${withCoverage}</div>
                    <div class="pp-kpi-trend"><span class="pp-chip">Eligibility</span></div>
                </div>`;
        }

        let currentFilter = 'all';

        function filterByTab(customers) {
            if (currentFilter === 'ehr') {
                return customers.filter(c => c.ehr_data && c.ehr_data.encounters && c.ehr_data.encounters.length > 0);
            }
            if (currentFilter === 'coverage') {
                return customers.filter(c => c.eligibility && c.eligibility.eligible);
            }
            return customers;
        }

        function filterCustomers(filter) {
            currentFilter = filter || 'all';
            applyPatientFilters();
        }

        function applyPatientFilters() {
            if (!allCustomers) return;
            let filtered = filterByTab([...allCustomers]);
            const term = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            if (term) {
                filtered = filtered.filter((customer) =>
                    (customer.customer_name && customer.customer_name.toLowerCase().includes(term)) ||
                    (customer.customer_phone && customer.customer_phone.includes(term)) ||
                    (customer.customer_email && customer.customer_email.toLowerCase().includes(term))
                );
            }
            updateFilterHint(filtered.length, allCustomers.length, term);
            displayCustomers(filtered);
        }

        function updateFilterHint(shown, total, searchTerm) {
            const hint = document.getElementById('patientsFilterHint');
            if (!hint) return;
            const filteredByTab = currentFilter !== 'all';
            if (rosterLoadState !== 'ready' || shown >= total || (!filteredByTab && !searchTerm)) {
                hint.hidden = true;
                hint.textContent = '';
                return;
            }
            hint.hidden = false;
            hint.textContent = `Showing ${shown} of ${total}`;
        }

        function rosterEmptyCopy(customers, searchTerm) {
            const total = allCustomers.length;
            if (searchTerm) {
                return {
                    title: 'No patients match your search',
                    body: 'Try a different name, phone, or email.'
                };
            }
            if (currentFilter === 'ehr') {
                return {
                    title: 'No patients with EHR data',
                    body: total
                        ? `0 of ${total} in roster · connect EHR sync in clinic settings.`
                        : 'Patients appear here after EHR sync.'
                };
            }
            if (currentFilter === 'coverage') {
                return {
                    title: 'No patients with verified coverage',
                    body: total
                        ? `0 of ${total} in roster · run eligibility from a patient case.`
                        : 'Verified coverage appears after eligibility checks.'
                };
            }
            return {
                title: 'No patients found',
                body: 'Patients appear here when synced from your EHR or created via scheduling.'
            };
        }

        function renderRosterEmpty(customers, searchTerm) {
            const container = rosterContainer();
            if (!container) return;
            const copy = rosterEmptyCopy(customers, searchTerm);
            container.innerHTML = `
                <div class="pp-patients-empty">
                    <div class="pp-patients-empty-title">${escapeHtml(copy.title)}</div>
                    <p>${escapeHtml(copy.body)}</p>
                </div>`;
        }

        function displayCustomers(customers) {
            scrubPatientsPanelDebris();
            const container = rosterContainer();
            const searchTerm = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            patientsDbg('render:enter', {
                customerCount: customers.length,
                rosterLoadState,
                containerId: container ? container.id : null,
                ...rosterDomSnapshot()
            });
            if (!container) {
                patientsDbg('render:no-container', rosterDomSnapshot(), 'error');
                console.error('[patients] roster container not found', rosterDomSnapshot());
                return;
            }

            if (rosterLoadState === 'loading') {
                if (customers.length) rosterLoadState = 'ready';
                else if (!allCustomers.length && rosterLoadState !== 'error') {
                    /* still loading — keep skeleton */
                }
            }

            if (!customers.length) {
                if (rosterLoadState === 'loading' && !allCustomers.length) {
                    return;
                }
                rosterLoadState = 'ready';
                renderRosterEmpty(customers, searchTerm);
                scrubPatientsPanelDebris();
                patientsDbg('render:done', { partsBuilt: 0, empty: true, ...rosterDomSnapshot() });
                return;
            }

            rosterLoadState = 'ready';
            const parts = [];
            for (const customer of customers) {
                try {
                    parts.push(createCustomerCard(customer));
                } catch (err) {
                    console.warn('[patients] card render skipped', customer?.fhir_id, err);
                }
            }
            container.innerHTML = parts.length
                ? parts.join('')
                : `<div class="pp-patients-empty"><div class="pp-patients-empty-title">Could not render roster</div><p>Try refreshing the page.</p></div>`;

            scrubPatientsPanelDebris();
            patientsDbg('render:done', {
                partsBuilt: parts.length,
                htmlLen: container.innerHTML.length,
                cardCount: document.querySelectorAll('#patientsRosterGrid .pp-patient-card').length,
                stillLoading: /Loading patients/i.test(document.querySelector('.pp-panel-body--patients')?.textContent || '')
            });

            if (requestedPatientId) {
                requestAnimationFrame(() => focusPatientCard(requestedPatientId));
            }
        }

        function focusPatientCard(patientId) {
            const id = String(patientId || '').trim();
            if (!id) return;
            const safe = id.replace(/"/g, '\\"');
            const card = document.querySelector(`.pp-patient-card[data-patient-id="${safe}"]`);
            if (!card) return;
            card.classList.add('pp-patient-card--focus');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => card.classList.remove('pp-patient-card--focus'), 3000);
            const caseHref = card.getAttribute('data-case-href');
            const banner = document.getElementById('patientsOpenCaseBanner');
            if (banner && caseHref) {
                banner.hidden = false;
                const link = banner.querySelector('a');
                if (link) link.href = caseHref;
            }
        }

        function patientCoverageChip(eligibility) {
            if (!eligibility) {
                return '<span class="pp-chip pp-patient-chip pp-patient-chip--muted">Coverage not checked</span>';
            }
            if (eligibility.eligible) {
                const payer = eligibility.payer_name || eligibility.payer_id;
                const label = payer ? `Coverage · ${escapeHtml(payer)}` : 'Coverage verified';
                return `<span class="pp-chip pp-patient-chip pp-patient-chip--ok">${label}</span>`;
            }
            return '<span class="pp-chip pp-patient-chip pp-patient-chip--warn">Not eligible</span>';
        }

        function createCustomerCard(patient) {
            const initials = (patient.customer_name || 'U').split(' ').filter(Boolean).map((n) => n[0]).join('').slice(0, 2).toUpperCase();
            const phone = patient.customer_phone || '';
            const email = patient.customer_email || '';
            const contact = phone || email
                ? `${phone ? escapeHtml(phone) : ''}${phone && email ? ' · ' : ''}${email ? escapeHtml(email) : ''}`
                : 'No contact on file';
            const hasEhrData = patient.ehr_data && patient.ehr_data.encounters && patient.ehr_data.encounters.length > 0;
            const eligibility = patient.eligibility || null;
            const pid = patient.fhir_id || patient.fhir_patient_id || patient.id || '';
            const pidAttr = escapeHtml(pid);
            const caseHref = pid ? `patient-case.html?patient_id=${encodeURIComponent(pid)}` : '';

            const chips = [patientCoverageChip(eligibility)];
            const ctx = patientContextMap[pid] || null;
            if (ctx?.journey && typeof window.ppJourneyStageChip === 'function') {
                const actionChip = window.ppJourneyStageChip(ctx.journey);
                if (actionChip?.label && actionChip?.href) {
                    chips.unshift(
                        `<a class="pp-chip pp-patient-chip pp-patient-chip--action pp-patient-chip--${escapeHtml(actionChip.tone || 'action')}" href="${escapeHtml(actionChip.href)}" data-action-chip="1">${escapeHtml(actionChip.label)}</a>`
                    );
                }
            }
            if (ctx?.pa_flag) {
                chips.push(`<span class="pp-chip pp-patient-chip pp-patient-chip--pa">${escapeHtml(ctx.pa_label || 'PA required')}</span>`);
            }
            if (eligibility && eligibility.copay_amount != null) {
                chips.push(`<span class="pp-chip pp-patient-chip">Copay $${Number(eligibility.copay_amount).toFixed(2)}</span>`);
            }
            if (eligibility && eligibility.deductible_remaining != null) {
                chips.push(`<span class="pp-chip pp-patient-chip">Ded. $${Number(eligibility.deductible_remaining).toFixed(0)} left</span>`);
            } else if (eligibility && eligibility.deductible_total != null) {
                chips.push(`<span class="pp-chip pp-patient-chip">Ded. $${Number(eligibility.deductible_total).toFixed(0)}</span>`);
            }
            if (hasEhrData) {
                const n = patient.ehr_data.encounters.length;
                chips.push(`<span class="pp-chip pp-patient-chip pp-patient-chip--ehr">${n} encounter${n === 1 ? '' : 's'}</span>`);
            }

            return `
                <div class="pp-patient-card pp-patient-card--compact" data-testid="pp-patient-row" data-patient-id="${pidAttr}" data-case-href="${escapeHtml(caseHref)}">
                    <div class="pp-patient-card__row">
                        <div class="pp-patient-avatar">${escapeHtml(initials)}</div>
                        <div class="pp-patient-card__info">
                            <div class="pp-patient-name">${escapeHtml(patient.customer_name)}</div>
                            <div class="pp-patient-contact">${contact}</div>
                        </div>
                        <div class="pp-patient-badges">
                            ${hasEhrData ? '<span class="pp-patient-badge pp-patient-badge--ehr">EHR</span>' : ''}
                            ${pid ? '<span class="pp-patient-badge pp-patient-badge--fhir">FHIR</span>' : ''}
                        </div>
                    </div>
                    <div class="pp-patient-card__chips">${chips.join('')}</div>
                    <div class="pp-patient-card__foot">
                        ${pid ? '<span class="pp-patient-card__cta">Open case</span>' : ''}
                        ${patient.customer_phone ? `<button type="button" class="pp-btn pp-btn-ghost pp-btn-sm pp-patient-card__contact" data-action="contact" data-phone="${escapeHtml(patient.customer_phone)}">Contact</button>` : ''}
                        ${hasEhrData ? '<button type="button" class="pp-btn pp-btn-ghost pp-btn-sm" data-action="ehr">EHR</button>' : ''}
                    </div>
                </div>
            `;
        }

        function searchCustomers() {
            applyPatientFilters();
        }

        function viewPatientBilling(fhirId) {
            window.location.href = `patient-case.html?patient_id=${encodeURIComponent(fhirId)}`;
        }

        function viewPatientDetails(fhirId) {
            const params = new URLSearchParams(window.location.search);
            params.set('patient_id', fhirId);
            history.replaceState({}, '', `${window.location.pathname}?${params}`);
            mountInsurancePanel(fhirId);
            document.getElementById('insCoverageMount')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function viewPatientEhrDetails(fhirId) {
            // Show detailed EHR data in a modal
            const patient = allCustomers.find(p => p.fhir_id === fhirId);
            if (!patient || !patient.ehr_data) {
                alert('No EHR data available for this patient');
                return;
            }

            const encounters = patient.ehr_data.encounters;
            let ehrDetailsHtml = `
                <div style="max-width: 800px; max-height: 80vh; overflow-y: auto;">
                    <h2 style="margin: 0 0 16px 0; font-size: 20px;">EHR Data for ${patient.customer_name}</h2>
                    <div style="margin-bottom: 16px; padding: 12px; background: #f8fafc; border-radius: 8px;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Summary</div>
                        <div style="font-size: 12px; color: #64748b;">
                            <div>Total Encounters: <strong>${encounters.length}</strong></div>
                            <div>FHIR Patient ID: <strong>${fhirId}</strong></div>
                        </div>
                    </div>
            `;

            encounters.forEach((enc, idx) => {
                const encounterDate = enc.encounter.start_time ? new Date(enc.encounter.start_time).toLocaleString() : 'N/A';
                ehrDetailsHtml += `
                    <div style="margin-bottom: 16px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 8px;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">
                            Encounter #${idx + 1} - ${encounterDate}
                        </div>
                        
                        ${enc.conditions && enc.conditions.length > 0 ? `
                            <div style="margin-bottom: 12px;">
                                <div style="font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px;">Diagnoses (ICD-10):</div>
                                ${enc.conditions.map(c => `
                                    <div style="padding: 6px 10px; margin-bottom: 4px; background: #dbeafe; border-radius: 4px; font-size: 12px;">
                                        <strong>${c.icd10_code}</strong> ${c.is_primary ? '<span style="color: #dc2626;">⭐ Primary</span>' : ''}
                                        <div style="color: #64748b; font-size: 11px; margin-top: 2px;">${c.description || 'No description'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        ${enc.procedures && enc.procedures.length > 0 ? `
                            <div style="margin-bottom: 12px;">
                                <div style="font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px;">Procedures (CPT):</div>
                                ${enc.procedures.map(p => `
                                    <div style="padding: 6px 10px; margin-bottom: 4px; background: #dcfce7; border-radius: 4px; font-size: 12px;">
                                        <strong>${p.cpt_code}</strong>${p.modifier ? ` (${p.modifier})` : ''}
                                        <div style="color: #64748b; font-size: 11px; margin-top: 2px;">${p.description || 'No description'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        ${enc.observations && enc.observations.length > 0 ? `
                            <div style="margin-bottom: 12px;">
                                <div style="font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px;">Observations:</div>
                                ${enc.observations.map(o => `
                                    <div style="padding: 6px 10px; margin-bottom: 4px; background: #fef3c7; border-radius: 4px; font-size: 12px;">
                                        <strong>${o.type || 'Unknown'}</strong>: ${o.value || 'N/A'}${o.unit ? ' ' + o.unit : ''}
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        
                        ${!enc.conditions?.length && !enc.procedures?.length && !enc.observations?.length ? `
                            <div style="padding: 8px; background: #f8fafc; border-radius: 4px; font-size: 11px; color: #94a3b8; font-style: italic;">
                                No clinical data available for this encounter
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            ehrDetailsHtml += '</div>';

            // Create and show modal
            const modal = document.createElement('div');
            modal.className = 'pp-ehr-modal-overlay';
            modal.innerHTML = `
                <div class="pp-ehr-modal-card">
                    <button type="button" data-ehr-close="1" style="position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px">×</button>
                    ${ehrDetailsHtml}
                    <div style="margin-top:16px;text-align:right">
                        <button type="button" data-ehr-close="1" class="pp-btn pp-btn-primary pp-btn-sm">Close</button>
                    </div>
                </div>
            `;
            const closeModal = () => {
                if (modal && modal.parentNode) modal.parentNode.removeChild(modal);
                document.removeEventListener('keydown', onEsc, true);
            };
            const onEsc = (evt) => {
                if (evt.key === 'Escape') closeModal();
            };
            modal.addEventListener('click', (evt) => {
                // Close when clicking overlay (outside card) or explicit close buttons.
                if (evt.target === modal || evt.target.closest('[data-ehr-close="1"]')) {
                    closeModal();
                }
            });
            document.addEventListener('keydown', onEsc, true);
            document.body.appendChild(modal);
        }

        function contactCustomer(phone) {
            if (phone) {
                // Try to initiate call
                window.location.href = `tel:${phone}`;
            } else {
                alert('No phone number available for this customer');
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../login.html';
        }

        function mountInsurancePanel(patientId) {
            const mount = document.getElementById('insCoverageMount');
            if (!mount || !patientId) return;
            const pid = normalizeFhirPatientId(patientId);
            mount.innerHTML = `
              <div class="pp-ins-panel" id="insCoveragePanel">
                <div class="pp-panel-title" style="margin-bottom:12px">Insurance and coverage</div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;font-size:13px;">
                  <div><div style="color:var(--muted);font-size:11px">Provider</div><div id="uiInsProvider" style="font-weight:700">—</div></div>
                  <div><div style="color:var(--muted);font-size:11px">Member ID</div><div id="uiInsMember" style="font-weight:700">—</div></div>
                  <div><div style="color:var(--muted);font-size:11px">Eligibility</div><div id="uiInsEligible" style="font-weight:700">—</div></div>
                  <div><div style="color:var(--muted);font-size:11px">Copay</div><div id="uiInsCopay" style="font-weight:700">—</div></div>
                  <div><div style="color:var(--muted);font-size:11px">Deductible</div><div id="uiInsDeductible" style="font-weight:700">—</div></div>
                  <div><div style="color:var(--muted);font-size:11px">Coinsurance</div><div id="uiInsCoins" style="font-weight:700">—</div></div>
                </div>
                <div style="margin-top:12px;font-size:12px;color:var(--muted)">Plan summary</div>
                <div id="uiInsPlanSummary" style="white-space:pre-wrap;font-size:13px">—</div>
              </div>`;
            Promise.all([
                fetch(`${API_BASE}/api/admin/patients/${encodeURIComponent(pid)}/insurance`, authFetchOpts()).then((r) => r.json()),
                fetch(`${API_BASE}/api/tenant/patients/${encodeURIComponent(pid)}/eligibility${clinicQ()}`, authFetchOpts()).then((r) => r.json())
            ]).then(([ins, elig]) => {
                if (ins.success && Array.isArray(ins.insurance) && ins.insurance.length) {
                    const primary = ins.insurance.find((i) => i.is_primary) || ins.insurance[0];
                    document.getElementById('uiInsProvider').textContent = primary.payer_name || primary.payer_id || '—';
                    document.getElementById('uiInsMember').textContent = primary.member_id || '—';
                }
                if (elig.success && Array.isArray(elig.eligibility) && elig.eligibility.length) {
                    const latest = elig.eligibility[0];
                    document.getElementById('uiInsEligible').textContent = latest.eligible ? 'Active' : 'Inactive';
                    document.getElementById('uiInsCopay').textContent = (latest.copay_amount != null) ? `$${latest.copay_amount}` : '—';
                    const dTot = (latest.deductible_total != null) ? `$${latest.deductible_total}` : '—';
                    const dRem = (latest.deductible_remaining != null) ? `$${latest.deductible_remaining}` : '—';
                    document.getElementById('uiInsDeductible').textContent = `${dTot} / ${dRem}`;
                    document.getElementById('uiInsCoins').textContent = (latest.coinsurance_percent != null) ? `${latest.coinsurance_percent}%` : '—';
                    document.getElementById('uiInsPlanSummary').textContent = latest.plan_summary || '—';
                }
            }).catch(() => {});
        }

        if (requestedPatientId) {
            mountInsurancePanel(requestedPatientId);
        }
    </script>
</body>

</html>
