<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a637">
  <title>Somo Provider - Payor Review</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/provider-portal.css">
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
  <style>
    .payor-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
    @media (max-width: 900px) { .payor-grid { grid-template-columns: 1fr; } }
    .payor-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .q-item { width: 100%; text-align: left; cursor: pointer; margin-bottom: 8px; }
  </style>
</head>
<body class="provider-portal provider-portal--scroll" data-page="payor-review">
  <div class="pp-app" id="ppAppMount"></div>
  <script>
    const API_BASE = window.API_BASE || window.location.origin;
    const ADMIN_HEADERS = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };
    let selectedQueueId = null;

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    async function syncQueue() {
      const policy = document.getElementById('policyInput').value.trim() || null;
      document.getElementById('statusMsg').textContent = 'Syncing...';
      const res = await fetch(`${API_BASE}/api/admin/payor-review-queue/sync`, {
        method: 'POST', headers: ADMIN_HEADERS,
        body: JSON.stringify({ policy_version: policy, limit: 2000 })
      });
      const data = await res.json();
      document.getElementById('statusMsg').textContent = data.success
        ? `Synced ${data.inserted} new queue rows`
        : `Sync failed: ${data.error || 'unknown error'}`;
      if (data.success) await loadQueue();
    }

    async function loadQueue() {
      const list = document.getElementById('queueList');
      list.innerHTML = '<div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div>';
      const res = await fetch(`${API_BASE}/api/admin/payor-review-queue?status=pending&limit=200`, { headers: ADMIN_HEADERS });
      const data = await res.json();
      if (!data.success) {
        list.innerHTML = `<p class="sfd-muted">${esc(data.error || 'unknown')}</p>`;
        return;
      }
      const items = data.items || [];
      if (!items.length) {
        list.innerHTML = '<div class="sfd-empty-state"><p>No pending queue items.</p></div>';
        return;
      }
      list.innerHTML = items.map((q) => `
        <button type="button" data-id="${esc(q.id)}" class="sfd-card q-item">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${esc(q.model_decision)}</strong>
            <span class="admin-crm-badge admin-crm-badge-muted">p${esc(q.priority)}</span>
          </div>
          <div class="sfd-muted" style="font-size:12px;margin-top:4px;">
            score=${Number(q.final_score || 0).toFixed(3)} · ${esc(q.policy_version)}
          </div>
        </button>`).join('');
      list.querySelectorAll('.q-item').forEach((el) => el.addEventListener('click', () => loadDetails(el.dataset.id)));
    }

    async function submitDecision(action) {
      if (!selectedQueueId) return;
      const rationale = window.prompt(`Optional rationale for "${action}":`, '') || '';
      const res = await fetch(`${API_BASE}/api/admin/payor-review-queue/${selectedQueueId}/decision`, {
        method: 'POST', headers: ADMIN_HEADERS,
        body: JSON.stringify({ action, rationale })
      });
      const data = await res.json();
      if (!data.success) { alert(data.error || 'Decision failed'); return; }
      selectedQueueId = null;
      document.getElementById('queueDetails').innerHTML = '<p class="sfd-muted">Select a queue item.</p>';
      await loadQueue();
    }

    async function loadDetails(id) {
      selectedQueueId = id;
      const el = document.getElementById('queueDetails');
      el.innerHTML = '<div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div>';
      const res = await fetch(`${API_BASE}/api/admin/payor-review-queue/${id}`, { headers: ADMIN_HEADERS });
      const data = await res.json();
      if (!data.success) { el.innerHTML = `<p>${esc(data.error)}</p>`; return; }
      const q = data.item;
      const cands = (q.candidates || []).slice(0, 8);
      el.innerHTML = `
        <p><strong>Decision:</strong> ${esc(q.model_decision)} · score ${Number(q.final_score || 0).toFixed(3)}</p>
        <table class="sfd-table" style="margin:12px 0">
          <thead><tr><th>Candidate</th><th>JW</th><th>TSR</th><th>TSeR</th></tr></thead>
          <tbody>${cands.map((x) => `
            <tr><td>${esc(x.label || x.id)}</td>
            <td>${Number(x.jaro_winkler || 0).toFixed(3)}</td>
            <td>${Number(x.token_sort_ratio || 0).toFixed(3)}</td>
            <td>${Number(x.token_set_ratio || 0).toFixed(3)}</td></tr>`).join('') || '<tr><td colspan="4">No candidates</td></tr>'}
          </tbody>
        </table>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="sfd-btn sfd-btn-primary" id="btnMerge">Merge</button>
          <button type="button" class="sfd-btn sfd-btn-ghost" id="btnSeparate">Separate</button>
          <button type="button" class="sfd-btn sfd-btn-ghost" id="btnRelated">Related subsidiary</button>
        </div>`;
      document.getElementById('btnMerge').onclick = () => submitDecision('merge');
      document.getElementById('btnSeparate').onclick = () => submitDecision('separate');
      document.getElementById('btnRelated').onclick = () => submitDecision('related_subsidiary');
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountProviderPage({ activeId: 'payor-review', eyebrow: 'Admin', title: 'Payor review queue',
        subtitle: 'Review ambiguous payor matches and capture merge/separate decisions' });
      document.getElementById('ppMainContent').innerHTML = `
        <div class="pp-page-shell">
          <div class="payor-toolbar">
            <button type="button" class="sfd-btn sfd-btn-primary" id="syncBtn">Sync from Step 5</button>
            <label class="sfd-muted" style="font-size:13px;">Policy:
              <input id="policyInput" type="text" value="v2_tuned" class="admin-crm-text-input" style="margin-left:6px;max-width:120px;" />
            </label>
            <span id="statusMsg" class="sfd-muted" style="font-size:12px;"></span>
          </div>
          <div class="payor-grid">
            <section class="sfd-card" style="padding:12px;"><h3 style="margin:0 0 8px;">Pending</h3><div id="queueList"></div></section>
            <section class="sfd-card" style="padding:12px;"><h3 style="margin:0 0 8px;">Candidate evidence</h3><div id="queueDetails"><p class="sfd-muted">Select a queue item.</p></div></section>
          </div>
        </div>`;
      document.getElementById('syncBtn').addEventListener('click', syncQueue);
      loadQueue();
    });
  </script>
</body>
</html>
