<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16a637">
  <title>Somo Provider — Tenants</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/provider-portal.css">
  <script src="/assets/js/html-escape.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-session.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
  <script src="/assets/js/sfd-nameplate.js"></script>
</head>
<body class="provider-portal provider-portal--scroll" data-page="tenants">
  <main class="main-content pp-content" id="ppMainContent">
    <div class="pp-page-shell sfd-card" style="padding:16px;overflow-x:auto">
      <div id="tenantState" class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div>
      <table class="sfd-table hidden" id="tenantTable">
        <thead>
          <tr>
            <th scope="col">Clinic</th>
            <th scope="col">Status</th>
            <th scope="col">Minutes balance</th>
            <th scope="col">Calls (7d)</th>
            <th scope="col">Agent</th>
          </tr>
        </thead>
        <tbody id="tenantBody"></tbody>
      </table>
    </div>
  </main>
  <script>
    (async function () {
      if (typeof requireAuth === 'function') requireAuth('../login.html');
      if (typeof hydrateProviderSession === 'function') {
        await hydrateProviderSession(window.API_BASE || window.location.origin);
      }
      if (typeof mountProviderPage === 'function') {
        mountProviderPage({
          activeId: 'tenants',
          eyebrow: 'Platform',
          title: 'Tenants',
          subtitle: 'Cross-clinic tenant overview',
        });
      }
      const allowed = (typeof hasCapability === 'function' && hasCapability('platform.tenants'))
        || (typeof isAdminUser === 'function' && isAdminUser());
      const state = document.getElementById('tenantState');
      const table = document.getElementById('tenantTable');
      const body = document.getElementById('tenantBody');
      const NP = window.SfdNameplate;
      if (!allowed) {
        state.className = 'sfd-empty-state';
        state.innerHTML = '<p>Access denied — platform.tenants capability required.</p>';
        return;
      }
      try {
        const api = (window.API_BASE || window.location.origin).replace(/\/$/, '');
        const res = await fetch(`${api}/api/admin/tenants`, { credentials: 'include' });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);
        const tenants = data.tenants || [];
        const esc = window.SomoHtml?.escapeHtml || ((s) => String(s ?? ''));
        body.innerHTML = tenants.map((t) => {
          const statusLabel = t.is_active ? 'LIVE' : 'OFF';
          const statusHtml = NP?.renderNameplate
            ? NP.renderNameplate(statusLabel, { sm: true })
            : statusLabel;
          const agentLabel = t.agent?.has_agent ? 'CONFIGURED' : 'OFF';
          const agentHtml = NP?.renderNameplate
            ? NP.renderNameplate(agentLabel, { sm: true })
            : agentLabel;
          return `<tr>
            <td><strong>${esc(t.name || t.clinic_id)}</strong></td>
            <td>${statusHtml}</td>
            <td class="sfd-mono">${(t.credits?.balance_minutes ?? 0).toLocaleString()} min</td>
            <td class="sfd-mono">${t.usage?.recent_7d_calls ?? 0}</td>
            <td>${agentHtml}</td>
          </tr>`;
        }).join('');
        state.classList.add('hidden');
        table.classList.remove('hidden');
      } catch (e) {
        state.className = 'sfd-empty-state';
        state.innerHTML = `<p>${esc(e.message || 'Failed to load tenants')}</p>`;
      }
    })();
  </script>
</body>
</html>
