<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a637">
  <title>Somo Provider - Merge Review</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/provider-portal.css">
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
</head>
<body class="provider-portal provider-portal--scroll" data-page="merge-review">
  <div class="pp-app" id="ppAppMount"></div>
  <script>
    const API_BASE = window.API_BASE || window.location.origin;
    const ADMIN_HEADERS = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    async function loadMerges() {
      const container = document.getElementById('mergeContainer');
      container.innerHTML = '<div class="sfd-skeleton"><div class="sfd-skeleton-line"></div></div>';
      try {
        const res = await fetch(`${API_BASE}/api/admin/patient-merge-events`, { headers: ADMIN_HEADERS });
        const data = await res.json();
        if (!data.success) {
          container.innerHTML = '<p class="sfd-muted">Failed to load merge events.</p>';
          return;
        }
        const events = data.events || [];
        if (!events.length) {
          container.innerHTML = '<div class="sfd-empty-state"><p>No recent merges.</p></div>';
          return;
        }
        container.innerHTML = `
          <table class="sfd-table">
            <thead><tr><th>When</th><th>Primary</th><th>Secondary</th><th>Reason</th><th>Status</th><th></th></tr></thead>
            <tbody>${events.map((ev) => `
              <tr>
                <td>${esc(ev.created_at)}</td>
                <td>${esc(ev.primary_id)}</td>
                <td>${esc(ev.secondary_id)}</td>
                <td>${esc(ev.reason || 'profile_update')}</td>
                <td>${ev.reviewed ? '<span class="admin-crm-pill admin-crm-pill-success">Reviewed</span>' : '<span class="admin-crm-badge admin-crm-badge-muted">Pending</span>'}</td>
                <td>${!ev.reviewed ? `<button type="button" class="sfd-btn sfd-btn-ghost sfd-btn-sm btn-review" data-id="${esc(ev.id)}">Mark reviewed</button>` : ''}</td>
              </tr>`).join('')}
            </tbody>
          </table>`;
        container.querySelectorAll('.btn-review').forEach((btn) => {
          btn.addEventListener('click', () => onMarkReviewed(btn.dataset.id));
        });
      } catch (_) {
        container.innerHTML = '<p class="sfd-muted">Error loading merge events.</p>';
      }
    }

    async function onMarkReviewed(id) {
      if (!id) return;
      const res = await fetch(`${API_BASE}/api/admin/patient-merge-events/${id}/review`, {
        method: 'POST', headers: ADMIN_HEADERS
      });
      const data = await res.json();
      if (data.success) loadMerges();
    }

    document.addEventListener('DOMContentLoaded', () => {
      mountProviderPage({ activeId: 'merge-review', eyebrow: 'Admin', title: 'Patient merge review',
        subtitle: 'Review recent merges between patient records' });
      document.getElementById('ppMainContent').innerHTML = `
        <div class="pp-page-shell"><div class="sfd-card" style="padding:16px;" id="mergeContainer"></div></div>`;
      loadMerges();
    });
  </script>
</body>
</html>
