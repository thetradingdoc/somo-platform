<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a637" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Somo Provider — Patient Case</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css" />
  <link rel="stylesheet" href="/assets/css/provider-portal.css" />
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-api.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
  <script src="/assets/js/call-timeline-ui.js"></script>
  <style>
    .case-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .case-timeline-panel { margin-top: 12px; min-height: 48px; }
    .case-notes-panel { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border, #e2e8f0); }
    .case-notes-panel textarea { width: 100%; min-height: 100px; resize: vertical; }
    .case-auto-load-banner { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  </style>
</head>
<body class="provider-portal provider-portal--scroll" data-page="patient-case">
  <main class="main-content pp-content pp-content--case" id="ppMainContent" data-testid="patient-case-shell">
    <div class="pp-page-shell">
    <section class="pp-panel sfd-card">
      <div class="pp-panel-head">
        <div>
          <div class="pp-panel-title" id="patientTitle">Patient Case</div>
          <div class="pp-panel-sub" id="patientSubtitle">Enter a patient ID to load case and RCM journey.</div>
        </div>
        <a class="pp-btn pp-btn-ghost pp-btn-sm" id="journeyLink" href="rcm-journey.html" style="display:none">RCM journey</a>
      </div>
      <div class="pp-panel-body">
        <div id="caseAutoLoadBanner" class="case-auto-load-banner" hidden aria-live="polite"></div>
        <div class="case-filters" id="caseFilters">
          <input id="patientIdInput" class="pp-input" style="max-width:280px" placeholder="Patient ID" data-testid="patient-case-id-input" />
          <button type="button" class="pp-btn pp-btn-primary pp-btn-sm" id="loadCaseBtn">Load case</button>
        </div>
        <div id="msg" class="pp-provision-banner error" style="display:none;margin-bottom:12px"></div>
        <div id="journeyPanel" style="display:none;margin-bottom:12px"></div>
        <div class="case-notes-panel" id="caseNotesPanel" hidden>
          <div class="pp-panel-title" style="font-size:15px;margin-bottom:8px">Provider notes</div>
          <p class="pp-muted" style="font-size:13px;margin:0 0 8px" id="caseNotesApptHint">Attach notes to the selected visit.</p>
          <select id="caseNotesApptSelect" class="pp-input" style="max-width:100%;margin-bottom:8px" aria-label="Appointment for notes"></select>
          <textarea id="caseNotesInput" class="pp-input" rows="4" placeholder="Post-visit notes, follow-up plan…" data-testid="patient-case-notes-input"></textarea>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
            <button type="button" class="pp-btn pp-btn-primary pp-btn-sm" id="caseNotesSaveBtn" data-testid="patient-case-notes-save">Save notes</button>
            <span id="caseNotesStatus" class="pp-muted" style="font-size:12px" aria-live="polite"></span>
          </div>
        </div>
        <div class="sfd-card case-timeline-panel" id="timeline" data-testid="patient-case-timeline"></div>
      </div>
    </section>
    </div>
  </main>
  <script>
    const API_BASE = window.API_BASE || 'http://localhost:4000';
    const clinicId = () => (window.ppGetClinicId ? window.ppGetClinicId() : 'clinic-default');
    let caseAppointments = [];
    let urlPatientId = '';

    function resolveBackHref() {
      const from = new URLSearchParams(window.location.search).get('from');
      if (from === 'revenue') return 'revenue.html?tab=pipeline';
      return 'patients.html';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'pp-provision-banner ' + (type === 'error' ? 'error' : 'pending');
      el.style.display = 'block';
    }
    function clearMsg() { document.getElementById('msg').style.display = 'none'; }

    function renderCaseTimeline(rows) {
      const timelineEl = document.getElementById('timeline');
      const CT = window.CallTimelineUi;
      if (CT?.renderTimelineTable) {
        timelineEl.innerHTML = CT.renderTimelineTable(rows, {
          emptyHtml: '<div class="sfd-empty-state"><p>No case events found for this patient.</p></div>',
        });
        return;
      }
      timelineEl.innerHTML = rows.length
        ? rows.map((r) => `<div class="pp-muted">${r.label || ''} · ${r.detail || ''}</div>`).join('')
        : '<div class="sfd-empty-state"><p>No case events found for this patient.</p></div>';
    }

    function pushTimelineEvent(events, at, label, detail) {
      if (!at && !label) return;
      events.push({ at: at || null, label, detail: detail || '' });
    }

    function setupNotesComposer(appointments) {
      caseAppointments = (appointments || []).filter((a) => a && a.id);
      const panel = document.getElementById('caseNotesPanel');
      const select = document.getElementById('caseNotesApptSelect');
      if (!panel || !select) return;
      if (!caseAppointments.length) {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      select.innerHTML = caseAppointments.map((a) => {
        const label = [a.appointment_type || 'Visit', a.date || a.start_time, a.status].filter(Boolean).join(' · ');
        return `<option value="${String(a.id).replace(/"/g, '&quot;')}">${label}</option>`;
      }).join('');
    }

    async function saveCaseNotes() {
      const apptId = document.getElementById('caseNotesApptSelect')?.value?.trim();
      const notes = document.getElementById('caseNotesInput')?.value?.trim() || '';
      const statusEl = document.getElementById('caseNotesStatus');
      const btn = document.getElementById('caseNotesSaveBtn');
      if (!apptId) {
        showMsg('Select an appointment to attach notes.', 'error');
        return;
      }
      if (btn) btn.disabled = true;
      if (statusEl) statusEl.textContent = 'Saving…';
      try {
        const res = await fetch(`${API_BASE}/api/provider/appointments/${encodeURIComponent(apptId)}/notes`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', ...(window.ppGetAuthHeaders?.() || {}) },
          body: JSON.stringify({ provider_notes: notes })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not save notes');
        if (statusEl) statusEl.textContent = 'Saved';
        clearMsg();
      } catch (err) {
        showMsg(err.message || 'Failed to save notes.', 'error');
        if (statusEl) statusEl.textContent = '';
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function loadJourneyForPatient(patientId) {
      const panel = document.getElementById('journeyPanel');
      const link = document.getElementById('journeyLink');
      try {
        const url = new URL(`${API_BASE}/api/rcm/journeys`);
        url.searchParams.set('clinic_id', clinicId());
        url.searchParams.set('patient_id', patientId);
        url.searchParams.set('limit', '1');
        const res = await fetch(url.toString(), { credentials: 'include', headers: window.ppGetAuthHeaders?.() || {} });
        const data = await res.json();
        const j = (data.journeys || [])[0];
        if (!j) { panel.style.display = 'none'; link.style.display = 'none'; return; }
        panel.style.display = 'block';
        link.style.display = 'inline-flex';
        link.href = `rcm-journey.html?journey_id=${encodeURIComponent(j.id)}`;
        const stage = j.stage || 'pre_registration';
        const stageHref = typeof window.ppJourneyStageHref === 'function'
          ? window.ppJourneyStageHref(stage)
          : 'rcm-journey.html';
        panel.innerHTML = `
          <div class="pp-snap-row" style="margin-bottom:8px">
            <span class="pp-snap-label">RCM stage</span>
            <span class="pp-snap-val">${j.stage_label || stage.replace(/_/g, ' ')} · ${j.status || 'open'}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="pp-btn pp-btn-primary pp-btn-sm" href="${stageHref}">Open workspace</a>
            <a class="pp-btn pp-btn-ghost pp-btn-sm" href="rcm-journey.html?journey_id=${encodeURIComponent(j.id)}&from=patient&patient_id=${encodeURIComponent(j.patient_id || patientId)}">Full journey</a>
          </div>`;
      } catch (_) {
        panel.style.display = 'none';
      }
    }

    async function loadCase(patientIdOverride) {
      clearMsg();
      const patientId = (patientIdOverride || document.getElementById('patientIdInput').value || '').trim();
      if (!patientId) { showMsg('Enter a patient ID to load case.', 'error'); return; }
      document.getElementById('patientIdInput').value = patientId;
      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = '<div class="sfd-skeleton"><div class="sfd-skeleton-line"></div><div class="sfd-skeleton-line sfd-skeleton-line--short"></div></div>';
      document.getElementById('caseNotesPanel').hidden = true;
      try {
        const res = await fetch(`${API_BASE}/api/patient/${encodeURIComponent(patientId)}/case-report`, {
          credentials: 'include',
          headers: { 'ngrok-skip-browser-warning': 'true', ...(window.ppGetAuthHeaders?.() || {}) }
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          renderCaseTimeline([]);
          showMsg(data.error || 'Unable to load case report.', 'error');
          return;
        }
        const { patient, encounters, appointments, claims, eligibility, financials, documents } = data;
        const resource = patient && patient.resource ? patient.resource : {};
        const nameObj = (resource.name && resource.name[0]) || {};
        const fullName = `${(nameObj.given || [''])[0]} ${nameObj.family || ''}`.trim() || 'Unknown patient';
        document.getElementById('patientTitle').textContent = fullName;
        document.getElementById('patientSubtitle').textContent = `FHIR ID: ${patient.id}`;
        const timelineRows = [];
        (encounters || []).forEach((enc) => {
          const dt = enc.start_time || enc.created_at || '';
          pushTimelineEvent(timelineRows, dt, 'Encounter', 'Voice or telehealth encounter');
        });
        (appointments || []).forEach((appt) => {
          const dt = appt.start_time || appt.date;
          pushTimelineEvent(
            timelineRows,
            dt,
            `Appointment · ${appt.appointment_type || 'Visit'}`,
            appt.status || ''
          );
        });
        (claims || []).forEach((claim) => {
          pushTimelineEvent(timelineRows, claim.created_at || claim.updated_at, `Claim ${claim.id || ''}`, `Status: ${claim.status || 'unknown'}`);
        });
        const latestElig = (eligibility && eligibility[0]) || null;
        if (latestElig) {
          pushTimelineEvent(
            timelineRows,
            latestElig.checked_at || latestElig.created_at,
            'Eligibility check',
            `Eligible: ${latestElig.eligible ? 'Yes' : 'No'} · Copay $${(latestElig.copay_amount || 0).toFixed(2)}`
          );
        }
        const invoices = (financials && financials.invoices) || [];
        invoices.forEach((inv) => {
          pushTimelineEvent(
            timelineRows,
            inv.created_at || inv.date,
            `Invoice ${inv.invoice_number || inv.id}`,
            `$${Number(inv.amount || inv.total || 0).toFixed(2)}`
          );
        });
        (documents || []).forEach((doc) => {
          pushTimelineEvent(timelineRows, doc.created_at, `Document · ${doc.file_name || 'Document'}`, '');
        });
        timelineRows.sort((a, b) => {
          const ta = a.at ? new Date(a.at).getTime() : 0;
          const tb = b.at ? new Date(b.at).getTime() : 0;
          return tb - ta;
        });
        renderCaseTimeline(timelineRows);
        setupNotesComposer(appointments);
        await loadJourneyForPatient(patientId);
        if (urlPatientId && patientId === urlPatientId) {
          const banner = document.getElementById('caseAutoLoadBanner');
          if (banner) {
            banner.hidden = false;
            banner.textContent = `Loaded case for ${fullName}.`;
          }
        }
      } catch (err) {
        renderCaseTimeline([]);
        showMsg('Network error while loading case report.', 'error');
      }
    }

    document.getElementById('loadCaseBtn').addEventListener('click', () => loadCase());
    document.getElementById('caseNotesSaveBtn')?.addEventListener('click', saveCaseNotes);

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.requireAuth === 'function') window.requireAuth();
      mountProviderPage({
        activeId: 'patients',
        eyebrow: 'Patients',
        title: 'Patient case',
        subtitle: 'Case timeline and RCM journey for this patient.',
        backHref: resolveBackHref(),
        backLabel: 'Back to roster'
      });
      const params = new URLSearchParams(window.location.search);
      urlPatientId = params.get('patient_id') || params.get('patientId') || '';
      if (urlPatientId) {
        document.getElementById('patientIdInput').value = urlPatientId;
        const banner = document.getElementById('caseAutoLoadBanner');
        if (banner) {
          banner.hidden = false;
          banner.textContent = 'Loading patient case…';
        }
        loadCase(urlPatientId);
      }
    });
  </script>
</body>
</html>
