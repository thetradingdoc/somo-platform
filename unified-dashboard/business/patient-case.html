<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a637" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Somo Provider — Patient Case</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css" />
  <link rel="stylesheet" href="/assets/css/provider-portal.css" />
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth-utils.js"></script>
  <script src="/assets/js/provider-shell.js"></script>
  <script src="/assets/js/provider-shell-chrome.js"></script>
  <script src="/assets/js/provider-layout.js"></script>
  <style>
    .case-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .case-timeline { border-left: 2px solid var(--gray-200, #e2e8f0); margin-top: 12px; padding-left: 16px; }
    .case-event { margin-bottom: 16px; position: relative; padding-left: 4px; }
    .case-event::before {
      content: '';
      position: absolute;
      left: -19px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--somo-green, #16a637);
    }
    .case-event-type { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted2); margin-bottom: 2px; }
    .case-event-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .case-event-meta { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body class="provider-portal provider-portal--scroll">
  <main class="main-content pp-content pp-content--case" id="ppMainContent">
    <section class="pp-panel">
      <div class="pp-panel-head">
        <div>
          <div class="pp-panel-title" id="patientTitle">Patient Case</div>
          <div class="pp-panel-sub" id="patientSubtitle">Enter a patient ID to load case and RCM journey.</div>
        </div>
        <a class="pp-btn pp-btn-ghost pp-btn-sm" id="journeyLink" href="rcm-journey.html" style="display:none">RCM journey</a>
      </div>
      <div class="pp-panel-body">
        <div class="case-filters">
          <input id="patientIdInput" class="pp-input" style="max-width:280px" placeholder="Patient ID" />
          <button type="button" class="pp-btn pp-btn-primary pp-btn-sm" id="loadCaseBtn">Load case</button>
        </div>
        <div id="msg" class="pp-provision-banner error" style="display:none;margin-bottom:12px"></div>
        <div id="journeyPanel" style="display:none;margin-bottom:12px"></div>
        <div class="case-timeline" id="timeline"></div>
      </div>
    </section>
  </main>
  <script>
    const API_BASE = window.API_BASE || 'http://localhost:4000';
    const clinicId = () => (window.ppGetClinicId ? window.ppGetClinicId() : 'clinic-default');

    function resolveBackHref() {
      const from = new URLSearchParams(window.location.search).get('from');
      if (from === 'revenue') return 'revenue.html?tab=pipeline';
      return 'patients.html';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'pp-provision-banner ' + (type === 'error' ? 'error' : 'pending');
      el.style.display = 'block';
    }
    function clearMsg() { document.getElementById('msg').style.display = 'none'; }

    function addEvent(timelineEl, type, title, meta) {
      const div = document.createElement('div');
      div.className = 'case-event';
      div.innerHTML = `<div class="case-event-type">${type}</div><div class="case-event-title">${title}</div><div class="case-event-meta">${meta || ''}</div>`;
      timelineEl.appendChild(div);
    }

    async function loadJourneyForPatient(patientId) {
      const panel = document.getElementById('journeyPanel');
      const link = document.getElementById('journeyLink');
      try {
        const url = new URL(`${API_BASE}/api/rcm/journeys`);
        url.searchParams.set('clinic_id', clinicId());
        url.searchParams.set('patient_id', patientId);
        url.searchParams.set('limit', '1');
        const res = await fetch(url.toString(), { credentials: 'include', headers: window.ppGetAuthHeaders?.() || {} });
        const data = await res.json();
        const j = (data.journeys || [])[0];
        if (!j) { panel.style.display = 'none'; link.style.display = 'none'; return; }
        panel.style.display = 'block';
        link.style.display = 'inline-flex';
        link.href = `rcm-journey.html?journey_id=${encodeURIComponent(j.id)}`;
        const stage = j.stage || 'pre_registration';
        const stageHref = typeof window.ppJourneyStageHref === 'function'
          ? window.ppJourneyStageHref(stage)
          : 'rcm-journey.html';
        panel.innerHTML = `
          <div class="pp-snap-row" style="margin-bottom:8px">
            <span class="pp-snap-label">RCM stage</span>
            <span class="pp-snap-val">${j.stage_label || stage.replace(/_/g, ' ')} · ${j.status || 'open'}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="pp-btn pp-btn-primary pp-btn-sm" href="${stageHref}">Open workspace</a>
            <a class="pp-btn pp-btn-ghost pp-btn-sm" href="rcm-journey.html?journey_id=${encodeURIComponent(j.id)}&from=patient&patient_id=${encodeURIComponent(j.patient_id || patientId)}">Full journey</a>
          </div>`;
      } catch (_) {
        panel.style.display = 'none';
      }
    }

    async function loadCase() {
      clearMsg();
      const patientId = document.getElementById('patientIdInput').value.trim();
      if (!patientId) { showMsg('Enter a patient ID to load case.', 'error'); return; }
      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = '<div class="pp-empty">Loading…</div>';
      try {
        const res = await fetch(`${API_BASE}/api/patient/${encodeURIComponent(patientId)}/case-report`, {
          headers: { 'ngrok-skip-browser-warning': 'true', ...(window.ppGetAuthHeaders?.() || {}) }
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          timelineEl.innerHTML = '';
          showMsg(data.error || 'Unable to load case report.', 'error');
          return;
        }
        const { patient, encounters, appointments, claims, eligibility, financials, documents } = data;
        const resource = patient && patient.resource ? patient.resource : {};
        const nameObj = (resource.name && resource.name[0]) || {};
        const fullName = `${(nameObj.given || [''])[0]} ${nameObj.family || ''}`.trim() || 'Unknown patient';
        document.getElementById('patientTitle').textContent = fullName;
        document.getElementById('patientSubtitle').textContent = `FHIR ID: ${patient.id}`;
        timelineEl.innerHTML = '';
        (encounters || []).forEach((enc) => {
          const dt = enc.start_time || enc.created_at || '';
          addEvent(timelineEl, 'Encounter', 'Voice or telehealth encounter', dt ? new Date(dt).toLocaleString() : '');
        });
        (appointments || []).forEach((appt) => {
          const dt = appt.start_time || appt.date;
          addEvent(timelineEl, 'Appointment', appt.appointment_type || 'Visit', `${dt ? new Date(dt).toLocaleString() : ''} · ${appt.status || ''}`);
        });
        (claims || []).forEach((claim) => {
          addEvent(timelineEl, 'Claim', `Claim ${claim.id || ''}`, `Status: ${claim.status || 'unknown'}`);
        });
        const latestElig = (eligibility && eligibility[0]) || null;
        if (latestElig) {
          addEvent(timelineEl, 'Eligibility', 'Eligibility check', `Eligible: ${latestElig.eligible ? 'Yes' : 'No'} · Copay $${(latestElig.copay_amount || 0).toFixed(2)}`);
        }
        const invoices = (financials && financials.invoices) || [];
        invoices.forEach((inv) => {
          addEvent(timelineEl, 'Invoice', `Invoice ${inv.invoice_number || inv.id}`, `$${Number(inv.amount || inv.total || 0).toFixed(2)}`);
        });
        (documents || []).forEach((doc) => {
          addEvent(timelineEl, 'Document', doc.file_name || 'Document', doc.created_at ? new Date(doc.created_at).toLocaleString() : '');
        });
        await loadJourneyForPatient(patientId);
      } catch (err) {
        timelineEl.innerHTML = '';
        showMsg('Network error while loading case report.', 'error');
      }
    }

    document.getElementById('loadCaseBtn').addEventListener('click', loadCase);
    document.addEventListener('DOMContentLoaded', () => {
      mountProviderPage({
        activeId: 'patients',
        eyebrow: 'Patients',
        title: 'Patient case',
        subtitle: 'Case timeline and RCM journey for this patient.',
        backHref: resolveBackHref(),
        backLabel: 'Back to roster'
      });
      const params = new URLSearchParams(window.location.search);
      const pid = params.get('patient_id');
      if (pid) {
        document.getElementById('patientIdInput').value = pid;
        loadCase();
      }
    });
  </script>
</body>
</html>
