<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Somo — Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/somo-tokens.css">
    <link rel="stylesheet" href="/assets/css/somo-front-desk-components.css">
    <link rel="stylesheet" href="/assets/css/signup-somo.css">
    <link rel="stylesheet" href="/assets/css/auth-somo.css">
    <script src="/assets/js/config.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            if (input) input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
    <style>
        .signup-toast.error:not(.hidden), .signup-toast.success:not(.hidden) { display: block; margin-bottom: 16px; }
    </style>
</head>
<body class="signup-wizard-body">
    <div class="login-shell">
        <div class="login-main sfd-device-card">
            <a href="/" class="signup-logo-link" aria-label="Somo home">
                <img class="signup-logo-img" src="/assets/brand/somo-logo.png" alt="Somo" width="199" height="68" />
            </a>
            <p class="signup-eyebrow">Account security</p>
            <h1 class="signup-title">Reset password</h1>
            <p class="signup-sub">Enter your new password below.</p>

            <div class="signup-toast error hidden" id="errorMessage" role="alert"></div>
            <div class="signup-toast success hidden" id="successMessage" role="status"></div>

            <form id="resetForm" data-testid="reset-password-form">
                <label class="signup-field">
                    <span>New password</span>
                    <div class="login-password-wrap">
                        <input type="password" id="newPassword" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                        <button type="button" class="login-password-toggle" onclick="togglePassword('newPassword')" aria-label="Show password">Show</button>
                    </div>
                </label>

                <label class="signup-field">
                    <span>Confirm password</span>
                    <div class="login-password-wrap">
                        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="8" autocomplete="new-password">
                        <button type="button" class="login-password-toggle" onclick="togglePassword('confirmPassword')" aria-label="Show password">Show</button>
                    </div>
                </label>

                <button type="submit" class="signup-btn-primary" id="resetBtn">Reset password</button>
            </form>

            <p class="signup-footnote" style="margin-top:20px"><a href="/login">Back to login</a></p>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE || (window.location.origin || 'http://localhost:4000').replace(/\/$/, '');
        console.log('🌐 Using API Base URL:', API_BASE);

        // Get token and email from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (!token || !email) {
            showError('Invalid reset link. Please request a new password reset.');
            document.getElementById('resetForm').style.display = 'none';
        }

        // Reset Form Handler
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            if (newPassword.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            await resetPassword(email, token, newPassword);
        });

        async function resetPassword(email, token, newPassword) {
            const errorMessage = document.getElementById('errorMessage');
            const resetBtn = document.getElementById('resetBtn');

            hideMessages();
            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch(`${API_BASE}/api/customers/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, token, newPassword })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Password reset successfully! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    throw new Error(data.error || data.message || 'Failed to reset password');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showError(error.message || 'Failed to reset password');
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset password';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            document.getElementById('successMessage').classList.add('hidden');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('successMessage').classList.add('hidden');
        }
