<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consʌlt Provider Portal — Sign in</title>
    <script src="assets/js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .auth-header h1 {
            font-size: 26px;
            margin-bottom: 4px;
            color: white;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .auth-body {
            padding: 40px;
        }

        .tab-buttons {
            display: none;
            /* Hide tabs - login only */
        }

        .tab-btn {
            display: none;
            /* Hide tab buttons */
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(210, 105, 30, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(210, 105, 30, 0.4);
            background: #0e7490;
        }

        .btn-primary:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            background: white;
            padding: 0 16px;
            color: #718096;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #2d3748;
        }

        .btn-google:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .demo-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .demo-section h3 {
            font-size: 13px;
            color: #718096;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .demo-btn {
            width: 100%;
            padding: 14px 16px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .demo-btn:hover {
            background: #edf2f7;
            border-color: #1e40af;
        }

        .demo-btn-icon {
            font-size: 24px;
        }

        .demo-btn-content {
            flex: 1;
        }

        .demo-btn-title {
            color: #2d3748;
            margin-bottom: 2px;
        }

        .demo-btn-email {
            font-size: 12px;
            color: #718096;
            font-weight: 400;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        @media (max-width: 480px) {
            .auth-container {
                border-radius: 0;
            }

            .auth-body {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">Consʌlt</div>
            <h1>Provider Portal</h1>
            <p>For licensed providers</p>
        </div>

        <div class="auth-body">
            <!-- Tab buttons removed - login only, signup redirects to /signup -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@company.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-toggle">
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn"
                            onclick="togglePassword('loginPassword')">👁️</button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #4a5568; font-weight: normal;">
                        <input type="checkbox" id="rememberMe" style="width: auto; margin: 0;">
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="showForgotPassword(); return false;"
                        style="color: #1e40af; text-decoration: none; font-size: 14px;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    Sign In
                </button>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="auth-form" style="display: none;">
                <h2 style="margin-bottom: 16px; color: #1e293b;">Reset Password</h2>
                <p style="color: #64748b; margin-bottom: 24px; font-size: 14px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="you@company.com" required>
                </div>

                <button type="submit" class="btn-primary" id="forgotBtn">
                    Send Reset Link
                </button>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="#" onclick="showLogin(); return false;"
                        style="color: #1e40af; text-decoration: none; font-size: 14px;">Back to login</a>
                </div>
            </form>

            <!-- Signup form removed - users must use /signup page -->

            <!-- Sign up link - redirects to /signup -->
            <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid #e2e8f0;">
                <p style="color: #718096; font-size: 14px; margin-bottom: 12px;">
                    Don't have an account?
                </p>
                <a href="/unified-dashboard/signup.html"
                    style="display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: all 0.2s;">
                    Create provider account
                </a>
                <div style="margin-top:12px;">
                    <a href="/unified-dashboard/portal.html" style="color:#1e40af; text-decoration:none; font-size: 14px; font-weight: 600;">
                        Are you a patient? Go to Patient Portal →
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-detect API base URL based on current domain
        function getApiBase() {
            // If config.js set it, use that
            if (window.API_BASE) {
                return window.API_BASE;
            }

            // Auto-detect based on hostname
            const hostname = window.location.hostname;

            // Production domains - use api.doclittle.site
            if (hostname === 'doclittle.site' || hostname === 'www.doclittle.site' ||
                hostname.includes('doclittle.site') || hostname.includes('azurewebsites.net')) {
                return 'https://api.doclittle.site';
            }

            // Local development
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'http://localhost:4000';
            }

            // Default to production API
            return 'https://api.doclittle.site';
        }

        const API_BASE = getApiBase();
        console.log('🌐 Using API Base URL:', API_BASE);

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            await login(email, password);
        });

        // Signup form removed - redirect to /signup instead
        // If someone tries to access signup from login page, redirect them
        if (window.location.hash === '#signup' || window.location.search.includes('signup=true')) {
            window.location.href = '/signup';
        }

        async function login(email, password) {
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const rememberMe = document.getElementById('rememberMe').checked;

            hideMessages();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const response = await fetch(`${API_BASE}/api/customers/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({ email, password, remember_me: rememberMe })
                });

                // Check if response is OK before parsing JSON
                if (!response.ok) {
                    // Try to parse error response
                    try {
                        const errorData = await response.json();
                        throw new Error(errorData.error || errorData.message || `HTTP ${response.status}: ${response.statusText}`);
                    } catch (parseError) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                }

                const data = await response.json();

                if (data.success) {
                    // Store auth - use both keys for compatibility across all pages
                    sessionStorage.setItem('authenticated', 'true');
                    const customer = data.customer || {};
                    sessionStorage.setItem('customer', JSON.stringify(customer));
                    sessionStorage.setItem('user', JSON.stringify({
                        name: customer.name || customer.company_name || 'User',
                        role: customer.role || 'Provider',
                        ...customer
                    }));

                    console.log('Login successful. Customer data:', customer);

                    // Redirect to business dashboard on current subdomain
                    // If on tenant subdomain, stay on it; otherwise redirect to subdomain
                    const currentHostname = window.location.hostname;
                    const subdomain = data.customer.subdomain;

                    // Localhost: stay on current origin (no subdomain redirect) to avoid SSL errors
                    if (currentHostname === 'localhost' || currentHostname === '127.0.0.1') {
                        window.location.href = '/business/business-dashboard.html';
                    } else if (subdomain && currentHostname.includes(`${subdomain}.doclittle.site`)) {
                        // Already on correct subdomain - just go to dashboard
                        window.location.href = '/business/business-dashboard.html';
                    } else if (subdomain) {
                        // Need to redirect to tenant subdomain (production uses https)
                        const baseDomain = 'doclittle.site';
                        window.location.href = `https://${subdomain}.${baseDomain}/business/business-dashboard.html`;
                    } else {
                        window.location.href = '/business/business-dashboard.html';
                    }
                } else {
                    throw new Error(data.error || data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Invalid email or password');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        }

        // Forgot Password Form Handler
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            await forgotPassword(email);
        });

        async function forgotPassword(email) {
            const errorMessage = document.getElementById('errorMessage');
            const forgotBtn = document.getElementById('forgotBtn');

            hideMessages();
            forgotBtn.disabled = true;
            forgotBtn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE}/api/customers/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Password reset link sent to your email. Please check your inbox.');
                    setTimeout(() => {
                        showLogin();
                    }, 3000);
                } else {
                    throw new Error(data.error || data.message || 'Failed to send reset link');
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showError(error.message || 'Failed to send reset link');
            } finally {
                forgotBtn.disabled = false;
                forgotBtn.textContent = 'Send Reset Link';
            }
        }

        function showForgotPassword() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'block';
            hideMessages();
        }

        function showLogin() {
            document.getElementById('forgotPasswordForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            hideMessages();
        }

        // Signup function removed - signup is handled on /signup page

        // Tab switching removed - login only
        window.addEventListener('DOMContentLoaded', function () {
            // Always show login form
            document.getElementById('loginForm').classList.add('active');
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }
    </script>
</body>

</html>
