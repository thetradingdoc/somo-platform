<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>Somo — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/unified-dashboard/assets/css/somo-tokens.css" />
  <link rel="stylesheet" href="/unified-dashboard/assets/css/somo-front-desk-components.css" />
  <link rel="stylesheet" href="/unified-dashboard/assets/css/signup-somo.css" />
  <link rel="stylesheet" href="/unified-dashboard/assets/css/auth-somo.css" />
  <style>
    /* Critical: readable even if external stylesheets fail */
    [data-login-panel].hidden { display: none !important; }
    body.signup-wizard-body {
      margin: 0;
      min-height: 100dvh;
      font-family: 'League Spartan', system-ui, sans-serif;
      background: #fff;
      color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
    }
    .signup-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #e8e4dc;
      border-radius: 12px;
      font-size: 16px;
    }
    .signup-btn-primary {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 999px;
      background: #93d33b;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>

<body class="signup-wizard-body">
  <div class="login-shell">
    <div class="login-main sfd-device-card">
      <a href="/" class="signup-logo-link" aria-label="Somo home">
        <img
          class="signup-logo-img"
          src="/unified-dashboard/assets/brand/somo-logo.png"
          alt="Somo"
          width="199"
          height="68"
          fetchpriority="high"
        />
      </a>

      <div id="loginPanel" data-login-panel="login">
        <p class="signup-eyebrow">Welcome back</p>
        <h1 class="signup-title">Sign in to your Somo front desk</h1>
        <p class="signup-sub">Manage your AI receptionist, calls, and settings.</p>

        <div class="signup-toast error hidden" id="loginToast" role="alert"></div>

        <form id="loginForm" data-testid="login-form">
          <label class="signup-field">
            <span>Work email</span>
            <input type="email" id="loginEmail" required autocomplete="email" placeholder="you@yourbusiness.com" />
          </label>

          <label class="signup-field">
            <span>Password</span>
            <div class="login-password-wrap">
              <input
                type="password"
                id="loginPassword"
                required
                autocomplete="current-password"
                placeholder="Your password"
              />
              <button
                type="button"
                class="login-show-password"
                id="loginShowPassword"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </label>

          <div class="login-options">
            <label class="login-remember">
              <input type="checkbox" id="loginRemember" />
              Remember me
            </label>
            <a href="#" class="login-forgot-link" id="loginForgotLink">Forgot password?</a>
          </div>

          <button type="submit" class="signup-btn signup-btn-primary" id="loginSubmit" style="width:100%">
            Sign in
          </button>
        </form>

        <p class="login-footer-link">
          Don&apos;t have an account?
          <a href="/signup?utm_source=login">Start your free trial</a>
        </p>
        <a href="/" class="login-back-home">← Back to home</a>
      </div>

      <div id="forgotPanel" data-login-panel="forgot" class="hidden">
        <p class="signup-eyebrow">Password reset</p>
        <h1 class="signup-title">Forgot your password?</h1>
        <p class="signup-sub">We&apos;ll email you a link to reset your password.</p>

        <form id="forgotForm">
          <label class="signup-field">
            <span>Work email</span>
            <input type="email" id="forgotEmail" required autocomplete="email" placeholder="you@yourbusiness.com" />
          </label>
          <button type="submit" class="signup-btn signup-btn-primary" id="forgotSubmit" style="width:100%;margin-top:8px">
            Send reset link
          </button>
        </form>

        <p class="login-footer-link">
          <a href="#" id="forgotBackLink">← Back to sign in</a>
        </p>
        <div class="signup-toast hidden" id="forgotToast" role="status"></div>
      </div>
    </div>
  </div>

  <script src="/assets/js/api-base.js"></script>
  <script src="/unified-dashboard/assets/js/provider-session.js"></script>
  <script src="/unified-dashboard/assets/js/onboarding-redirect.js"></script>
  <script src="/unified-dashboard/assets/js/login-somo.js"></script>
</body>

</html>
