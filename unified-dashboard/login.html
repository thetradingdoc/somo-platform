<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Coding Assistant - Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="assets/js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 40px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .auth-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: white;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .auth-body {
            padding: 40px;
        }

        .tab-buttons {
            display: none;
            /* Hide tabs - login only */
        }

        .tab-btn {
            display: none;
            /* Hide tab buttons */
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(210, 105, 30, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(210, 105, 30, 0.4);
            background: #0e7490;
        }

        .btn-primary:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            background: white;
            padding: 0 16px;
            color: #718096;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #2d3748;
        }

        .btn-google:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .demo-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .demo-section h3 {
            font-size: 13px;
            color: #718096;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .demo-btn {
            width: 100%;
            padding: 14px 16px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .demo-btn:hover {
            background: #edf2f7;
            border-color: #1e40af;
        }

        .demo-btn-icon {
            font-size: 24px;
        }

        .demo-btn-content {
            flex: 1;
        }

        .demo-btn-title {
            color: #2d3748;
            margin-bottom: 2px;
        }

        .demo-btn-email {
            font-size: 12px;
            color: #718096;
            font-weight: 400;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        @media (max-width: 480px) {
            .auth-container {
                border-radius: 0;
            }

            .auth-body {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo"
                style="font-family: 'Times New Roman', Times, serif; font-style: italic; letter-spacing: -3px;">
                <span style="font-style: italic;">Doc</span><span
                    style="font-family: 'Verdana', Geneva, sans-serif; font-weight: 700;">Little</span><span
                    style="font-weight: 700;">.</span>
            </div>
            <p>24/7 Medical Assistant</p>
        </div>

        <div class="auth-body">
            <!-- Tab buttons removed - login only, signup redirects to /signup -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@company.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-toggle">
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn"
                            onclick="togglePassword('loginPassword')">👁️</button>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <label
                        style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #4a5568; font-weight: normal;">
                        <input type="checkbox" id="rememberMe" style="width: auto; margin: 0;">
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="showForgotPassword(); return false;"
                        style="color: #1e40af; text-decoration: none; font-size: 14px;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    Sign In
                </button>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="auth-form" style="display: none;">
                <h2 style="margin-bottom: 16px; color: #1e293b;">Reset Password</h2>
                <p style="color: #64748b; margin-bottom: 24px; font-size: 14px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="you@company.com" required>
                </div>

                <button type="submit" class="btn-primary" id="forgotBtn">
                    Send Reset Link
                </button>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="#" onclick="showLogin(); return false;"
                        style="color: #1e40af; text-decoration: none; font-size: 14px;">Back to login</a>
                </div>
            </form>

            <!-- Signup form removed - users must use /signup page -->

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div id="g_id_onload"
                data-client_id="733692195644-k21cf071v806e216qris7evhr3asps72.apps.googleusercontent.com"
                data-callback="handleGoogleSignIn" data-auto_prompt="false">
            </div>

            <button class="btn-google" id="googleSignInBtn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Sign in with Google
            </button>

            <!-- Test accounts - hidden in production, accessible via ?test=true query param -->
            <div class="demo-section" id="testAccountsSection" style="display: none;">
                <h3>Quick Test Accounts</h3>

                <button class="demo-btn" onclick="loginDemo('insurer@doclittle.com', 'demo123')">
                    <span class="demo-btn-icon">🏥</span>
                    <div class="demo-btn-content">
                        <div class="demo-btn-title">Insurer Admin</div>
                        <div class="demo-btn-email">insurer@doclittle.com</div>
                    </div>
                </button>

                <button class="demo-btn" onclick="loginDemo('provider@doclittle.com', 'demo123')">
                    <span class="demo-btn-icon">👨‍⚕️</span>
                    <div class="demo-btn-content">
                        <div class="demo-btn-title">Healthcare Provider</div>
                        <div class="demo-btn-email">provider@doclittle.com</div>
                    </div>
                </button>

                <button class="demo-btn" onclick="loginDemo('patient@doclittle.com', 'demo123')" title="Patient portal: Bala Jones">
                    <span class="demo-btn-icon">👤</span>
                    <div class="demo-btn-content">
                        <div class="demo-btn-title">Bala Jones (Patient)</div>
                        <div class="demo-btn-email">patient@doclittle.com</div>
                    </div>
                </button>
            </div>

            <!-- Sign up link - redirects to /signup -->
            <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid #e2e8f0;">
                <p style="color: #718096; font-size: 14px; margin-bottom: 12px;">
                    Don't have an account?
                </p>
                <a href="/signup"
                    style="display: inline-block; padding: 12px 24px; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: all 0.2s;">
                    Create Account
                </a>
            </div>
        </div>
    </div>

    <script>
        // Auto-detect API base URL based on current domain
        function getApiBase() {
            // If config.js set it, use that
            if (window.API_BASE) {
                return window.API_BASE;
            }

            // Auto-detect based on hostname
            const hostname = window.location.hostname;

            // Production domains - use api.doclittle.site
            if (hostname === 'doclittle.site' || hostname === 'www.doclittle.site' ||
                hostname.includes('doclittle.site') || hostname.includes('azurewebsites.net')) {
                return 'https://api.doclittle.site';
            }

            // Local development
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'http://localhost:4000';
            }

            // Default to production API
            return 'https://api.doclittle.site';
        }

        const API_BASE = getApiBase();
        console.log('🌐 Using API Base URL:', API_BASE);

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            await login(email, password);
        });

        // Signup form removed - redirect to /signup instead
        // If someone tries to access signup from login page, redirect them
        if (window.location.hash === '#signup' || window.location.search.includes('signup=true')) {
            window.location.href = '/signup';
        }

        async function login(email, password) {
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const rememberMe = document.getElementById('rememberMe').checked;

            hideMessages();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const response = await fetch(`${API_BASE}/api/customers/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({ email, password, remember_me: rememberMe })
                });

                // Check if response is OK before parsing JSON
                if (!response.ok) {
                    // Try to parse error response
                    try {
                        const errorData = await response.json();
                        throw new Error(errorData.error || errorData.message || `HTTP ${response.status}: ${response.statusText}`);
                    } catch (parseError) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                }

                const data = await response.json();

                if (data.success) {
                    // Store auth - use both keys for compatibility across all pages
                    sessionStorage.setItem('authenticated', 'true');
                    const customer = data.customer || {};
                    sessionStorage.setItem('customer', JSON.stringify(customer));
                    sessionStorage.setItem('user', JSON.stringify({
                        name: customer.name || customer.company_name || 'User',
                        role: customer.role || 'Provider',
                        ...customer
                    }));

                    console.log('Login successful. Customer data:', customer);

                    // Redirect to business dashboard on current subdomain
                    // If on tenant subdomain, stay on it; otherwise redirect to subdomain
                    const currentHostname = window.location.hostname;
                    const subdomain = data.customer.subdomain;

                    // Localhost: stay on current origin (no subdomain redirect) to avoid SSL errors
                    if (currentHostname === 'localhost' || currentHostname === '127.0.0.1') {
                        window.location.href = '/business/business-dashboard.html';
                    } else if (subdomain && currentHostname.includes(`${subdomain}.doclittle.site`)) {
                        // Already on correct subdomain - just go to dashboard
                        window.location.href = '/business/business-dashboard.html';
                    } else if (subdomain) {
                        // Need to redirect to tenant subdomain (production uses https)
                        const baseDomain = 'doclittle.site';
                        window.location.href = `https://${subdomain}.${baseDomain}/business/business-dashboard.html`;
                    } else {
                        window.location.href = '/business/business-dashboard.html';
                    }
                } else {
                    throw new Error(data.error || data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Invalid email or password');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        }

        // Forgot Password Form Handler
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            await forgotPassword(email);
        });

        async function forgotPassword(email) {
            const errorMessage = document.getElementById('errorMessage');
            const forgotBtn = document.getElementById('forgotBtn');

            hideMessages();
            forgotBtn.disabled = true;
            forgotBtn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE}/api/customers/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Password reset link sent to your email. Please check your inbox.');
                    setTimeout(() => {
                        showLogin();
                    }, 3000);
                } else {
                    throw new Error(data.error || data.message || 'Failed to send reset link');
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showError(error.message || 'Failed to send reset link');
            } finally {
                forgotBtn.disabled = false;
                forgotBtn.textContent = 'Send Reset Link';
            }
        }

        function showForgotPassword() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('forgotPasswordForm').style.display = 'block';
            hideMessages();
        }

        function showLogin() {
            document.getElementById('forgotPasswordForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            hideMessages();
        }

        // Signup function removed - signup is handled on /signup page

        function loginDemo(email, password) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            login(email, password);
        }

        // Google Sign-In callback
        function handleGoogleSignIn(response) {
            const credential = response.credential;

            // Decode JWT to get user info
            const base64Url = credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            const userData = JSON.parse(jsonPayload);

            // Send to backend for verification and account creation/login
            authenticateWithGoogle(credential, userData);
        }

        async function authenticateWithGoogle(credential, userData) {
            try {
                const response = await fetch(`${API_BASE}/api/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        credential,
                        email: userData.email,
                        name: userData.name,
                        picture: userData.picture
                    })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('authenticated', 'true');
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    showSuccess('Welcome, ' + userData.name + '!');
                    setTimeout(() => {
                        window.location.href = '/business/business-dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Google authentication failed');
                }
            } catch (error) {
                console.error('Google auth error:', error);
                showError(error.message || 'Failed to authenticate with Google');
            }
        }

        // Initialize Google Sign-In button
        window.onload = function () {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: '733692195644-k21cf071v806e216qris7evhr3asps72.apps.googleusercontent.com',
                    callback: handleGoogleSignIn
                });

                // Render button
                const googleBtn = document.getElementById('googleSignInBtn');
                if (googleBtn) {
                    googleBtn.onclick = function () {
                        google.accounts.id.prompt();
                    };
                }
            }
        };

        // Tab switching removed - login only
        // Show test accounts only if ?test=true is in URL (for testing purposes)
        window.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const isTestMode = urlParams.get('test') === 'true';
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            // Show test accounts only in test mode or localhost (staging)
            if (isTestMode || isLocalhost) {
                const testSection = document.getElementById('testAccountsSection');
                if (testSection) {
                    testSection.style.display = 'block';
                }
            }

            // Always show login form
            document.getElementById('loginForm').classList.add('active');
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }
    </script>
</body>

</html>
