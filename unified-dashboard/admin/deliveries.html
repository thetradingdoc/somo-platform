<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/somo-tokens.css" />
  <link rel="stylesheet" href="../assets/css/signup-somo.css" />
  <link rel="stylesheet" href="../assets/css/auth-somo.css" />
  <link rel="stylesheet" href="../assets/css/admin-portal.css" />
  <link rel="stylesheet" href="assets/css/admin-ai-assistant.css" />
  <script src="../assets/js/config.js"></script>
  <title>Admin - All Deliveries</title>
</head>
<body class="admin-portal-body">
    <div class="container">
        <div class="header">
            <h1>📍 All Deliveries - Admin Dashboard</h1>
            <p>Monitor all active deliveries across all merchants</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>Total Deliveries</h3>
                <div class="value" id="totalDeliveries">-</div>
            </div>
            <div class="stat-card">
                <h3>Active</h3>
                <div class="value" id="activeDeliveries">-</div>
            </div>
            <div class="stat-card">
                <h3>Delivered</h3>
                <div class="value" id="deliveredDeliveries">-</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="value" id="pendingDeliveries">-</div>
            </div>
        </div>

        <div class="filters">
            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="delivered">Delivered</option>
                <option value="pending">Pending</option>
            </select>
            <select id="merchantFilter">
                <option value="all">All Merchants</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search by order ID or customer...">
        </div>

        <div class="deliveries-grid" id="deliveriesGrid">
            <div class="loading">Loading deliveries...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE || 'https://api.callsomo.com';

        let allDeliveries = [];
        let allMerchants = [];

        async function loadDeliveries() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/deliveries`, {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    allDeliveries = data.deliveries || [];
                    updateStats(data);
                    renderDeliveries(allDeliveries);
                } else {
                    console.error('Failed to load deliveries:', data.error);
                }
            } catch (error) {
                console.error('Error loading deliveries:', error);
            }
        }

        function updateStats(data) {
            document.getElementById('totalDeliveries').textContent = data.count || 0;
            document.getElementById('activeDeliveries').textContent = data.active || 0;
            document.getElementById('deliveredDeliveries').textContent = data.delivered || 0;
            document.getElementById('pendingDeliveries').textContent = (data.count - data.active - data.delivered) || 0;
        }

        function renderDeliveries(deliveries) {
            const grid = document.getElementById('deliveriesGrid');
            
            if (deliveries.length === 0) {
                grid.innerHTML = '<div class="loading">No deliveries found</div>';
                return;
            }

            grid.innerHTML = deliveries.map(delivery => {
                const status = delivery.delivery_status || 'pending';
                const statusClass = `status-${status === 'out_for_delivery' || status === 'in_transit' ? 'active' : status === 'delivered' ? 'delivered' : 'pending'}`;
                const statusText = status === 'out_for_delivery' ? 'Out for Delivery' : 
                                 status === 'in_transit' ? 'In Transit' :
                                 status === 'delivered' ? 'Delivered' : 'Pending';

                return `
                    <div class="delivery-card">
                        <div class="delivery-header">
                            <div class="delivery-id">Order #${delivery.id.substring(0, 8).toUpperCase()}</div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="delivery-info">
                            <div><strong>Merchant:</strong> ${delivery.merchant_name || 'Unknown'}</div>
                            <div><strong>Customer:</strong> ${delivery.customer_name || 'N/A'}</div>
                            <div><strong>Product:</strong> ${delivery.product_name || 'N/A'}</div>
                            <div><strong>Amount:</strong> $${parseFloat(delivery.total_amount || 0).toFixed(2)}</div>
                            ${delivery.driver_name ? `<div><strong>Driver:</strong> ${delivery.driver_name}</div>` : ''}
                            ${delivery.current_address ? `<div><strong>Location:</strong> ${delivery.current_address}</div>` : ''}
                            ${delivery.last_location_update ? `<div><strong>Last Update:</strong> ${new Date(delivery.last_location_update).toLocaleString()}</div>` : ''}
                        </div>
                        ${(status === 'out_for_delivery' || status === 'in_transit') && delivery.current_latitude && delivery.current_longitude ? 
                            `<button class="map-button" onclick="viewDeliveryMap('${delivery.id}')">📍 View on Map</button>` : ''}
                    </div>
                `;
            }).join('');
        }

        function viewDeliveryMap(orderId) {
            // Open tracking in new window or modal
            window.open(`/customer/order-tracking.html?order_id=${orderId}`, '_blank');
        }

        // Filter handlers
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            filterDeliveries();
        });

        document.getElementById('merchantFilter').addEventListener('change', (e) => {
            filterDeliveries();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterDeliveries();
        });

        function filterDeliveries() {
            const statusFilter = document.getElementById('statusFilter').value;
            const merchantFilter = document.getElementById('merchantFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allDeliveries;

            if (statusFilter !== 'all') {
                if (statusFilter === 'active') {
                    filtered = filtered.filter(d => d.delivery_status === 'out_for_delivery' || d.delivery_status === 'in_transit');
                } else {
                    filtered = filtered.filter(d => d.delivery_status === statusFilter);
                }
            }

            if (merchantFilter !== 'all') {
                filtered = filtered.filter(d => d.merchant_id === merchantFilter);
            }

            if (searchTerm) {
                filtered = filtered.filter(d => 
                    d.id.toLowerCase().includes(searchTerm) ||
                    (d.customer_name && d.customer_name.toLowerCase().includes(searchTerm)) ||
                    (d.customer_email && d.customer_email.toLowerCase().includes(searchTerm))
                );
            }

            renderDeliveries(filtered);
        }

        // Load on page load
        loadDeliveries();
    </script>
</body>
</html>
