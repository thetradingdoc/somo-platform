<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Details - Consʌlt CRM</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <script src="../assets/js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #808080;
            --border-color: #2a2a2a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 64px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 24px;
        }

        .sidebar-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .sidebar-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .breadcrumbs {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .breadcrumbs a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Pipeline Stages */
        .pipeline-stages {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .stage-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 6px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stage-item.completed {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .stage-item.active {
            background: var(--bg-secondary);
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .stage-check {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* Key Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-value.high {
            color: var(--accent-green);
        }

        .metric-value.low {
            color: var(--accent-red);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Sections */
        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 14px;
            color: var(--text-primary);
        }

        /* Activity Timeline */
        .activity-item {
            display: flex;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-icon.call {
            background: var(--accent-blue);
        }

        .activity-icon.email {
            background: var(--accent-green);
        }

        .activity-icon.note {
            background: var(--accent-yellow);
        }

        .activity-icon.update {
            background: var(--accent-purple);
        }

        .activity-content {
            flex: 1;
        }

        .activity-subject {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .activity-description {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .activity-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Mobile responsiveness */
        @media (max-width: 900px) {
            .content-area {
                padding: 16px;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: flex-start;
                padding: 8px 12px;
                gap: 12px;
            }

            .top-header {
                padding: 12px 16px;
            }

            .content-area {
                padding: 16px;
            }
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-qualified {
            background: var(--accent-green);
            color: white;
        }

        .badge-unqualified {
            background: var(--accent-yellow);
            color: var(--bg-primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="/admin/crm.html" class="sidebar-icon" title="Back to CRM">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
            <a href="/admin/leads.html" class="sidebar-icon" title="Lead Generator">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </a>
            <a href="/admin" class="sidebar-icon" title="Admin Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Header -->
            <div class="top-header">
                <div class="breadcrumbs">
                    <a href="/admin/crm.html">Opportunities</a> > <span id="leadName">Loading...</span>
                </div>
                <div class="page-title" id="leadTitle">Lead Details</div>
                <div class="page-subtitle" id="leadSubtitle">Loading lead information...</div>
                
                <!-- Pipeline Stages -->
                <div class="pipeline-stages" id="pipelineStages">
                    <!-- Stages will be populated here -->
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Key Metrics -->
                <div class="metrics-grid" id="metricsGrid">
                    <!-- Metrics will be populated here -->
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('overview')">Overview</button>
                    <button class="tab" onclick="switchTab('activities')">Activities</button>
                </div>

                <!-- Overview Tab -->
                <div id="overviewTab" class="tab-content active">
                    <!-- Opportunity Details -->
                    <div class="section">
                        <div class="section-title">Opportunity Details</div>
                        <div class="info-grid" id="opportunityDetails">
                            <!-- Details will be populated here -->
                        </div>
                    </div>

                    <!-- Contact Information -->
                    <div class="section">
                        <div class="section-title">Contact Information</div>
                        <div class="info-grid" id="contactInfo">
                            <!-- Contact info will be populated here -->
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="section">
                        <div class="section-title">Notes</div>
                        <div class="form-group">
                            <textarea class="form-textarea" id="leadNotes" placeholder="Add notes about this lead..."></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="saveNotes()">Save Notes</button>
                    </div>
                </div>

                <!-- Activities Tab -->
                <div id="activitiesTab" class="tab-content">
                    <div class="section">
                        <div class="section-title">Activity Timeline</div>
                        <div id="activityTimeline">
                            <!-- Activities will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE_URL || 'http://localhost:4000';
        const PIPELINE_STAGES = [
            { id: 'new', name: 'New Leads' },
            { id: 'contacted', name: 'Contacted' },
            { id: 'qualified', name: 'Qualified' },
            { id: 'demo', name: 'Demo Scheduled' },
            { id: 'proposal', name: 'Proposal Sent' },
            { id: 'negotiation', name: 'Negotiation' },
            { id: 'closed_won', name: 'Closed Won' },
            { id: 'closed_lost', name: 'Closed Lost' }
        ];

        let currentLead = null;

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json'
            };
        }

        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tabName}Tab`).classList.add('active');
        }

        async function loadLead() {
            const leadId = getUrlParam('id');
            if (!leadId) {
                alert('No lead ID provided');
                window.location.href = '/admin/crm.html';
                return;
            }

            try {
                // Load lead details
                const res = await fetch(`${API_BASE}/api/admin/leads/${leadId}`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();

                if (data.success) {
                    currentLead = data.lead;
                    renderLead(data.lead);
                } else {
                    alert('Lead not found');
                    window.location.href = '/admin/crm.html';
                }
            } catch (error) {
                console.error('Error loading lead:', error);
                alert('Error loading lead');
            }
        }

        function renderLead(lead) {
            // Header
            document.getElementById('leadName').textContent = lead.clinic_name || 'Unknown Clinic';
            document.getElementById('leadTitle').textContent = lead.clinic_name || 'Lead Details';
            document.getElementById('leadSubtitle').textContent = lead.location || 'No location';

            // Pipeline stages
            renderPipelineStages(lead.pipeline_stage);

            // Metrics
            renderMetrics(lead);

            // Opportunity details
            renderOpportunityDetails(lead);

            // Contact info
            renderContactInfo(lead);

            // Notes
            document.getElementById('leadNotes').value = lead.notes || '';

            // Load activities
            loadActivities(lead.id);
        }

        function renderPipelineStages(currentStage) {
            const container = document.getElementById('pipelineStages');
            const currentIndex = PIPELINE_STAGES.findIndex(s => s.id === currentStage);

            container.innerHTML = PIPELINE_STAGES.map((stage, index) => {
                const isCompleted = index < currentIndex;
                const isActive = index === currentIndex;
                
                return `
                    <div class="stage-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}">
                        <div class="stage-check">${isCompleted ? '✓' : index + 1}</div>
                        <span>${stage.name}</span>
                    </div>
                `;
            }).join('');
        }

        function renderMetrics(lead) {
            const container = document.getElementById('metricsGrid');
            
            const opportunityAge = lead.created_at ? Math.floor((new Date() - new Date(lead.created_at)) / (1000 * 60 * 60 * 24)) : 0;
            const daysInStage = lead.last_called_at ? Math.floor((new Date() - new Date(lead.last_called_at)) / (1000 * 60 * 60 * 24)) : 0;

            container.innerHTML = `
                <div class="metric-card">
                    <div class="metric-label">QUALIFICATION STATUS</div>
                    <div class="metric-value ${lead.is_qualified ? 'high' : 'low'}">
                        ${lead.is_qualified ? '✓ Qualified' : '⚠ Unqualified'}
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">LEAD SCORE</div>
                    <div class="metric-value">${lead.lead_score || 0}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">OPPORTUNITY AGE</div>
                    <div class="metric-value">${opportunityAge} days</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">CALLS</div>
                    <div class="metric-value">${lead.call_count || 0}</div>
                </div>
            `;
        }

        function renderOpportunityDetails(lead) {
            const container = document.getElementById('opportunityDetails');
            
            container.innerHTML = `
                <div class="info-item">
                    <div class="info-label">PIPELINE STAGE</div>
                    <div class="info-value">${PIPELINE_STAGES.find(s => s.id === lead.pipeline_stage)?.name || lead.pipeline_stage}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">NEXT ACTION</div>
                    <div class="info-value">${lead.next_action || 'Not set'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">FOLLOW-UP DATE</div>
                    <div class="info-value">${lead.follow_up_date ? new Date(lead.follow_up_date).toLocaleDateString() : 'Not set'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">SOURCE</div>
                    <div class="info-value">${lead.source || 'Unknown'}</div>
                </div>
            `;
        }

        function renderContactInfo(lead) {
            const container = document.getElementById('contactInfo');
            
            container.innerHTML = `
                <div class="info-item">
                    <div class="info-label">CLINIC NAME</div>
                    <div class="info-value">${lead.clinic_name || 'N/A'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">LOCATION</div>
                    <div class="info-value">${lead.location || 'N/A'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">PHONE</div>
                    <div class="info-value">${lead.clinic_phone || '<span style="color: var(--accent-red);">Missing</span>'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">EMAIL</div>
                    <div class="info-value">${lead.clinic_email || '<span style="color: var(--accent-red);">Missing</span>'}</div>
                </div>
            `;
        }

        async function loadActivities(leadId) {
            try {
                const res = await fetch(`${API_BASE}/api/admin/leads/${leadId}/activities`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();

                if (data.success) {
                    renderActivities(data.activities);
                }
            } catch (error) {
                console.error('Error loading activities:', error);
            }
        }

        function renderActivities(activities) {
            const container = document.getElementById('activityTimeline');
            
            if (activities.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);">No activities yet</div>';
                return;
            }

            container.innerHTML = activities.map(activity => {
                const iconClass = activity.activity_type || 'update';
                const date = new Date(activity.activity_date || activity.created_at);
                
                return `
                    <div class="activity-item">
                        <div class="activity-icon ${iconClass}">
                            ${getActivityIcon(activity.activity_type)}
                        </div>
                        <div class="activity-content">
                            <div class="activity-subject">${activity.activity_subject || activity.activity_type}</div>
                            <div class="activity-description">${activity.activity_description || ''}</div>
                            <div class="activity-date">${date.toLocaleString()}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getActivityIcon(type) {
            const icons = {
                'call': '📞',
                'email': '✉️',
                'note': '📝',
                'update': '🔄',
                'meeting': '📅'
            };
            return icons[type] || '📌';
        }

        async function saveNotes() {
            if (!currentLead) return;

            const notes = document.getElementById('leadNotes').value;

            try {
                const res = await fetch(`${API_BASE}/api/admin/jobs/${currentLead.id}/pipeline-stage`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ notes })
                });

                const data = await res.json();
                
                if (data.success) {
                    alert('Notes saved successfully!');
                    // Create activity
                    await fetch(`${API_BASE}/api/admin/leads/${currentLead.id}/activities`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({
                            activity_type: 'note',
                            activity_subject: 'Note Updated',
                            activity_description: 'Lead notes were updated'
                        })
                    });
                    loadActivities(currentLead.id);
                }
            } catch (error) {
                alert('Error saving notes: ' + error.message);
            }
        }

        // Load on page load
        loadLead();
    </script>
</body>
</html>
