<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somo — Coding reviews</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/somo-front-desk-components.css">
  <link rel="stylesheet" href="/assets/css/admin-portal.css">
  <script src="/assets/js/config.js"></script>
</head>
<body>
  <aside id="admin-sidebar"></aside>
  <main class="admin-crm-main">
    <div class="admin-crm-header">
      <div>
        <div class="admin-crm-title">Coding review queue</div>
        <div class="admin-crm-subtitle">Pending HITL coding decisions</div>
      </div>
    </div>

    <div class="admin-crm-card sfd-card">
      <div id="reviewTable"><div class="admin-crm-skeleton" style="height:120px;margin:0 18px 18px;"></div></div>
    </div>
  </main>

  <script src="/admin/assets/js/admin-shell.js"></script>
  <script>
    const { apiFetch, esc, init, showToast } = AdminShell;
    init('coding-reviews');

    document.addEventListener('DOMContentLoaded', load);

    async function load() {
      const el = document.getElementById('reviewTable');
      try {
        const data = await apiFetch('/api/admin/coding-reviews?status=pending');
        const reviews = data.reviews || [];
        if (!reviews.length) {
          el.innerHTML = '<div class="sfd-empty-state" style="margin:18px;text-align:center;padding:24px;"><p style="margin:0;color:var(--muted);">No pending reviews</p></div>';
          return;
        }
        el.innerHTML = `
          <table class="sfd-table admin-crm-data-table">
            <thead>
              <tr>
                <th>Session</th>
                <th>ICD-10</th>
                <th>CPT</th>
                <th>Confidence</th>
                <th>SLA</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${reviews.map((r) => `
                <tr>
                  <td>${esc(r.call_id || r.id)}</td>
                  <td>${esc(r.proposed_icd10 || '')}</td>
                  <td>${esc(r.proposed_cpt || '')}</td>
                  <td>${esc(String(r.confidence_score ?? ''))}</td>
                  <td>${esc(r.sla_deadline || '')}</td>
                  <td>
                    <button class="admin-crm-btn-outline admin-crm-btn-sm" data-id="${esc(r.id)}" data-action="approve">Approve</button>
                    <button class="admin-crm-btn-outline admin-crm-btn-sm" data-id="${esc(r.id)}" data-action="reject">Reject</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
        el.querySelectorAll('button[data-action]').forEach((btn) => {
          btn.onclick = () => resolveReview(btn.dataset.id, btn.dataset.action);
        });
      } catch (e) {
        el.innerHTML = `<p style="color:var(--muted);padding:0 18px 18px;">${esc(e.message)}</p>`;
      }
    }

    async function resolveReview(id, action) {
      try {
        await apiFetch(`/api/admin/coding-reviews/${id}/${action}`, {
          method: 'POST',
          body: JSON.stringify({ resolved_by: 'admin_ui', rejection_reason: 'clinical_reject' }),
        });
        showToast(`Review ${action}d`, 'success');
        load();
      } catch (e) { showToast(e.message, 'error'); }
    }
  </script>
</body>
</html>
