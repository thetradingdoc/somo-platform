<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somo — Lead detail</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/admin-portal.css">
  <script src="/assets/js/config.js"></script>
</head>
<body>
  <aside id="admin-sidebar"></aside>
  <main class="admin-crm-main admin-crm-main--narrow">
    <a href="/admin/pipeline.html" class="admin-crm-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Back to pipeline
    </a>

    <div id="loading" style="padding:40px;text-align:center;color:var(--muted);">Loading lead...</div>
    <div id="leadDetail" class="hidden">
      <div id="suggestionBanner" class="admin-crm-suggestion-banner hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 8v5m0 4h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <div style="flex:1;">
          <div><span id="suggestionText"></span></div>
          <div class="actions">
            <button class="btn btn-primary admin-crm-btn-sm" id="btnAcceptSuggestion">Accept stage</button>
            <button class="admin-crm-btn-outline admin-crm-btn-sm" id="btnDismissSuggestion">Dismiss</button>
          </div>
        </div>
      </div>

      <div class="admin-crm-detail-head">
        <div>
          <h1 class="admin-crm-detail-name" id="leadName">—</h1>
          <div class="admin-crm-chip-row" id="leadMeta"></div>
        </div>
        <div class="admin-crm-lead-actions">
          <div class="admin-crm-lead-score" id="leadScore">—</div>
          <button class="admin-crm-btn-outline admin-crm-btn-danger" id="deleteBtn" data-require-capability="platform.leads">Delete lead</button>
          <button class="admin-crm-btn-outline" id="inviteBtn" data-require-capability="platform.leads">Send pilot invite</button>
          <button class="btn btn-primary" id="callBtn" data-require-capability="platform.leads">Call now</button>
        </div>
      </div>

      <div class="admin-crm-two-col">
        <div class="admin-crm-card">
          <div class="admin-crm-card-head"><h3 class="admin-crm-card-title">Contact</h3></div>
          <dl class="admin-crm-kv">
            <div class="admin-crm-kv-row"><dt>Phone</dt><dd id="iPhone">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Email</dt><dd id="iEmail">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Location</dt><dd id="iLocation">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Specialty</dt><dd id="iSpecialty">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Job title</dt><dd id="iTitle">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Languages</dt><dd id="iLanguages">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Website</dt><dd id="iWebsite">—</dd></div>
            <div class="admin-crm-kv-row"><dt>Contact status</dt><dd id="iContactStatus">—</dd></div>
          </dl>
          <div class="admin-crm-input-row" style="padding:0 18px 18px;">
            <input type="url" class="admin-crm-text-input" id="websiteOverride" placeholder="Paste a website URL to re-enrich…">
            <button class="admin-crm-btn-outline admin-crm-btn-sm" id="btnSaveWebsite">Save</button>
            <button class="admin-crm-btn-outline admin-crm-btn-sm" id="btnReEnrich">Re-enrich</button>
          </div>
        </div>
        <div class="admin-crm-card">
          <div class="admin-crm-card-head"><h3 class="admin-crm-card-title">Pipeline stage</h3></div>
          <div style="padding:0 18px 18px;">
            <select id="stageSelect" class="admin-crm-text-input">
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="demo">Demo</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
            </select>
            <p id="stageMeta" style="font-size:11.5px;color:var(--muted);margin:10px 0 0;"></p>
          </div>
        </div>
      </div>

      <div class="admin-crm-card">
        <div class="admin-crm-card-head"><h3 class="admin-crm-card-title">Add a note</h3></div>
        <div style="padding:0 18px 18px;">
          <textarea id="noteText" class="admin-crm-text-input" placeholder="Log a note about this lead…"></textarea>
          <div class="admin-crm-input-row" style="margin-top:10px;">
            <button class="admin-crm-btn-outline admin-crm-btn-sm" id="btnSaveNote">Save note</button>
            <button class="admin-crm-btn-outline admin-crm-btn-sm" id="btnEmail">Send email</button>
          </div>
        </div>
      </div>

      <div class="admin-crm-card">
        <div class="admin-crm-card-head"><h3 class="admin-crm-card-title">Call history</h3></div>
        <div id="callHistory"></div>
      </div>

      <div class="admin-crm-card">
        <div class="admin-crm-card-head"><h3 class="admin-crm-card-title">Activity log</h3></div>
        <div id="activityLog"></div>
      </div>
    </div>
  </main>

  <script src="/admin/assets/js/admin-shell.js"></script>
  <script>
    const { apiFetch, esc, init, showToast, callLead: shellCallLead, confirmAction } = AdminShell;
    let leadId, leadData;
    let pollTimer = null;

    init('pipeline');

    document.addEventListener('DOMContentLoaded', () => {
      leadId = new URLSearchParams(location.search).get('id');
      if (!leadId) {
        document.getElementById('loading').textContent = 'No lead ID. Open from pipeline.';
        return;
      }
      document.getElementById('callBtn').onclick = () => {
        shellCallLead(leadId, leadData?.clinic_name, {
          onSuccess: () => startPollAfterCall(),
        });
      };
      document.getElementById('btnReEnrich').onclick = reEnrich;
      document.getElementById('btnSaveWebsite').onclick = saveWebsite;
      document.getElementById('btnSaveNote').onclick = saveNote;
      document.getElementById('btnEmail').onclick = sendEmail;
      document.getElementById('stageSelect').onchange = (e) => updateStage(e.target.value);
      document.getElementById('deleteBtn').onclick = deleteLead;
      document.getElementById('inviteBtn').onclick = sendPilotInvite;
      document.getElementById('btnAcceptSuggestion').onclick = acceptSuggestion;
      document.getElementById('btnDismissSuggestion').onclick = dismissSuggestion;
      loadLead();
    });

    function startPollAfterCall() {
      let attempts = 0;
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        attempts++;
        await loadLead(true);
        if (attempts >= 20) clearInterval(pollTimer);
      }, 3000);
    }

    async function loadLead(silent) {
      try {
        const r = await apiFetch(`/api/admin/scrape/leads/${leadId}`);
        leadData = r.lead;
        if (!silent) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('leadDetail').classList.remove('hidden');
          document.title = `Somo — ${leadData.clinic_name}`;
        }
        renderLead(r);
      } catch (e) {
        if (!silent) document.getElementById('loading').textContent = 'Could not load: ' + e.message;
      }
    }

    function renderLead({ lead, calls, activities }) {
      document.getElementById('leadName').textContent = lead.clinic_name || 'Unknown';
      document.getElementById('leadScore').textContent = lead.lead_score || '—';
      document.getElementById('leadMeta').innerHTML = [
        lead.location && `<span class="admin-crm-chip">${esc(lead.location)}</span>`,
        lead.specialty && `<span class="admin-crm-chip">${esc(lead.specialty)}</span>`,
        lead.lead_source && `<span class="admin-crm-chip">Source: ${esc(String(lead.lead_source).split(':')[0])}</span>`,
      ].filter(Boolean).join('');

      document.getElementById('iPhone').textContent = lead.clinic_phone || '—';
      document.getElementById('iEmail').innerHTML = lead.clinic_email
        ? `<a href="mailto:${esc(lead.clinic_email)}" style="color:var(--forest);font-weight:600;">${esc(lead.clinic_email)}</a>` : '—';
      document.getElementById('iLocation').textContent = lead.location || '—';
      document.getElementById('iSpecialty').textContent = lead.specialty || '—';
      document.getElementById('iTitle').textContent = lead.title || '—';
      document.getElementById('iLanguages').textContent = (lead.language_labels && lead.language_labels.length)
        ? `${lead.language_labels.join(', ')}${lead.preferred_language ? ` (agent: ${lead.preferred_language})` : ''}`
        : 'English';
      document.getElementById('iWebsite').innerHTML = lead.website_url
        ? `<a href="${esc(lead.website_url)}" target="_blank" rel="noopener" style="color:var(--forest);font-weight:600;">${esc(lead.website_url.replace(/^https?:\/\//, '').replace(/\/$/, ''))} ↗</a>`
        : '—';
      const statusEl = document.getElementById('iContactStatus');
      const status = lead.contact_status || '—';
      statusEl.innerHTML = status === 'verified'
        ? '<span class="admin-crm-pill admin-crm-pill-success">Verified</span>'
        : esc(status);

      document.getElementById('stageSelect').value = lead.pipeline_stage || 'new';
      document.getElementById('stageMeta').textContent = [
        lead.call_count && `${lead.call_count} call(s)`,
        lead.last_called_at && `last call ${formatDate(lead.last_called_at)}`,
      ].filter(Boolean).join(' · ');

      const callBtn = document.getElementById('callBtn');
      const callable = lead.callable === true || String(lead.clinic_phone || '').replace(/\D/g, '').length >= 10;
      callBtn.disabled = !callable;
      callBtn.style.opacity = callable ? '1' : '0.5';

      const banner = document.getElementById('suggestionBanner');
      if (lead.suggested_stage) {
        banner.classList.remove('hidden');
        document.getElementById('suggestionText').innerHTML =
          `Call ended recently. Outcome suggests moving this lead to <strong>${esc(lead.suggested_stage)}</strong>${lead.suggested_stage_note ? ` — ${esc(lead.suggested_stage_note)}` : ''}.`;
      } else {
        banner.classList.add('hidden');
      }

      renderCalls(calls || []);
      renderActivities(activities || []);
    }

    function renderCalls(calls) {
      const el = document.getElementById('callHistory');
      if (!calls.length) {
        el.innerHTML = '<div class="admin-crm-empty"><div class="admin-crm-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div><p>No calls yet</p></div>';
        return;
      }
      el.innerHTML = calls.map((c) => `
        <div class="admin-crm-call-card">
          <div class="admin-crm-call-top">
            <strong>${formatDate(c.created_at, true)}</strong>
            <span class="admin-crm-pill admin-crm-pill-success">${esc(c.outcome || c.status)}</span>
          </div>
          <div class="admin-crm-call-meta">${c.duration_seconds ? `${Math.floor(c.duration_seconds / 60)}m ${c.duration_seconds % 60}s` : '—'} · Retell sales agent</div>
          <button class="admin-crm-btn-outline admin-crm-btn-sm" style="margin-top:4px;" onclick="toggleTranscript('${c.id}')">View transcript</button>
          <div id="transcript-${c.id}" class="admin-crm-transcript hidden"></div>
        </div>
      `).join('');
    }

    async function toggleTranscript(callId) {
      const body = document.getElementById(`transcript-${callId}`);
      body.classList.toggle('hidden');
      if (body.classList.contains('hidden') || body.innerHTML) return;
      body.textContent = 'Loading...';
      try {
        const r = await apiFetch(`/api/admin/leads/calls/${callId}/transcript`);
        if (r.lines?.length) {
          body.innerHTML = r.lines.map((l) => `<div style="margin-bottom:6px;"><strong>${l.role === 'agent' ? 'Alex' : 'Contact'}:</strong> ${esc(l.text)}</div>`).join('');
        } else {
          body.textContent = r.raw || 'Transcript not available.';
        }
      } catch (e) { body.textContent = e.message; }
    }
    window.toggleTranscript = toggleTranscript;

    function renderActivities(activities) {
      const el = document.getElementById('activityLog');
      if (!activities.length) {
        el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">No activity yet</p>';
        return;
      }
      el.innerHTML = activities.map((a) => `
        <div class="admin-crm-activity-item">
          <span class="admin-crm-activity-time">${formatDate(a.created_at, true)}</span>
          <span>${esc(a.content || a.activity_description || a.activity_subject)}</span>
        </div>
      `).join('');
    }

    async function sendPilotInvite() {
      if (!leadData?.clinic_email && !leadData?.email) {
        return showToast('Add an email to this lead before sending an invite.', 'warning');
      }
      const email = leadData.clinic_email || leadData.email;
      if (!confirmAction(`Send pilot invite to ${email}? Lead will move to Won.`)) return;
      const btn = document.getElementById('inviteBtn');
      btn.disabled = true;
      try {
        const r = await apiFetch(`/api/admin/invites/from-lead/${leadId}`, {
          method: 'POST',
          body: JSON.stringify({ email, send_email: true, convert: true }),
        });
        showToast(`Invite sent — link copied to clipboard`, 'success');
        if (r.invite_url && navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(r.invite_url).catch(() => {});
        }
        loadLead(true);
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteLead() {
      if (!confirmAction(`Permanently delete "${leadData?.clinic_name}"? Audit log will be kept.`)) return;
      try {
        await apiFetch(`/api/admin/leads/${leadId}`, { method: 'DELETE' });
        showToast('Lead deleted', 'success');
        setTimeout(() => { location.href = '/admin/pipeline.html'; }, 800);
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function acceptSuggestion() {
      try {
        await apiFetch(`/api/admin/scrape/leads/${leadId}/suggested-stage/accept`, { method: 'POST' });
        showToast('Stage updated', 'success');
        loadLead();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function dismissSuggestion() {
      try {
        await apiFetch(`/api/admin/scrape/leads/${leadId}/suggested-stage/dismiss`, { method: 'POST' });
        document.getElementById('suggestionBanner').classList.add('hidden');
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function updateStage(stage) {
      try {
        await apiFetch(`/api/admin/scrape/leads/${leadId}/stage`, {
          method: 'PUT',
          body: JSON.stringify({ stage }),
        });
        showToast('Stage updated', 'success');
      } catch (e) {
        showToast(e.message, 'error');
        document.getElementById('stageSelect').value = leadData.pipeline_stage;
      }
    }

    async function saveWebsite() {
      const url = document.getElementById('websiteOverride').value.trim();
      if (!url) return showToast('Enter a website URL', 'warning');
      try {
        await apiFetch(`/api/admin/leads/${leadId}`, {
          method: 'PUT',
          body: JSON.stringify({ source_url: url }),
        });
        showToast('Website saved — re-enriching...', 'success');
        document.getElementById('websiteOverride').value = '';
        await reEnrich();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function saveNote() {
      const content = document.getElementById('noteText').value.trim();
      if (!content) return;
      await apiFetch(`/api/admin/scrape/leads/${leadId}/note`, {
        method: 'POST',
        body: JSON.stringify({ content }),
      });
      document.getElementById('noteText').value = '';
      showToast('Note saved', 'success');
      loadLead();
    }

    async function sendEmail() {
      if (!leadData?.clinic_email) return showToast('No email on file', 'warning');
      try {
        await apiFetch(`/api/admin/leads/${leadId}/send-email`, { method: 'POST' });
        showToast('Email sent', 'success');
        loadLead();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function reEnrich() {
      document.getElementById('iContactStatus').textContent = 'Enriching...';
      try {
        const r = await apiFetch(`/api/admin/leads/${leadId}/enrich`, { method: 'POST' });
        document.getElementById('iPhone').textContent = r.phone || '—';
        document.getElementById('iContactStatus').textContent = r.phone ? 'verified' : 'needs_phone';
        if (r.email) document.getElementById('iEmail').innerHTML = `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`;
        showToast(r.phone ? 'Phone found' : 'No phone found yet', r.phone ? 'success' : 'warning');
        loadLead(true);
      } catch (e) { showToast(e.message, 'error'); }
    }

    function formatDate(iso, withTime) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (withTime) return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
  </script>
</body>
</html>
