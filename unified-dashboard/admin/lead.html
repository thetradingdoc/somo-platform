<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somo — Lead detail</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/admin-portal.css">
  <script src="/assets/js/config.js"></script>
</head>
<body>
  <aside id="admin-sidebar"></aside>
  <main class="admin-crm-main admin-crm-main--narrow">
    <a href="/admin/pipeline.html" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:16px;">← Back to pipeline</a>

    <div id="loading" style="padding:40px;text-align:center;color:var(--muted);">Loading lead...</div>
    <div id="leadDetail" class="hidden">
      <div id="suggestionBanner" class="admin-crm-suggestion-banner hidden">
        <div><strong>Post-call suggestion:</strong> <span id="suggestionText"></span></div>
        <div class="actions">
          <button class="btn btn-primary btn-sm" id="btnAcceptSuggestion">Accept stage</button>
          <button class="admin-crm-btn-outline btn-sm" id="btnDismissSuggestion">Dismiss</button>
        </div>
      </div>

      <div class="admin-crm-header">
        <div style="flex:1;">
          <div class="admin-crm-title" id="leadName">—</div>
          <div id="leadMeta" style="font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;"></div>
        </div>
        <div class="admin-crm-header-actions">
          <div class="admin-crm-lead-score" id="leadScore">—</div>
          <button class="admin-crm-btn-outline" id="deleteBtn" data-require-capability="platform.leads" style="color:#c0392b;border-color:#c0392b;">Delete</button>
          <button class="btn btn-primary" id="callBtn" data-require-capability="platform.leads">Call now</button>
        </div>
      </div>

      <div class="admin-crm-two-col">
        <div class="admin-crm-card">
          <div class="admin-crm-card-title">Contact</div>
          <table style="width:100%;font-size:13px;border-collapse:collapse;">
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);width:38%;">Phone</td><td id="iPhone">—</td></tr>
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);">Email</td><td id="iEmail">—</td></tr>
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);">Location</td><td id="iLocation">—</td></tr>
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);">Specialty</td><td id="iSpecialty">—</td></tr>
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);">Job title</td><td id="iTitle">—</td></tr>
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);">Languages</td><td id="iLanguages">—</td></tr>
            <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 0;color:var(--muted);">Website</td><td id="iWebsite">—</td></tr>
            <tr><td style="padding:6px 0;color:var(--muted);">Contact status</td><td id="iContactStatus">—</td></tr>
          </table>
          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            <input type="url" id="websiteOverride" placeholder="https://clinic-website.com" style="flex:1;min-width:180px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:12px;">
            <button class="admin-crm-btn-outline" style="font-size:12px;" id="btnSaveWebsite">Save website</button>
            <button class="admin-crm-btn-outline" style="font-size:12px;" id="btnReEnrich">Re-enrich contact</button>
          </div>
        </div>
        <div class="admin-crm-card">
          <div class="admin-crm-card-title">Pipeline stage</div>
          <select id="stageSelect" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:13px;margin-bottom:8px;">
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="demo">Demo scheduled</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
          </select>
          <div id="stageMeta" style="font-size:12px;color:var(--muted);"></div>
        </div>
      </div>

      <div class="admin-crm-card">
        <div class="admin-crm-card-title">Add a note</div>
        <textarea id="noteText" style="width:100%;min-height:80px;padding:10px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:13px;" placeholder="Notes, next steps..."></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn btn-primary btn-sm" id="btnSaveNote">Save note</button>
          <button class="admin-crm-btn-outline btn-sm" id="btnEmail">Send email</button>
        </div>
      </div>

      <div class="admin-crm-card">
        <div class="admin-crm-card-title">Call history</div>
        <div id="callHistory"></div>
      </div>

      <div class="admin-crm-card">
        <div class="admin-crm-card-title">Activity log</div>
        <div id="activityLog"></div>
      </div>
    </div>
  </main>

  <script src="/admin/assets/js/admin-shell.js"></script>
  <script>
    const { apiFetch, esc, init, showToast, callLead: shellCallLead, confirmAction } = AdminShell;
    let leadId, leadData;
    let pollTimer = null;

    init('pipeline');

    document.addEventListener('DOMContentLoaded', () => {
      leadId = new URLSearchParams(location.search).get('id');
      if (!leadId) {
        document.getElementById('loading').textContent = 'No lead ID. Open from pipeline.';
        return;
      }
      document.getElementById('callBtn').onclick = () => {
        shellCallLead(leadId, leadData?.clinic_name, {
          onSuccess: () => startPollAfterCall(),
        });
      };
      document.getElementById('btnReEnrich').onclick = reEnrich;
      document.getElementById('btnSaveWebsite').onclick = saveWebsite;
      document.getElementById('btnSaveNote').onclick = saveNote;
      document.getElementById('btnEmail').onclick = sendEmail;
      document.getElementById('stageSelect').onchange = (e) => updateStage(e.target.value);
      document.getElementById('deleteBtn').onclick = deleteLead;
      document.getElementById('btnAcceptSuggestion').onclick = acceptSuggestion;
      document.getElementById('btnDismissSuggestion').onclick = dismissSuggestion;
      loadLead();
    });

    function startPollAfterCall() {
      let attempts = 0;
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        attempts++;
        await loadLead(true);
        if (attempts >= 20) clearInterval(pollTimer);
      }, 3000);
    }

    async function loadLead(silent) {
      try {
        const r = await apiFetch(`/api/admin/scrape/leads/${leadId}`);
        leadData = r.lead;
        if (!silent) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('leadDetail').classList.remove('hidden');
          document.title = `Somo — ${leadData.clinic_name}`;
        }
        renderLead(r);
      } catch (e) {
        if (!silent) document.getElementById('loading').textContent = 'Could not load: ' + e.message;
      }
    }

    function renderLead({ lead, calls, activities }) {
      document.getElementById('leadName').textContent = lead.clinic_name || 'Unknown';
      document.getElementById('leadScore').textContent = lead.lead_score || '—';
      document.getElementById('leadMeta').innerHTML = [
        lead.location && `<span>${esc(lead.location)}</span>`,
        lead.specialty && `<span>${esc(lead.specialty)}</span>`,
        lead.lead_source && `<span>via ${esc(String(lead.lead_source).split(':')[0])}</span>`,
      ].filter(Boolean).join('');

      document.getElementById('iPhone').textContent = lead.clinic_phone || '—';
      document.getElementById('iEmail').innerHTML = lead.clinic_email
        ? `<a href="mailto:${esc(lead.clinic_email)}">${esc(lead.clinic_email)}</a>` : '—';
      document.getElementById('iLocation').textContent = lead.location || '—';
      document.getElementById('iSpecialty').textContent = lead.specialty || '—';
      document.getElementById('iTitle').textContent = lead.title || '—';
      document.getElementById('iLanguages').textContent = (lead.language_labels && lead.language_labels.length)
        ? `${lead.language_labels.join(', ')}${lead.preferred_language ? ` (agent: ${lead.preferred_language})` : ''}`
        : 'English';
      document.getElementById('iWebsite').innerHTML = lead.website_url
        ? `<a href="${esc(lead.website_url)}" target="_blank" rel="noopener">clinic website ↗</a>`
        : '—';
      document.getElementById('iContactStatus').textContent = lead.contact_status || '—';

      document.getElementById('stageSelect').value = lead.pipeline_stage || 'new';
      document.getElementById('stageMeta').textContent = [
        lead.call_count && `${lead.call_count} call(s)`,
        lead.last_called_at && `last call ${formatDate(lead.last_called_at)}`,
      ].filter(Boolean).join(' · ');

      const callBtn = document.getElementById('callBtn');
      const callable = lead.callable === true || String(lead.clinic_phone || '').replace(/\D/g, '').length >= 10;
      callBtn.disabled = !callable;
      callBtn.style.opacity = callable ? '1' : '0.5';

      const banner = document.getElementById('suggestionBanner');
      if (lead.suggested_stage) {
        banner.classList.remove('hidden');
        document.getElementById('suggestionText').textContent =
          `Move to "${lead.suggested_stage}"${lead.suggested_stage_note ? ` — ${lead.suggested_stage_note}` : ''}`;
      } else {
        banner.classList.add('hidden');
      }

      renderCalls(calls || []);
      renderActivities(activities || []);
    }

    function renderCalls(calls) {
      const el = document.getElementById('callHistory');
      if (!calls.length) {
        el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">No calls yet</p>';
        return;
      }
      el.innerHTML = calls.map((c) => `
        <div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-weight:600;">${formatDate(c.created_at, true)}</span>
            <span class="admin-crm-badge admin-crm-badge-muted">${esc(c.outcome || c.status)}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Duration ${c.duration_seconds ? Math.floor(c.duration_seconds / 60) + 'm' : '—'}</div>
          <button class="admin-crm-btn-outline" style="font-size:12px;padding:4px 8px;" onclick="toggleTranscript('${c.id}')">View transcript</button>
          <div id="transcript-${c.id}" class="hidden" style="margin-top:10px;background:var(--bg);border-radius:8px;padding:12px;font-size:12px;font-family:monospace;max-height:240px;overflow-y:auto;"></div>
        </div>
      `).join('');
    }

    async function toggleTranscript(callId) {
      const body = document.getElementById(`transcript-${callId}`);
      body.classList.toggle('hidden');
      if (body.classList.contains('hidden') || body.innerHTML) return;
      body.textContent = 'Loading...';
      try {
        const r = await apiFetch(`/api/admin/leads/calls/${callId}/transcript`);
        if (r.lines?.length) {
          body.innerHTML = r.lines.map((l) => `<div style="margin-bottom:6px;"><strong>${l.role === 'agent' ? 'Alex' : 'Contact'}:</strong> ${esc(l.text)}</div>`).join('');
        } else {
          body.textContent = r.raw || 'Transcript not available.';
        }
      } catch (e) { body.textContent = e.message; }
    }
    window.toggleTranscript = toggleTranscript;

    function renderActivities(activities) {
      const el = document.getElementById('activityLog');
      if (!activities.length) {
        el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">No activity yet</p>';
        return;
      }
      el.innerHTML = activities.map((a) => `
        <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <div>${esc(a.content || a.activity_description || a.activity_subject)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${formatDate(a.created_at, true)}</div>
        </div>
      `).join('');
    }

    async function deleteLead() {
      if (!confirmAction(`Permanently delete "${leadData?.clinic_name}"? Audit log will be kept.`)) return;
      try {
        await apiFetch(`/api/admin/leads/${leadId}`, { method: 'DELETE' });
        showToast('Lead deleted', 'success');
        setTimeout(() => { location.href = '/admin/pipeline.html'; }, 800);
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function acceptSuggestion() {
      try {
        await apiFetch(`/api/admin/scrape/leads/${leadId}/suggested-stage/accept`, { method: 'POST' });
        showToast('Stage updated', 'success');
        loadLead();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function dismissSuggestion() {
      try {
        await apiFetch(`/api/admin/scrape/leads/${leadId}/suggested-stage/dismiss`, { method: 'POST' });
        document.getElementById('suggestionBanner').classList.add('hidden');
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function updateStage(stage) {
      try {
        await apiFetch(`/api/admin/scrape/leads/${leadId}/stage`, {
          method: 'PUT',
          body: JSON.stringify({ stage }),
        });
        showToast('Stage updated', 'success');
      } catch (e) {
        showToast(e.message, 'error');
        document.getElementById('stageSelect').value = leadData.pipeline_stage;
      }
    }

    async function saveWebsite() {
      const url = document.getElementById('websiteOverride').value.trim();
      if (!url) return showToast('Enter a website URL', 'warning');
      try {
        await apiFetch(`/api/admin/leads/${leadId}`, {
          method: 'PUT',
          body: JSON.stringify({ source_url: url }),
        });
        showToast('Website saved — re-enriching...', 'success');
        document.getElementById('websiteOverride').value = '';
        await reEnrich();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function saveNote() {
      const content = document.getElementById('noteText').value.trim();
      if (!content) return;
      await apiFetch(`/api/admin/scrape/leads/${leadId}/note`, {
        method: 'POST',
        body: JSON.stringify({ content }),
      });
      document.getElementById('noteText').value = '';
      showToast('Note saved', 'success');
      loadLead();
    }

    async function sendEmail() {
      if (!leadData?.clinic_email) return showToast('No email on file', 'warning');
      try {
        await apiFetch(`/api/admin/leads/${leadId}/send-email`, { method: 'POST' });
        showToast('Email sent', 'success');
        loadLead();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function reEnrich() {
      document.getElementById('iContactStatus').textContent = 'Enriching...';
      try {
        const r = await apiFetch(`/api/admin/leads/${leadId}/enrich`, { method: 'POST' });
        document.getElementById('iPhone').textContent = r.phone || '—';
        document.getElementById('iContactStatus').textContent = r.phone ? 'verified' : 'needs_phone';
        if (r.email) document.getElementById('iEmail').innerHTML = `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`;
        showToast(r.phone ? 'Phone found' : 'No phone found yet', r.phone ? 'success' : 'warning');
        loadLead(true);
      } catch (e) { showToast(e.message, 'error'); }
    }

    function formatDate(iso, withTime) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (withTime) return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
  </script>
</body>
</html>
