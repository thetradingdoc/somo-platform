<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/somo-tokens.css" />
  <link rel="stylesheet" href="../assets/css/signup-somo.css" />
  <link rel="stylesheet" href="../assets/css/auth-somo.css" />
  <link rel="stylesheet" href="../assets/css/admin-portal.css" />
  <link rel="stylesheet" href="assets/css/admin-ai-assistant.css" />
  <script src="../assets/js/config.js"></script>
  <title>Sales Pipeline - Somo Admin</title>
</head>
<body class="admin-portal-body">
    <div class="shell">
        <aside>
            <div class="logo admin-sidebar-logo"><img src="/assets/brand/somo-icon-lizard.png" alt="Somo" width="36" height="36" /></div>
            <div class="nav-icon" onclick="window.location.href='index.html'" title="Dashboard">📊</div>
            <div class="nav-icon" onclick="window.location.href='index.html?tab=tenants'" title="Tenants">🏥</div>
            <div class="nav-icon" onclick="window.location.href='index.html?tab=leads'" title="Leads">👥</div>
            <div class="nav-icon" title="Pipeline">📈</div>
            <div class="nav-icon" onclick="window.location.href='workflows.html'" title="Workflows">⚡</div>
            <div class="nav-icon" onclick="window.location.href='index.html?tab=clients'" title="Clients">💼</div>
        </aside>
        <main>
    <div class="container">
        <div style="margin-bottom: 16px;">
          <a href="index.html" style="color: var(--muted); text-decoration: none; font-size: 13px;">Dashboard</a>
          <span style="color: var(--muted); margin: 0 8px;">/</span>
          <span style="color: var(--text); font-size: 13px;">Pipeline</span>
        </div>
        <div class="header">
            <h1>Sales Pipeline</h1>
            <p>Track leads through the sales process - see who was called, who needs follow-up, and manage your pipeline</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <div class="value" id="totalLeads">-</div>
            </div>
            <div class="stat-card">
                <h3>Needs Follow-Up</h3>
                <div class="value" id="followUpCount">-</div>
            </div>
            <div class="stat-card">
                <h3>This Month Calls</h3>
                <div class="value" id="callsUsed">-</div>
            </div>
            <div class="stat-card">
                <h3>Calls Remaining</h3>
                <div class="value" id="callsRemaining">-</div>
            </div>
        </div>

        <div class="pipeline-container" id="pipelineContainer">
            <!-- Pipeline columns will be populated here -->
        </div>
    </div>

    <!-- Lead Detail Modal -->
    <div class="modal" id="leadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Lead Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="leadDetails">
                <!-- Lead details will be populated here -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE_URL || 'http://localhost:4000';
        const PIPELINE_STAGES = [
            { id: 'new', name: 'New Leads', color: '#6b7280' },
            { id: 'contacted', name: 'Contacted', color: '#16a637' },
            { id: 'qualified', name: 'Qualified', color: '#8b5cf6' },
            { id: 'demo', name: 'Demo Scheduled', color: '#f59e0b' },
            { id: 'proposal', name: 'Proposal Sent', color: '#ec4899' },
            { id: 'negotiation', name: 'Negotiation', color: '#14b8a6' },
            { id: 'closed_won', name: 'Closed Won', color: '#10b981' },
            { id: 'closed_lost', name: 'Closed Lost', color: '#ef4444' }
        ];

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json'
            };
        }

        async function loadPipeline() {
            try {
                // Load pipeline stats
                const statsRes = await fetch(`${API_BASE}/api/admin/leads/pipeline/stats`, {
                    headers: getAuthHeaders()
                });
                const statsData = await statsRes.json();

                if (statsData.success) {
                    updateStats(statsData);
                }

                // Load call usage
                const usageRes = await fetch(`${API_BASE}/api/admin/leads/stats/usage`, {
                    headers: getAuthHeaders()
                });
                const usageData = await usageRes.json();

                if (usageData.success) {
                    document.getElementById('callsUsed').textContent = usageData.calls_used || 0;
                    document.getElementById('callsRemaining').textContent = usageData.calls_remaining || 0;
                }

                // Load leads for each stage
                const container = document.getElementById('pipelineContainer');
                container.innerHTML = '';

                for (const stage of PIPELINE_STAGES) {
                    const column = await createPipelineColumn(stage);
                    container.appendChild(column);
                }

            } catch (error) {
                console.error('Error loading pipeline:', error);
            }
        }

        async function createPipelineColumn(stage) {
            const column = document.createElement('div');
            column.className = 'pipeline-column';
            column.style.borderTop = `4px solid ${stage.color}`;

            const header = document.createElement('h2');
            header.innerHTML = `
                ${stage.name}
                <span class="count" id="count-${stage.id}">0</span>
            `;
            column.appendChild(header);

            const leadsContainer = document.createElement('div');
            leadsContainer.id = `leads-${stage.id}`;
            column.appendChild(leadsContainer);

            // Load leads for this stage
            try {
                const res = await fetch(`${API_BASE}/api/admin/leads/pipeline/${stage.id}`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById(`count-${stage.id}`).textContent = data.total;
                    
                    if (data.leads.length === 0) {
                        leadsContainer.innerHTML = '<p style="color: var(--gray-400); font-size: 12px; text-align: center; padding: 20px;">No leads</p>';
                    } else {
                        data.leads.forEach(lead => {
                            const card = createLeadCard(lead, stage.id);
                            leadsContainer.appendChild(card);
                        });
                    }
                }
            } catch (error) {
                console.error(`Error loading ${stage.id}:`, error);
                leadsContainer.innerHTML = '<p style="color: var(--danger); font-size: 12px;">Error loading leads</p>';
            }

            return column;
        }

        function createLeadCard(lead, currentStage) {
            const card = document.createElement('div');
            card.className = 'lead-card';
            card.onclick = () => showLeadDetails(lead);

            const hasFollowUp = lead.follow_up_date && new Date(lead.follow_up_date) <= new Date();

            card.innerHTML = `
                <h3>${lead.clinic_name || 'Unknown Clinic'}</h3>
                <div class="meta">📍 ${lead.location || 'No location'}</div>
                ${lead.clinic_phone ? `<div class="meta">📞 ${lead.clinic_phone}</div>` : ''}
                ${lead.call_count > 0 ? `<div class="meta">📞 ${lead.call_count} call(s)</div>` : ''}
                ${lead.lead_score > 0 ? `<span class="score">Score: ${lead.lead_score}</span>` : ''}
                ${hasFollowUp ? `<div class="follow-up">⚠️ Follow-up needed</div>` : ''}
            `;

            return card;
        }

        function updateStats(stats) {
            document.getElementById('totalLeads').textContent = stats.total || 0;
            
            // Count follow-ups
            let followUpCount = 0;
            stats.stages.forEach(stage => {
                followUpCount += stage.needs_followup || 0;
            });
            document.getElementById('followUpCount').textContent = followUpCount;
        }

        async function showLeadDetails(lead) {
            const modal = document.getElementById('leadModal');
            const details = document.getElementById('leadDetails');

            // Get full lead details with calls
            try {
                const res = await fetch(`${API_BASE}/api/admin/leads/${lead.id}`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();

                if (data.success) {
                    const fullLead = data.lead;
                    renderLeadDetails(fullLead);
                    modal.classList.add('active');
                }
            } catch (error) {
                console.error('Error loading lead details:', error);
                alert('Error loading lead details');
            }
        }

        function renderLeadDetails(lead) {
            const details = document.getElementById('leadDetails');
            
            details.innerHTML = `
                <div class="form-group">
                    <label>Clinic Name</label>
                    <input type="text" value="${lead.clinic_name || ''}" readonly>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" value="${lead.location || ''}" readonly>
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" value="${lead.clinic_phone || 'Not available'}" readonly>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="text" value="${lead.clinic_email || 'Not available'}" readonly>
                </div>

                <div class="form-group">
                    <label>Pipeline Stage</label>
                    <select id="pipelineStage" onchange="updatePipelineStage('${lead.id}')">
                        ${PIPELINE_STAGES.map(s => 
                            `<option value="${s.id}" ${lead.pipeline_stage === s.id ? 'selected' : ''}>${s.name}</option>`
                        ).join('')}
                    </select>
                </div>

                <div class="form-group">
                    <label>Lead Score</label>
                    <input type="number" id="leadScore" value="${lead.lead_score || 0}" min="0" max="100">
                </div>

                <div class="form-group">
                    <label>Follow-Up Date</label>
                    <input type="datetime-local" id="followUpDate" value="${lead.follow_up_date ? new Date(lead.follow_up_date).toISOString().slice(0, 16) : ''}">
                </div>

                <div class="form-group">
                    <label>Next Action</label>
                    <input type="text" id="nextAction" value="${lead.next_action || ''}" placeholder="e.g., Schedule demo, Send proposal">
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="leadNotes" placeholder="Add notes about this lead...">${lead.notes || ''}</textarea>
                </div>

                <div style="margin-top: 20px;">
                    <h3>Call History (${lead.calls ? lead.calls.length : 0})</h3>
                    ${lead.calls && lead.calls.length > 0 ? 
                        lead.calls.map(call => `
                            <div style="background: var(--gray-100); padding: 12px; border-radius: 6px; margin-bottom: 8px;">
                                <div><strong>Status:</strong> ${call.call_status}</div>
                                ${call.call_duration_seconds ? `<div><strong>Duration:</strong> ${Math.round(call.call_duration_seconds / 60)} min</div>` : ''}
                                ${call.call_cost ? `<div><strong>Cost:</strong> $${call.call_cost.toFixed(2)}</div>` : ''}
                                ${call.outcome ? `<div><strong>Outcome:</strong> ${call.outcome}</div>` : ''}
                                ${call.notes ? `<div><strong>Notes:</strong> ${call.notes}</div>` : ''}
                                <div style="font-size: 12px; color: var(--gray-500); margin-top: 4px;">
                                    ${new Date(call.created_at).toLocaleString()}
                                </div>
                            </div>
                        `).join('') :
                        '<p style="color: var(--gray-400);">No calls yet</p>'
                    }
                </div>

                <div style="margin-top: 20px; display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="saveLeadDetails('${lead.id}')">Save Changes</button>
                    ${lead.clinic_phone ? `<button class="btn btn-primary" onclick="initiateCall('${lead.id}')">🤖 Agent Call</button>` : ''}
                    <button class="btn" onclick="closeModal()">Close</button>
                </div>
            `;
        }

        async function saveLeadDetails(leadId) {
            const pipelineStage = document.getElementById('pipelineStage').value;
            const leadScore = parseInt(document.getElementById('leadScore').value) || 0;
            const followUpDate = document.getElementById('followUpDate').value;
            const nextAction = document.getElementById('nextAction').value;
            const notes = document.getElementById('leadNotes').value;

            try {
                const res = await fetch(`${API_BASE}/api/admin/leads/${leadId}/pipeline-stage`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        pipeline_stage: pipelineStage,
                        lead_score: leadScore,
                        follow_up_date: followUpDate || null,
                        next_action: nextAction || null,
                        notes: notes || null
                    })
                });

                const data = await res.json();
                
                if (data.success) {
                    alert('Lead updated successfully!');
                    closeModal();
                    loadPipeline();
                } else {
                    alert('Failed to update: ' + data.message);
                }
            } catch (error) {
                alert('Error updating lead: ' + error.message);
            }
        }

        async function initiateCall(leadId) {
            if (!confirm('Initiate agent call to this clinic?')) return;

            try {
                const res = await fetch(`${API_BASE}/api/admin/leads/${leadId}/call`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });

                const data = await res.json();
                
                if (data.success) {
                    alert(`Call initiated! Remaining calls: ${data.call_usage.calls_remaining}`);
                    loadPipeline();
                } else {
                    alert('Failed to initiate call: ' + data.message);
                }
            } catch (error) {
                alert('Error initiating call: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('leadModal').classList.remove('active');
        }

        // Set active state for current page
        window.addEventListener('DOMContentLoaded', () => {
          const currentPage = window.location.pathname.split('/').pop() || 'index.html';
          document.querySelectorAll('.nav-icon').forEach(icon => {
            icon.classList.remove('active');
            const onclick = icon.getAttribute('onclick');
            if (onclick && onclick.includes(currentPage)) {
              icon.classList.add('active');
            }
          });
          // If no link matches, set pipeline as active (current page)
          if (currentPage === 'pipeline.html') {
            document.querySelectorAll('.nav-icon').forEach(icon => {
              if (icon.textContent.includes('📈')) {
                icon.classList.add('active');
              }
            });
          }
        });

        // Load pipeline on page load
        loadPipeline();

        // Refresh every 30 seconds
        setInterval(loadPipeline, 30000);
    </script>
        </main>
    </div>
</body>
</html>
