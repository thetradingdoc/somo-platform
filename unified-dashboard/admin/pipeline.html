<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somo — Sales pipeline</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/admin-portal.css">
  <script src="/assets/js/config.js"></script>
</head>
<body>
  <aside id="admin-sidebar"></aside>
  <main class="admin-crm-main">
    <div class="admin-crm-header admin-crm-header--with-filters">
      <div class="admin-crm-title">Sales pipeline</div>
      <div class="admin-crm-header-toolbar">
        <div class="admin-crm-pills" id="specialtyPills">
          <span class="admin-crm-pill active" data-specialty="">All</span>
          <span class="admin-crm-pill" data-specialty="dental">Dental</span>
          <span class="admin-crm-pill" data-specialty="medical">Medical</span>
        </div>
        <div class="admin-crm-header-actions">
          <button class="admin-crm-btn-outline" id="btnEnrich">Enrich contacts</button>
          <button class="btn btn-primary" onclick="location.href='/admin/'">Scrape leads</button>
        </div>
      </div>
    </div>

    <div class="admin-crm-card">
      <div class="admin-crm-card-title admin-crm-card-title--split">
        <span>Inbound demos <span id="inboundDemoCount" class="admin-crm-badge admin-crm-badge-muted">—</span></span>
      </div>
      <div id="inboundDemoList"><div class="admin-crm-skeleton" style="height:120px;"></div></div>
    </div>

    <div class="admin-crm-card">
      <div class="admin-crm-card-title admin-crm-card-title--split">
        <span>Call-ready queue <span id="queueCount" class="admin-crm-badge admin-crm-badge-muted">—</span></span>
        <button class="btn btn-primary btn-sm" id="btnCall10">Call next 10</button>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input class="admin-crm-search" type="text" id="queueSearch" placeholder="Search leads...">
      </div>
      <div id="queueList"><div class="admin-crm-skeleton" style="height:200px;"></div></div>
      <div id="queuePagination" style="display:flex;gap:6px;justify-content:center;margin-top:12px;"></div>
    </div>

    <div class="admin-crm-card admin-crm-kanban-scroll">
      <div class="admin-crm-card-title">Pipeline stages</div>
      <div class="admin-crm-kanban" id="kanbanBoard">
        <div class="admin-crm-skeleton" style="height:300px;grid-column:1/-1;"></div>
      </div>
    </div>
  </main>

  <script src="/admin/assets/js/admin-shell.js"></script>
  <script>
    const { apiFetch, esc, init } = AdminShell;
    let currentSpecialty = '';
    let currentPage = 0;
    let searchTimer;

    function isCallableLead(l) {
      if (l.callable === true) return true;
      if (l.callable === false) return false;
      const digits = String(l?.clinic_phone || '').replace(/\D/g, '');
      return digits.length >= 10;
    }

    init('pipeline');

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('#specialtyPills .admin-crm-pill').forEach(p => {
        p.onclick = () => {
          document.querySelectorAll('#specialtyPills .admin-crm-pill').forEach(x => x.classList.remove('active'));
          p.classList.add('active');
          currentSpecialty = p.dataset.specialty;
          currentPage = 0;
          loadQueue();
          loadKanban();
        };
      });
      document.getElementById('queueSearch').oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { currentPage = 0; loadQueue(); }, 300);
      };
      document.getElementById('btnCall10').onclick = callNext10;
      document.getElementById('btnEnrich').onclick = () => { location.href = '/admin/'; };
      loadInboundDemos();
      loadQueue();
      loadKanban();
    });

    async function loadInboundDemos() {
      const el = document.getElementById('inboundDemoList');
      const countEl = document.getElementById('inboundDemoCount');
      if (!el) return;
      try {
        const r = await apiFetch('/api/admin/leads?source=landing_demo&limit=20');
        const leads = r.leads || [];
        if (countEl) countEl.textContent = leads.length;
        if (!leads.length) {
          el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px;">No landing-page demo requests yet.</p>';
          return;
        }
        el.innerHTML = leads.map((l) => `
          <div class="admin-crm-row" onclick="location.href='/admin/lead.html?id=${esc(l.id)}'">
            <div style="flex:1;min-width:0;">
              <div class="admin-crm-row-name" style="font-weight:600;">${esc(l.clinic_name)}</div>
              <div style="font-size:12px;color:var(--muted);">${esc(l.clinic_email || l.clinic_phone || '')}</div>
            </div>
            <span class="admin-crm-badge admin-crm-badge-info">Inbound</span>
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = `<p style="color:var(--muted);">${esc(e.message)}</p>`;
      }
    }

    async function loadQueue(page = 0) {
      currentPage = page;
      const search = document.getElementById('queueSearch').value.trim();
      const params = new URLSearchParams({ contact_status: 'verified', callable_only: '1', limit: 15, offset: page * 15 });
      if (currentSpecialty) params.set('specialty', currentSpecialty);
      if (search) params.set('search', search);

      try {
        const r = await apiFetch(`/api/admin/scrape/leads?${params}`);
        const verified = (r.leads || []).filter(isCallableLead);
        document.getElementById('queueCount').textContent = verified.length ? (r.total || verified.length) : 0;
        const container = document.getElementById('queueList');
        if (!verified.length) {
          container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px;">No call-ready leads with verified phone numbers. Run scrape from control board.</p>';
          document.getElementById('queuePagination').innerHTML = '';
          return;
        }
        container.innerHTML = verified.map((l) => renderRow(l)).join('');
        const pages = Math.ceil((r.total || 0) / 15);
        const pag = document.getElementById('queuePagination');
        pag.innerHTML = pages <= 1 ? '' : Array.from({ length: Math.min(pages, 7) }, (_, i) =>
          `<button class="admin-crm-btn-outline" style="padding:5px 10px;${i === page ? 'background:var(--admin-cta);' : ''}" onclick="loadQueue(${i})">${i + 1}</button>`
        ).join('');
      } catch (e) {
        document.getElementById('queueList').innerHTML = `<p style="color:var(--muted);">Failed: ${esc(e.message)}</p>`;
      }
    }

    function renderRow(l) {
      const scoreCls = l.lead_score >= 70 ? ' high' : '';
      const canCall = isCallableLead(l);
      return `
        <div class="admin-crm-row" onclick="location.href='/admin/lead.html?id=${l.id}'">
          <div style="flex:1;min-width:0;">
            <div class="admin-crm-row-name" style="font-weight:600;">${esc(l.clinic_name)}</div>
            <div style="font-size:12px;color:var(--muted);">${esc(l.location)} · ${esc(l.specialty || '')}${(l.language_labels && l.language_labels.length) ? ` · ${esc(l.language_labels.join(', '))}` : ''}</div>
          </div>
          <div class="admin-crm-row-actions">
            <span class="admin-crm-score${scoreCls}">${l.lead_score || 0}</span>
            ${canCall
              ? `<button class="btn btn-primary btn-sm admin-crm-btn-sm" onclick="event.stopPropagation();callLead(${l.id},'${esc(l.clinic_name)}')">Call</button>`
              : `<span class="admin-crm-badge admin-crm-badge-muted" title="No verified phone">No phone</span>`}
          </div>
        </div>`;
    }

    async function loadKanban() {
      const params = currentSpecialty ? `?specialty=${currentSpecialty}` : '';
      try {
        const r = await apiFetch(`/api/admin/scrape/leads/pipeline${params}`);
        const stages = [
          { key: 'new', label: 'New' },
          { key: 'contacted', label: 'Contacted' },
          { key: 'demo', label: 'Demo' },
          { key: 'won', label: 'Won' },
          { key: 'lost', label: 'Lost' },
        ];
        document.getElementById('kanbanBoard').innerHTML = stages.map(s => {
          const cards = ((r.cards || {})[s.key] || []).filter(isCallableLead);
          return `
            <div class="admin-crm-kanban-col">
              <div style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;">
                ${s.label}<span class="admin-crm-badge admin-crm-badge-muted">${(r.counts || {})[s.key] || 0}</span>
              </div>
              ${cards.map(l => `
                <div class="admin-crm-kanban-card" onclick="location.href='/admin/lead.html?id=${l.id}'">
                  <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(l.clinic_name)}</div>
                  <div style="font-size:11px;color:var(--muted);">${esc(l.location || '')}</div>
                </div>
              `).join('')}
              ${!cards.length ? '<div style="font-size:12px;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--border);border-radius:8px;">empty</div>' : ''}
            </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('kanbanBoard').innerHTML = `<p style="color:var(--muted);">${esc(e.message)}</p>`;
      }
    }

    async function callLead(id, name) {
      if (!confirm(`Call ${name}?`)) return;
      try {
        const r = await apiFetch(`/api/admin/leads/${id}/call`, { method: 'POST' });
        alert(r.message || 'Call initiated');
        loadKanban();
      } catch (e) { alert(e.message); }
    }

    async function callNext10() {
      if (!confirm('Call top 10 call-ready leads?')) return;
      try {
        const r = await apiFetch('/api/admin/scrape/leads/call-ready?limit=10');
        const callable = (r.leads || []).filter(isCallableLead);
        for (const l of callable) {
          await apiFetch(`/api/admin/leads/${l.id}/call`, { method: 'POST' });
          await new Promise(res => setTimeout(res, 500));
        }
        alert(`Initiated ${callable.length} calls`);
        loadQueue();
        loadKanban();
      } catch (e) { alert(e.message); }
    }
  </script>
</body>
</html>
