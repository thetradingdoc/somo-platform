<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somo — Tenants</title>
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/admin-portal.css">
  <script src="/assets/js/config.js"></script>
</head>
<body>
  <aside id="admin-sidebar"></aside>
  <main class="admin-crm-main">
    <div class="admin-crm-header">
      <div>
        <div class="admin-crm-title">Tenants</div>
        <div class="admin-crm-subtitle">Clinic health, billing, and credits</div>
      </div>
      <input class="admin-crm-search" type="text" id="tenantSearch" placeholder="Search tenants...">
    </div>

    <div class="admin-crm-metrics admin-crm-metrics--3">
      <div class="admin-crm-metric"><div class="admin-crm-metric-label">Total tenants</div><div class="admin-crm-metric-value" id="mTotal">—</div></div>
      <div class="admin-crm-metric"><div class="admin-crm-metric-label">Critical alerts</div><div class="admin-crm-metric-value admin-crm-metric-danger" id="mCritical">—</div></div>
      <div class="admin-crm-metric"><div class="admin-crm-metric-label">Clinics with alerts</div><div class="admin-crm-metric-value" id="mWarning">—</div></div>
    </div>

    <div class="admin-crm-two-col">
      <div class="admin-crm-card">
        <div class="admin-crm-card-title">Alerts <span style="font-weight:400;font-size:11px;color:var(--muted);">one row per clinic</span></div>
        <div id="alertsList"><div class="admin-crm-skeleton" style="height:120px;"></div></div>
      </div>
      <div class="admin-crm-card" id="detailPanel">
        <div class="admin-crm-card-title">Tenant detail</div>
        <p style="color:var(--muted);font-size:13px;">Select a tenant from the table to view usage and allocate credits.</p>
      </div>
    </div>

    <div class="admin-crm-card">
      <div class="admin-crm-card-title">All tenants</div>
      <div id="tenantTable"><div class="admin-crm-skeleton" style="height:240px;"></div></div>
    </div>
  </main>

  <script src="/admin/assets/js/admin-shell.js"></script>
  <script>
    const { apiFetch, esc, init, showToast, confirmAction } = AdminShell;
    let allTenants = [];

    init('tenants');

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tenantSearch').oninput = () => renderTable();
      loadAll();
    });

    async function loadAll() {
      await Promise.all([loadAlerts(), loadTenants()]);
    }

    function renderGroupedAlertRow(g, expanded) {
      const sev = g.severity || 'warning';
      const reasons = g.reasons || (g.reason ? [g.reason] : []);
      const id = `alert-${g.clinic_id}`;
      return `
        <div class="admin-crm-row" style="flex-direction:column;align-items:stretch;cursor:pointer;" onclick="toggleAlertDetail('${id}')">
          <div style="display:flex;justify-content:space-between;align-items:center;width:100%;" onclick="event.stopPropagation();showDetail('${g.clinic_id}')">
            <div>
              <div style="font-weight:600;">${esc(g.company_name)}</div>
              <div style="font-size:12px;color:var(--muted);">${reasons.length} issue${reasons.length === 1 ? '' : 's'}</div>
            </div>
            <span class="admin-crm-badge admin-crm-badge-${sev === 'critical' ? 'danger' : sev === 'info' ? 'info' : 'warning'}">${esc(sev)}</span>
          </div>
          <div id="${id}" class="${expanded ? '' : 'hidden'}" style="margin-top:8px;padding-left:8px;font-size:12px;color:var(--muted);">
            ${reasons.map((r) => `<div style="margin-bottom:4px;">• ${esc(r)}</div>`).join('')}
          </div>
        </div>`;
    }

    window.toggleAlertDetail = (id) => {
      document.getElementById(id)?.classList.toggle('hidden');
    };

    async function loadAlerts() {
      try {
        const r = await apiFetch('/api/admin/tenants/alerts');
        const grouped = r.grouped_alerts || [];
        const flat = r.alerts || [];
        const rows = grouped.length ? grouped : flat.map((a) => ({
          clinic_id: a.clinic_id,
          company_name: a.company_name,
          severity: a.severity,
          reasons: [a.reason || a.minutes_remaining + ' min remaining'],
        }));

        const critical = rows.filter((a) => a.severity === 'critical').length;
        document.getElementById('mCritical').textContent = critical;
        document.getElementById('mWarning').textContent = r.clinic_count ?? rows.length;

        const el = document.getElementById('alertsList');
        if (!rows.length) {
          el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px;">All tenants healthy</p>';
          return;
        }
        el.innerHTML = rows.map((g) => renderGroupedAlertRow(g, false)).join('');
      } catch (e) {
        document.getElementById('alertsList').innerHTML = '<p style="color:var(--muted);">Could not load alerts</p>';
      }
    }

    async function loadTenants() {
      try {
        const r = await apiFetch('/api/admin/tenants');
        allTenants = r.tenants || [];
        document.getElementById('mTotal').textContent = r.summary?.total_tenants || allTenants.length;
        renderTable();

        const id = new URLSearchParams(location.search).get('id');
        if (id) showDetail(id);
      } catch (e) {
        document.getElementById('tenantTable').innerHTML = '<p style="color:var(--muted);">' + esc(e.message) + '</p>';
      }
    }

    function renderTable() {
      const q = document.getElementById('tenantSearch').value.trim().toLowerCase();
      const filtered = allTenants.filter((t) => !q || (t.name || '').toLowerCase().includes(q));
      const el = document.getElementById('tenantTable');
      if (!filtered.length) {
        el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px;">No tenants found</p>';
        return;
      }
      el.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead>
            <tr style="text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;">
              <th style="padding:8px 0;">Name</th>
              <th>Minutes</th>
              <th>Subscription</th>
              <th>Trial</th>
              <th>Agent</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map((t) => `
              <tr style="border-top:1px solid var(--border);cursor:pointer;" onclick="showDetail('${t.clinic_id}')">
                <td style="padding:10px 0;font-weight:600;">${esc(t.name)}</td>
                <td>${t.minutes_remaining ?? t.credits?.balance_minutes ?? '—'}</td>
                <td>${esc(t.subscription_status || '—')}</td>
                <td>${esc(t.trial_status || '—')}</td>
                <td>${t.agent?.has_agent ? '<span class="admin-crm-badge admin-crm-badge-success">yes</span>' : '<span class="admin-crm-badge admin-crm-badge-muted">no</span>'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    async function showDetail(clinicId) {
      const panel = document.getElementById('detailPanel');
      panel.innerHTML = '<div class="admin-crm-card-title">Loading...</div>';
      try {
        const r = await apiFetch(`/api/admin/tenants/${clinicId}`);
        const t = r.tenant;
        const credits = r.credits || {};
        panel.innerHTML = `
          <div class="admin-crm-card-title">${esc(t.name)}</div>
          <div style="font-size:13px;margin-bottom:12px;color:var(--muted);">
            ${esc(t.email || '')} · ${t.minutes_remaining ?? credits.balance_minutes ?? 0} min remaining
          </div>
          <div style="font-size:13px;margin-bottom:16px;">
            <div>Subscription: <strong>${esc(t.subscription_status || '—')}</strong></div>
            <div>Trial: <strong>${esc(t.trial_status || '—')}</strong></div>
            <div>Calls (30d): <strong>${r.usage?.by_period?.last_30d?.calls ?? '—'}</strong></div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
            <input type="number" id="creditAmount" min="1" value="60" style="width:80px;padding:8px;border:1px solid var(--border);border-radius:8px;">
            <button class="btn btn-primary btn-sm" onclick="allocateCredits('${clinicId}')">Allocate free minutes</button>
          </div>
          <a href="/business/today.html" style="font-size:12px;color:var(--accent-green);">Open provider portal →</a>
        `;
      } catch (e) {
        panel.innerHTML = `<p style="color:var(--muted);">${esc(e.message)}</p>`;
      }
    }
    window.showDetail = showDetail;

    async function allocateCredits(clinicId) {
      const credits = parseInt(document.getElementById('creditAmount').value, 10);
      if (!credits || credits < 1) return showToast('Enter valid minutes', 'warning');
      try {
        await apiFetch(`/api/admin/tenants/${clinicId}/credits`, {
          method: 'POST',
          body: JSON.stringify({ credits, type: 'free' }),
        });
        showToast('Credits allocated', 'success');
        loadAll();
        showDetail(clinicId);
      } catch (e) { showToast(e.message, 'error'); }
    }
    window.allocateCredits = allocateCredits;
  </script>
</body>
</html>
