<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/somo-tokens.css" />
  <link rel="stylesheet" href="../assets/css/signup-somo.css" />
  <link rel="stylesheet" href="../assets/css/auth-somo.css" />
  <link rel="stylesheet" href="../assets/css/admin-portal.css" />
  <link rel="stylesheet" href="assets/css/admin-ai-assistant.css" />
  <script src="../assets/js/config.js"></script>
  <title>Clients - Somo Admin</title>
</head>
<body class="admin-portal-body">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-icon" onclick="window.location.href='index.html'" title="Dashboard">📊</div>
            <div class="sidebar-icon" onclick="window.location.href='index.html?tab=tenants'" title="Tenants">🏥</div>
            <div class="sidebar-icon" onclick="window.location.href='index.html?tab=leads'" title="Leads">👥</div>
            <div class="sidebar-icon" onclick="window.location.href='pipeline.html'" title="Pipeline">📈</div>
            <div class="sidebar-icon" onclick="window.location.href='workflows.html'" title="Workflows">⚡</div>
            <div class="sidebar-icon" onclick="window.location.href='index.html?tab=clients'" title="Clients">💼</div>
        </aside>
        <main class="main-content">
            <div style="margin-bottom: 16px;">
              <a href="index.html" style="color: var(--muted); text-decoration: none; font-size: 13px;">Dashboard</a>
              <span style="color: var(--muted); margin: 0 8px;">/</span>
              <span style="color: var(--text); font-size: 13px;">Clients</span>
            </div>
            <div class="dashboard-header">
                <h1>Clients & Credits Management</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Clients</h3>
                    <div class="value" id="totalClients">0</div>
                </div>
                <div class="stat-card">
                    <h3>Active Credits</h3>
                    <div class="value" id="totalCredits">0</div>
                </div>
                <div class="stat-card">
                    <h3>Low Credits (< 50)</h3>
                    <div class="value" id="lowCredits">0</div>
                </div>
                <div class="stat-card">
                    <h3>Incomplete Signups</h3>
                    <div class="value" id="incompleteSignups">0</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Type</th>
                            <th>Credits</th>
                            <th>Free Used</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTable">
                        <tr><td colspan="7" style="text-align: center; padding: 40px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal for allocating credits -->
    <div class="modal" id="creditModal">
        <div class="modal-content">
            <h2>Allocate Credits</h2>
            <div class="form-group">
                <label>Customer</label>
                <input type="text" id="modalCustomerName" readonly>
            </div>
            <div class="form-group">
                <label>Credits to Allocate</label>
                <input type="number" id="modalCredits" min="1" value="100">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="allocateCredits()">Allocate</button>
                <button class="btn" onclick="closeModal()" style="background: var(--panel-dark); color: var(--text);">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Redirect to main dashboard clients tab if accessed directly
        // (clients.html is identical to the clients tab in index.html)
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('standalone')) {
          // Check if we should redirect to tab version
          // For now, keep standalone accessible but add note
          console.log('Note: Clients page is also available as a tab in the main dashboard at /admin?tab=clients');
        }

        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:4000' : '';
        let currentCustomerId = null;

        async function loadClients() {
            try {
                // Fetch all customers
                const customersRes = await fetch(`${API_BASE}/api/admin/customers`);
                if (!customersRes.ok) throw new Error('Failed to load customers');
                const customers = await customersRes.json();

                // Fetch incomplete signups
                const incompleteRes = await fetch(`${API_BASE}/api/admin/incomplete-signups`);
                const incomplete = incompleteRes.ok ? await incompleteRes.json() : { incomplete_signups: [] };

                // Update stats
                document.getElementById('totalClients').textContent = customers.customers?.length || 0;
                document.getElementById('incompleteSignups').textContent = incomplete.incomplete_signups?.length || 0;

                // Load credit balances for each customer
                const clientsWithCredits = await Promise.all(
                    (customers.customers || []).map(async (customer) => {
                        try {
                            const creditsRes = await fetch(`${API_BASE}/api/usage-monitor/credits?customer_id=${customer.id}`);
                            if (creditsRes.ok) {
                                const creditsData = await creditsRes.json();
                                return { ...customer, credits: creditsData.credits || { balance: 0 } };
                            }
                        } catch (e) {
                            console.error(`Failed to load credits for ${customer.id}:`, e);
                        }
                        return { ...customer, credits: { balance: 0 } };
                    })
                );

                // Calculate stats
                const totalCredits = clientsWithCredits.reduce((sum, c) => sum + (c.credits.balance || 0), 0);
                const lowCredits = clientsWithCredits.filter(c => (c.credits.balance || 0) < 50).length;

                document.getElementById('totalCredits').textContent = totalCredits;
                document.getElementById('lowCredits').textContent = lowCredits;

                // Render table
                const tbody = document.getElementById('clientsTable');
                if (clientsWithCredits.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No clients found</td></tr>';
                    return;
                }

                tbody.innerHTML = clientsWithCredits.map(customer => {
                    const credits = customer.credits || {};
                    const balance = credits.balance || 0;
                    const freeUsed = credits.free_used || 0;
                    const freeAllocated = credits.free_allocated || 0;
                    const statusBadge = balance < 50 
                        ? '<span class="badge badge-danger">Low</span>'
                        : balance < 100
                        ? '<span class="badge badge-warning">Medium</span>'
                        : '<span class="badge badge-success">Good</span>';

                    return `
                        <tr>
                            <td>${customer.name || customer.company_name || 'N/A'}</td>
                            <td>${customer.email}</td>
                            <td>${customer.customer_type || 'saas'}</td>
                            <td><strong>${balance}</strong> min</td>
                            <td>${freeUsed}/${freeAllocated}</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="btn btn-primary" onclick="openCreditModal('${customer.id}', '${(customer.name || customer.company_name || '').replace(/'/g, "\\'")}')">
                                    Allocate Credits
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading clients:', error);
                document.getElementById('clientsTable').innerHTML = 
                    '<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--accent-red);">Error loading clients</td></tr>';
            }
        }

        function openCreditModal(customerId, customerName) {
            currentCustomerId = customerId;
            document.getElementById('modalCustomerName').value = customerName;
            document.getElementById('modalCredits').value = 100;
            document.getElementById('creditModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('creditModal').classList.remove('active');
            currentCustomerId = null;
        }

        async function allocateCredits() {
            if (!currentCustomerId) return;

            const credits = parseInt(document.getElementById('modalCredits').value);
            if (!credits || credits < 1) {
                alert('Please enter a valid number of credits');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/customers/${currentCustomerId}/credits`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credits })
                });

                if (!res.ok) throw new Error('Failed to allocate credits');
                
                alert(`Successfully allocated ${credits} credits!`);
                closeModal();
                loadClients();
            } catch (error) {
                console.error('Error allocating credits:', error);
                alert('Failed to allocate credits: ' + error.message);
            }
        }

        // Set active state for current page
        window.addEventListener('DOMContentLoaded', () => {
          const currentPage = window.location.pathname.split('/').pop() || 'index.html';
          document.querySelectorAll('.sidebar-icon').forEach(icon => {
            icon.classList.remove('active');
            const onclick = icon.getAttribute('onclick');
            if (onclick && onclick.includes(currentPage)) {
              icon.classList.add('active');
            }
          });
          // If no link matches, set clients as active (current page)
          if (currentPage === 'clients.html') {
            document.querySelectorAll('.sidebar-icon').forEach(icon => {
              if (icon.textContent.includes('💼')) {
                icon.classList.add('active');
              }
            });
          }
        });

        // Load on page load
        loadClients();
        setInterval(loadClients, 60000); // Refresh every minute
    </script>
</body>
</html>
