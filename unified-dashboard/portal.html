<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Somo — Choose portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/somo-tokens.css">
  <link rel="stylesheet" href="/assets/css/somo-front-desk-components.css">
  <link rel="stylesheet" href="/assets/css/auth-somo.css">
  <style>
    .portal-grid { display: grid; gap: 12px; margin-top: 16px; }
    a.portal-choice {
      display: block;
      text-decoration: none;
      border: 1px solid var(--sfd-border, #e8e4dc);
      border-radius: 14px;
      padding: 16px;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    a.portal-choice:hover { border-color: var(--somo-green, #16a637); box-shadow: 0 8px 20px rgba(22, 166, 55, 0.12); }
    .portal-choice-title { font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .portal-choice-desc { margin-top: 6px; color: var(--sfd-muted, #64748b); font-size: 14px; line-height: 1.5; }
    .portal-secondary-link { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--somo-green, #16a637); }
  </style>
</head>
<body class="signup-wizard-body">
  <div class="login-shell">
    <div class="login-main sfd-device-card">
      <a href="/" class="signup-logo-link" aria-label="Somo home">
        <img class="signup-logo-img" src="/assets/brand/somo-logo.png" alt="Somo" width="199" height="68" />
      </a>
      <p class="signup-eyebrow">Welcome</p>
      <h1 class="signup-title">Sign in or create an account</h1>
      <p class="signup-sub">Kelly front desk for licensed providers and small businesses.</p>

      <div class="portal-grid">
        <a class="portal-choice sfd-card" href="/login">
          <div class="portal-choice-title">
            <span class="sfd-nameplate sfd-nameplate--live sfd-nameplate--sm"><span class="sfd-nameplate__led"></span>Provider</span>
            <span>Sign in</span>
          </div>
          <div class="portal-choice-desc">Licensed providers. Email + password.</div>
        </a>

        <a class="portal-choice sfd-card" href="/signup">
          <div class="portal-choice-title">
            <span class="sfd-nameplate sfd-nameplate--connected sfd-nameplate--sm"><span class="sfd-nameplate__led"></span>New practice</span>
            <span>Create account</span>
          </div>
          <div class="portal-choice-desc">Start your Kelly trial — voice agent, scheduling, and revenue tools.</div>
          <div class="portal-choice-desc">
            <span class="portal-secondary-link">Start free trial →</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
