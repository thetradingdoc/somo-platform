<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Portal - Somo</title>
  <link rel="stylesheet" href="./assets/css/global.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #16a637 0%, #16a637 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 28px;
    }
    .logo {
      text-align: center;
      margin-bottom: 16px;
    }
    .logo .brand {
      font-size: 44px;
      font-weight: 800;
      color: #16a637;
      letter-spacing: -2px;
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1;
    }
    .logo .sub {
      margin-top: 8px;
      color: var(--gray-600);
      font-size: 13px;
    }
    h1 {
      margin: 16px 0 6px 0;
      font-size: 22px;
      color: var(--gray-900);
      text-align: center;
    }
    p {
      margin: 0 0 18px 0;
      color: var(--gray-600);
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }
    a.choice {
      display: block;
      text-decoration: none;
      border: 2px solid var(--gray-200);
      border-radius: 14px;
      padding: 16px;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      background: #ffffff;
    }
    a.choice:hover {
      transform: translateY(-1px);
      border-color: #16a637;
      box-shadow: 0 12px 24px rgba(30, 64, 175, 0.16);
    }
    .choice-title {
      font-weight: 800;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .choice-desc {
      margin-top: 6px;
      color: var(--gray-600);
      font-size: 13px;
      line-height: 1.5;
    }
    .pill {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(30, 64, 175, 0.08);
      color: #16a637;
      font-weight: 700;
    }
    .secondary-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #16a637;
      text-decoration: none;
    }
    .secondary-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="brand">Somo</div>
      <div class="sub">Healthcare at your home</div>
    </div>
    <h1>Sign in or create an account</h1>
    <p>Choose your portal to continue.</p>

    <div class="grid">
      <a class="choice" href="./patients/patient-login.html">
        <div class="choice-title">
          <span class="pill">Patient Portal</span>
          <span>Sign in / Create account</span>
        </div>
        <div class="choice-desc">Email → secure 6-digit code → appointments, payments, records.</div>
      </a>

      <a class="choice" href="./login.html">
        <div class="choice-title">
          <span class="pill">Provider Portal</span>
          <span>Sign in</span>
        </div>
        <div class="choice-desc">Licensed providers. Email + password.</div>
        <div class="choice-desc">
          <a class="secondary-link" href="./signup.html">Create provider account →</a>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
