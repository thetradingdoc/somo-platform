<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="../manifest.webmanifest">
    <title>My Profile - Consult Patient Portal</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <script src="../assets/js/config.js"></script>
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            background: #f7fafc;
        }

        .sidebar {
            width: 260px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--gray-200);
        }

        .sidebar-logo {
            font-size: 32px;
            line-height: 1;
            letter-spacing: -2px;
            color: #2d3748;
            margin-bottom: 4px;
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 700;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .sidebar-nav {
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--gray-700);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--gray-50);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }
        .nav-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--gray-200);
            position: absolute;
            bottom: 0;
            width: 260px;
            background: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .user-details { flex: 1; }
        .user-name { font-size: 14px; font-weight: 600; color: var(--gray-900); }
        .user-role { font-size: 12px; color: var(--gray-500); }
        .logout-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--gray-200);
            background: #ffffff;
            color: var(--gray-600);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            border-color: #93c5fd;
            color: #1e40af;
            background: #eff6ff;
        }
        .logout-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
        }

        .main-content {
            margin-left: 260px;
            padding: 32px;
            flex: 1;
        }

        .page-header {
            margin-bottom: 32px;
            margin-top: 24px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--gray-600);
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1001;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle { display: flex; }
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .mobile-menu-overlay.active { display: block; }
            .main-content { margin-left: 0; padding: 16px; padding-top: 80px; }
        }

        .container {
            max-width: 700px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: var(--shadow-md);
        }

        .profile-section {
            margin-bottom: 32px;
        }

        .profile-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--gray-900);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--gray-900);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .form-input:disabled {
            background: var(--gray-100);
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray-600);
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
    <div class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">Consʌlt</div>
                <div class="sidebar-subtitle">Patient Portal</div>
            </div>
            <nav class="sidebar-nav">
                <a href="patient-dashboard.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg></span>
                    <span>Dashboard</span>
                </a>
                <!-- Benefits/Claims removed from telehealth MVP -->
                <a href="wallet.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M16 15h3"/></svg></span>
                    <span>Wallet</span>
                </a>
                <a href="appointments.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></span>
                    <span>Appointments</span>
                </a>
                <a href="my-records.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg></span>
                    <span>My Records</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">P</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Patient</div>
                        <div class="user-role">Patient Account</div>
                    </div>
                    <button class="logout-btn" onclick="logout()" title="Logout" aria-label="Logout"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"></path></svg></button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">My Profile</h1>
                <p class="page-subtitle">Your account and contact information</p>
            </div>
            <div id="messageContainer"></div>
            <div class="profile-card" id="profileCard">
                <div class="loading">Loading profile...</div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = window.API_BASE || 'http://localhost:4000';
        let sessionId = localStorage.getItem('patient_session_id');

        if (!sessionId) {
            window.location.href = 'patient-login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
        });

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE}/api/patient/intake`, {
                    headers: { 'x-session-id': sessionId }
                });

                const data = await response.json();

                if (data.success) {
                    displayProfile(data.intake || {});
                } else {
                    if (data.error && data.error.includes('session')) {
                        localStorage.removeItem('patient_session_id');
                        localStorage.removeItem('patient_phone');
                        window.location.href = 'patient-login.html';
                    } else {
                        document.getElementById('profileCard').innerHTML = `
                            <div class="message message-error">Failed to load profile: ${data.error || 'Unknown error'}</div>
                        `;
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('profileCard').innerHTML = `
                    <div class="message message-error">Network error. Please try again.</div>
                `;
            }
        }

        function displayProfile(intake) {
            const card = document.getElementById('profileCard');
            const fullName = [intake.first_name, intake.last_name].filter(Boolean).join(' ') || intake.name || '';
            const address = intake.address || {};
            let cached = null;
            try {
                cached = JSON.parse(localStorage.getItem('patient_identity_cache') || '{}');
                if (cached && cached.session_id !== sessionId) cached = null;
            } catch (_) { cached = null; }
            const postal = (address.postal_code || intake.postal_code || cached?.postal_code || '').toString();
            const line1 = (address.line1 || intake.address_line1 || cached?.address_line1 || '').toString();
            const canConnectRecords = (() => {
                const hasName = !!fullName.trim();
                const hasDob = !!(intake.dob || '');
                const hasContact = !!((intake.email || '').trim() || (intake.phone || '').trim());
                const hasPostal = !!postal.trim();
                return hasName && hasDob && hasContact && hasPostal;
            })();
            card.innerHTML = `
                <div class="profile-section">
                    <h2 class="section-title">Personal Information</h2>
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" value="${fullName}" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-input" value="${intake.dob || ''}" disabled>
                    </div>
                </div>

                <div class="profile-section">
                    <h2 class="section-title">Contact Information</h2>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-input" value="${intake.phone || ''}" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" value="${intake.email || ''}" disabled>
                    </div>
                </div>

                <div class="profile-section">
                    <h2 class="section-title">Address</h2>
                    <div class="form-group">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-input" value="${address.country || ''}" disabled>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">City</label>
                            <input type="text" class="form-input" value="${address.city || ''}" disabled>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address line 1</label>
                        <input type="text" class="form-input" value="${line1.replace(/"/g, '&quot;')}" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Postal / ZIP code</label>
                        <input type="text" class="form-input" value="${postal.replace(/"/g, '&quot;')}" disabled>
                        <p style="font-size:12px;color:#6b7280;margin-top:4px;">
                          We use your date of birth and address only to safely match your records.
                        </p>
                    </div>
                </div>

                <div class="profile-section">
                    <h2 class="section-title">Insurance</h2>
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                        <div style="color: var(--gray-700); font-size: 14px; line-height: 1.35;">
                            Connect your insurance provider to streamline coverage and claims.
                        </div>
                        <span style="display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800;font-size:12px;">Coming soon</span>
                    </div>
                </div>

                <div class="profile-section">
                    <h2 class="section-title">Medical records</h2>
                    <div style="color: var(--gray-700); font-size: 14px; line-height: 1.35;">
                        Connect your records securely. You’ll always confirm your identity before anything is imported.
                    </div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
                        <button class="btn btn-primary" type="button" id="connectRecordsBtn" ${canConnectRecords ? '' : 'disabled'}>Connect my records</button>
                        <a class="btn btn-secondary" href="onboarding.html" style="text-decoration:none;">Update my details</a>
                    </div>
                    ${canConnectRecords ? '' : `<div style="margin-top:10px;color:#6b7280;font-size:13px;">To connect records, please add your postal/ZIP code in onboarding.</div>`}
                </div>

                <div class="profile-section">
                    <h2 class="section-title">Help & Support</h2>
                    <div style="color: var(--gray-700); font-size: 14px; line-height: 1.35;">
                        Need help with appointments, payments, or records?
                    </div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
                        <button class="btn btn-secondary" type="button" onclick="window.showHelp && window.showHelp()">Open help</button>
                        <a class="btn btn-primary" href="onboarding.html" style="text-decoration:none;">Update my info</a>
                    </div>
                </div>
            `;

            // Wire connect records (frontend-only confirmation)
            try {
                const btn = document.getElementById('connectRecordsBtn');
                if (btn) {
                    btn.addEventListener('click', () => {
                        const identity = {
                            session_id: sessionId,
                            first_name: intake.first_name || (fullName.split(' ')[0] || ''),
                            last_name: intake.last_name || (fullName.split(' ').slice(1).join(' ') || ''),
                            dob: intake.dob || '',
                            phone: intake.phone || '',
                            email: intake.email || '',
                            country: address.country || intake.country || '',
                            city: address.city || intake.city || '',
                            address_line1: line1 || '',
                            postal_code: postal || ''
                        };
                        try { sessionStorage.setItem('connect_records_identity', JSON.stringify(identity)); } catch (_) {}
                        window.location.href = 'connect-records.html';
                    });
                }
            } catch (_) {}
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message message-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.mobile-menu-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('patient_session_id');
            localStorage.removeItem('patient_phone');
            window.location.href = 'patient-login.html';
        }
    </script>
    <script type="module">
        import { mountBottomTabs, showHelp } from '../assets/js/patient-shell.js';
        mountBottomTabs();
        window.showHelp = showHelp;

        try {
            const userInfo = document.querySelector('.sidebar-footer .user-info');
            if (userInfo) {
                userInfo.style.cursor = 'pointer';
                userInfo.addEventListener('click', (e) => {
                    if (e.target && e.target.closest && e.target.closest('.logout-btn')) return;
                    window.location.href = 'profile.html';
                });
            }
        } catch (_) {}
    </script>
</body>

</html>
