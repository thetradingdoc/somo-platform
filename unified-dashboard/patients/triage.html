<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <title>Book a Visit - Consʌlt Patient Portal</title>
  <link rel="stylesheet" href="../assets/css/global.css" />
  <script src="../assets/js/config.js" defer></script>
  <style>
    body { background:#f7fafc; min-height:100vh; }
    .layout { display:flex; min-height:100vh; }
    .sidebar { width:260px; background:#fff; box-shadow:2px 0 10px rgba(0,0,0,0.05); position:fixed; height:100vh; overflow:auto; }
    .main { margin-left:260px; padding:32px; flex:1; max-width:980px; }
    .sidebar-header { padding:24px; border-bottom:1px solid var(--gray-200); }
    .sidebar-logo { font-size:32px; line-height:1; letter-spacing:-2px; font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:800; color:#2d3748; }
    .sidebar-subtitle { font-size:12px; color:var(--gray-500); margin-top:4px; }
    .sidebar-nav { padding:16px; }
    .nav-item { display:flex; gap:12px; align-items:center; padding:12px 16px; border-radius:8px; color:var(--gray-700); text-decoration:none; margin-bottom:4px; }
    .nav-item:hover { background:var(--gray-50); color:#1e40af; }
    .nav-item.active { background:#1e40af; color:#fff; }
    .sidebar-footer { padding:16px; border-top:1px solid var(--gray-200); position:absolute; bottom:0; width:260px; background:#fff; }
    .user-info { display:flex; align-items:center; gap:12px; cursor:pointer; }
    .user-avatar { width:40px; height:40px; border-radius:999px; background:#1e40af; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
    .user-details { flex:1; min-width:0; }
    .user-name { font-size:14px; font-weight:700; color:var(--gray-900); }
    .user-role { font-size:12px; color:var(--gray-500); }
    .logout-btn { background:none; border:none; cursor:pointer; font-size:20px; padding:4px; border-radius:6px; }
    .card { background:#fff; border-radius:12px; padding:18px; box-shadow:var(--shadow-md); }
    .title { font-size:26px; font-weight:900; margin:0 0 6px 0; }
    .sub { color:var(--gray-600); font-size:14px; margin:0 0 14px 0; }
    .chat { border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; }
    .msgs { height:460px; overflow:auto; padding:14px; background:#f8fafc; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:80%; padding:10px 12px; border-radius:14px; font-size:14px; line-height:1.35; }
    .msg.user { background:#1e40af; color:#fff; align-self:flex-end; border-bottom-right-radius:6px; }
    .msg.assistant { background:#fff; color:#111827; align-self:flex-start; border:1px solid #e5e7eb; border-bottom-left-radius:6px; }
    .composer { display:flex; gap:10px; padding:12px; background:#fff; border-top:1px solid var(--gray-200); }
    .input { flex:1; border:2px solid var(--gray-200); border-radius:10px; padding:10px 12px; font-size:14px; }
    .btn { border:none; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer; min-height:44px; }
    .btn.primary { background:#1e40af; color:#fff; }
    .btn.secondary { background:#e5e7eb; color:#374151; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; padding:12px; border-top:1px solid var(--gray-200); background:#fff; }
    .chip { border:1px solid #e5e7eb; background:#fff; border-radius:999px; padding:8px 10px; font-weight:800; font-size:13px; cursor:pointer; }
    .chip:hover { background:#f3f4f6; }
    /* Mobile Menu Toggle (match patient-dashboard.html) */
    .mobile-menu-toggle {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1001;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      width: 48px;
      height: 48px;
      align-items: center;
      justify-content: center;
    }
    .mobile-menu-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
    @media (max-width: 768px) {
      .mobile-menu-toggle { display: flex; }
      .sidebar { transform:translateX(-100%); position:fixed; z-index:1000; transition:transform .3s ease; }
      .sidebar.mobile-open { transform:translateX(0); }
      .mobile-menu-overlay.active { display:block; }
      .main { margin-left:0; padding:16px; padding-top:80px; }
    }
  </style>
</head>

<body>
  <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
  <div class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">Consʌlt</div>
        <div class="sidebar-subtitle">Patient Portal</div>
      </div>
      <nav class="sidebar-nav">
        <a href="patient-dashboard.html" class="nav-item"><span style="font-size:20px;">🏠</span><span>Dashboard</span></a>
        <a href="wallet.html" class="nav-item"><span style="font-size:20px;">💳</span><span>Wallet</span></a>
        <a href="appointments.html" class="nav-item active"><span style="font-size:20px;">📅</span><span>Appointments</span></a>
        <a href="my-records.html" class="nav-item"><span style="font-size:20px;">📄</span><span>My Records</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" id="userInfo">
          <div class="user-avatar" id="userAvatar">P</div>
          <div class="user-details">
            <div class="user-name" id="userName">Patient</div>
            <div class="user-role">Patient Account</div>
          </div>
          <button class="logout-btn" id="logoutBtn" title="Logout">🚪</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="card">
        <div class="title">Book a visit</div>
        <p class="sub">Tell us what’s going on, and we’ll guide you to a booked appointment and payment.</p>

        <div class="chat">
          <div class="msgs" id="msgs"></div>
          <div class="chips" id="chips"></div>
          <div class="composer">
            <input class="input" id="input" placeholder="Describe your symptoms or what you need help with…" />
            <button class="btn primary" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = (window.API_BASE_URL || window.API_BASE || '').replace(/\/$/, '');
    const sid = localStorage.getItem('patient_session_id') || '';
    if (!sid) window.location.href = 'patient-login.html';

    const stateKey = 'patient_triage_state_v1';
    let triageState = (() => {
      try { return JSON.parse(sessionStorage.getItem(stateKey) || 'null') || {}; } catch (_) { return {}; }
    })();

    const msgs = document.getElementById('msgs');
    const chips = document.getElementById('chips');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');

    function add(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function setChips(options) {
      chips.innerHTML = '';
      if (!options || !options.length) return;
      for (const opt of options) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.type = 'button';
        b.textContent = opt.label;
        b.addEventListener('click', () => {
          sendMessage(opt.value, { action: opt.action || null, slot: opt.slot || null });
        });
        chips.appendChild(b);
      }
    }

    async function hydrateHeader() {
      try {
        const r = await fetch(`${API_BASE}/api/patient/me`, { headers: { 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' } });
        const j = await r.json();
        if (!r.ok || !j.success) return;
        const name = (j.patient && j.patient.name) ? j.patient.name : 'Patient';
        document.getElementById('userName').textContent = name;
        const initials = name.split(' ').filter(Boolean).map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'P';
        document.getElementById('userAvatar').textContent = initials;
      } catch (_) {}
    }

    async function sendMessage(text, meta = {}) {
      const t = (text || '').trim();
      if (!t) return;
      add('user', t);
      input.value = '';
      setChips([]);
      sendBtn.disabled = true;
      try {
        const r = await fetch(`${API_BASE}/api/patient/triage/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ message: t, state: triageState, meta })
        });
        const j = await r.json();
        if (!r.ok || !j.success) throw new Error(j.error || 'Request failed');
        triageState = j.state || {};
        sessionStorage.setItem(stateKey, JSON.stringify(triageState));
        if (j.reply) add('assistant', j.reply);
        if (j.next_chips) setChips(j.next_chips);
        if (j.redirect_to) window.location.href = j.redirect_to;
      } catch (e) {
        add('assistant', e.message || 'Something went wrong.');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.querySelector('.mobile-menu-overlay');
      if (sidebar) sidebar.classList.toggle('mobile-open');
      if (overlay) overlay.classList.toggle('active');
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('patient_session_id');
      localStorage.removeItem('patient_email');
      localStorage.removeItem('patient_phone');
      window.location.href = 'patient-login.html';
    });
    document.getElementById('userInfo').addEventListener('click', (e) => {
      if (e.target && e.target.id === 'logoutBtn') return;
      window.location.href = 'profile.html';
    });

    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(input.value); }
    });

    hydrateHeader();
    add('assistant', 'Hi — what can we help you with today? If this feels like an emergency, please call 911 or go to the nearest ER.');
    setChips([
      { label: 'Book a general visit', value: 'I want to book a general visit' },
      { label: 'I have symptoms', value: 'I have symptoms' },
      { label: 'Billing / receipt', value: 'I need help with my receipt' , action: 'billing' }
    ]);
  </script>
</body>

</html>
