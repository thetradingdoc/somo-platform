<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="../manifest.webmanifest">
    <title>My Appointments - Consult Patient Portal</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <script src="../assets/js/config.js" defer></script>
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            background: #f7fafc;
        }

        .sidebar {
            width: 260px;
            background: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--gray-200);
        }

        .sidebar-logo {
            font-size: 32px;
            line-height: 1;
            letter-spacing: -2px;
            color: #2d3748;
            margin-bottom: 4px;
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 700;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .sidebar-nav {
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--gray-700);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--gray-50);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-icon {
            font-size: 20px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--gray-200);
            position: absolute;
            bottom: 0;
            width: 260px;
            background: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .user-role {
            font-size: 12px;
            color: var(--gray-500);
        }

        .logout-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .main-content {
            margin-left: 260px;
            padding: 32px;
            flex: 1;
        }

        .page-header {
            margin-bottom: 32px;
            margin-top: 24px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--gray-600);
        }

        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1001;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: flex;
            }
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .mobile-menu-overlay.active {
                display: block;
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
                padding-top: 80px;
            }
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .container {
            max-width: 900px;
        }

        .appointments-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .appointment-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transition: all 0.2s;
        }

        .appointment-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .appointment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .appointment-info {
            flex: 1;
        }

        .appointment-type {
            font-size: 18px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .appointment-datetime {
            font-size: 16px;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .appointment-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-scheduled {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .status-completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-pending-payment {
            background: #fff3cd;
            color: #856404;
        }

        .appointment-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray-500);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
    <div class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">Consʌlt</div>
                <div class="sidebar-subtitle">Patient Portal</div>
            </div>
            <nav class="sidebar-nav">
                <a href="patient-dashboard.html" class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span>Dashboard</span>
                </a>
                <a href="wallet.html" class="nav-item">
                    <span class="nav-icon">💳</span>
                    <span>Wallet</span>
                </a>
                <a href="appointments.html" class="nav-item active">
                    <span class="nav-icon">📅</span>
                    <span>Appointments</span>
                </a>
                <a href="my-records.html" class="nav-item">
                    <span class="nav-icon">📄</span>
                    <span>My Records</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">P</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Patient</div>
                        <div class="user-role">Patient Account</div>
                    </div>
                    <button class="logout-btn" onclick="logout()" title="Logout">🚪</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
                <div class="page-header">
                <h1 class="page-title">My Appointments</h1>
                <p class="page-subtitle">View and manage your upcoming visits</p>
                <div style="margin-top:16px;">
                    <a href="book.html" class="btn btn-primary">Book a new visit</a>
                </div>
            </div>
            <div id="messageContainer"></div>
            <div id="appointmentsContainer" class="appointments-list">
            <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <p>Loading appointments...</p>
            </div>
        </div>
        </main>
    </div>

    <!-- Reschedule Modal -->
    <div class="modal-overlay" id="rescheduleModal" onclick="if(event.target===this) closeRescheduleModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Reschedule Appointment</h2>
                <button class="modal-close" onclick="closeRescheduleModal()">×</button>
            </div>
            <form id="rescheduleForm" onsubmit="handleReschedule(event)">
                <input type="hidden" id="rescheduleApptId">
                <div class="form-group">
                    <label class="form-label">New Date</label>
                    <input type="date" id="rescheduleDate" class="form-input" required onchange="loadRescheduleSlots()" />
                </div>
                <div class="form-group">
                    <label class="form-label">Available Times</label>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="loadRescheduleSlots()" style="margin-bottom:8px;">
                        Check availability
                    </button>
                    <div id="rescheduleSlots" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;"
                        onclick="closeRescheduleModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Reschedule</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Cancel Modal -->
    <div class="modal-overlay" id="cancelModal" onclick="if(event.target===this) closeCancelModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Cancel Appointment</h2>
                <button class="modal-close" onclick="closeCancelModal()">×</button>
            </div>
            <form id="cancelForm" onsubmit="handleCancel(event)">
                <input type="hidden" id="cancelApptId">
                <div class="form-group">
                    <label class="form-label">Reason (optional)</label>
                    <input type="text" id="cancelReason" class="form-input" placeholder="E.g., Schedule conflict">
                </div>
                <div style="display: flex; gap: 8px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeCancelModal()">Keep
                        Appointment</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1; background: #dc3545;">Cancel
                        Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { patientApi } from '../assets/js/patient-api.js';
        import { mountBottomTabs, showToast } from '../assets/js/patient-shell.js';

        const API_BASE = window.API_BASE || 'http://localhost:4000';

        document.addEventListener('DOMContentLoaded', () => {
            mountBottomTabs();
            loadAppointments();
            startAutoRefresh();
        });

        function parseMs(iso) {
            if (!iso) return NaN;
            const t = new Date(iso).getTime();
            return Number.isNaN(t) ? NaN : t;
        }

        function joinWindowGate(appt) {
            const start = parseMs(appt.start_time);
            const end = parseMs(appt.end_time);
            if (Number.isNaN(start) || Number.isNaN(end)) return { allowed: true, reason: null };
            const now = Date.now();
            const earlyMin = 10;
            const lateMin = 15;
            const earliest = start - earlyMin * 60 * 1000;
            const latest = end + lateMin * 60 * 1000;
            if (now < earliest) return { allowed: false, reason: `Join opens ${earlyMin} min before start.` };
            if (now > latest) return { allowed: false, reason: 'This visit is no longer available to join.' };
            return { allowed: true, reason: null };
        }

        function statusBadge(appt) {
            const s = (appt.status || '').toLowerCase();
            const pay = (appt.payment_status || '').toLowerCase();
            // Missed rule (mvp-43): scheduled/confirmed but past join window
            const gate = joinWindowGate(appt);
            if ((s === 'scheduled' || s === 'confirmed') && !gate.allowed && gate.reason === 'This visit is no longer available to join.') {
                return { label: 'Missed', cls: 'status-missed' };
            }
            if (s === 'canceled' || s === 'cancelled') return { label: 'Canceled', cls: 'status-canceled' };
            if (s === 'completed' || s === 'documented') return { label: 'Completed', cls: 'status-completed' };
            if (pay === 'refunded') return { label: 'Refunded', cls: 'status-refunded' };
            if (pay === 'paid') return { label: 'Paid', cls: 'status-paid' };
            if (pay === 'unpaid' || pay === 'pending' || pay === '') return { label: 'Payment due', cls: 'status-pending-payment' };
            if (s === 'confirmed') return { label: 'Confirmed', cls: 'status-confirmed' };
            return { label: appt.status || 'Scheduled', cls: `status-${s || 'scheduled'}` };
        }

        async function loadAppointments() {
            try {
                const data = await patientApi.getAppointments();
                if (data.success) {
                    displayAppointments(data.appointments || []);
                } else {
                    showMessage('Failed to load appointments: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
                showMessage('Network error. Please try again.', 'error');
            }
        }

        let refreshTimer = null;
        function startAutoRefresh() {
            if (refreshTimer) return;
            const tick = async () => {
                if (document.hidden) return;
                await loadAppointments();
            };
            refreshTimer = setInterval(tick, 30000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) tick();
            });
        }

        function displayAppointments(appointments) {
            const container = document.getElementById('appointmentsContainer');

            if (appointments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <h3>No Appointments</h3>
                        <p>You don't have any appointments yet.</p>
                    </div>
                `;
                return;
            }

            const sorted = [...appointments].sort((a, b) => {
                const am = a.start_time ? new Date(a.start_time).getTime() : NaN;
                const bm = b.start_time ? new Date(b.start_time).getTime() : NaN;
                if (!Number.isNaN(am) && !Number.isNaN(bm)) return am - bm;
                const ak = `${a.date || ''} ${a.time || ''}`;
                const bk = `${b.date || ''} ${b.time || ''}`;
                return ak.localeCompare(bk);
            });

            // Multi-appointment UX (mvp-50): group by date label
            const groups = new Map();
            sorted.forEach(ap => {
                const label = ap.date || 'Upcoming';
                if (!groups.has(label)) groups.set(label, []);
                groups.get(label).push(ap);
            });

            container.innerHTML = Array.from(groups.entries()).map(([dateLabel, list]) => {
                const header = `<div style="margin:14px 2px 10px;color:var(--gray-600);font-weight:800;">${dateLabel}</div>`;
                const cards = list.map(apt => {
                const badge = statusBadge(apt);
                const payState = (apt.payment_status || '').toLowerCase();
                const needsPayment = !!apt.payment_link && (payState === 'unpaid' || payState === 'pending' || payState === '');
                const payBtn = needsPayment ? `<a href="${apt.payment_link}" class="btn btn-primary btn-sm" target="_blank" rel="noopener">Pay now</a>` : '';
                const room = apt.video_room || `appt-${apt.id}`;
                const joinUrl = `video-call.html?room=${encodeURIComponent(room)}&name=${encodeURIComponent('Patient')}`;
                const gate = joinWindowGate(apt);
                const joinDisabled = !gate.allowed || ['canceled', 'cancelled', 'completed', 'documented'].includes((apt.status || '').toLowerCase());
                const joinBtn = joinDisabled
                    ? `<button class="btn btn-secondary btn-sm" disabled style="opacity:.6;cursor:not-allowed;">Join video</button>`
                    : `<a href="${joinUrl}" class="btn btn-secondary btn-sm" target="_blank" rel="noopener">Join video</a>`;
                const joinHint = (!gate.allowed && gate.reason)
                    ? `<div style="margin-top:8px;color:var(--gray-500);font-size:12px;">${gate.reason}</div>`
                    : '';
                const whyPay = needsPayment
                    ? `<div style="margin-top:10px;color:var(--gray-600);font-size:13px;">
                         <strong>Why am I paying?</strong> This visit has an outstanding balance. Paying generates a receipt and confirms your payment.
                       </div>`
                    : '';
                return `
                    <div class="appointment-card">
                        <div class="appointment-header">
                            <div class="appointment-info">
                                <div class="appointment-type">${apt.appointment_type || 'Consultation'}</div>
                                <div class="appointment-datetime">${apt.datetime_display || apt.date + ' at ' + apt.time}</div>
                                <span class="appointment-status ${badge.cls}">${badge.label}</span>
                                ${joinHint}
                                ${whyPay}
                            </div>
                            <div class="appointment-actions">
                                ${joinBtn}
                                ${payBtn}
                                ${apt.can_reschedule ? `<button class="btn btn-secondary btn-sm" onclick="openRescheduleModal('${apt.id}', '${apt.date}', '${apt.time}')">Reschedule</button>` : ''}
                                ${apt.can_cancel ? `<button class="btn btn-secondary btn-sm" onclick="openCancelModal('${apt.id}')">Cancel</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                }).join('');
                return header + cards;
            }).join('');
        }

        function openRescheduleModal(apptId, currentDate, currentTime) {
            document.getElementById('rescheduleApptId').value = apptId;
            document.getElementById('rescheduleDate').value = currentDate;
            const slotsContainer = document.getElementById('rescheduleSlots');
            if (slotsContainer) {
                slotsContainer.innerHTML = '';
            }
            document.getElementById('rescheduleModal').classList.add('active');
        }

        function closeRescheduleModal() {
            document.getElementById('rescheduleModal').classList.remove('active');
        }

        function openCancelModal(apptId) {
            document.getElementById('cancelApptId').value = apptId;
            document.getElementById('cancelModal').classList.add('active');
        }

        function closeCancelModal() {
            document.getElementById('cancelModal').classList.remove('active');
        }

        async function loadRescheduleSlots() {
            const date = document.getElementById('rescheduleDate').value;
            const slotsContainer = document.getElementById('rescheduleSlots');
            if (!slotsContainer) return;
            slotsContainer.innerHTML = '';

            if (!date) {
                return;
            }

            try {
                slotsContainer.innerHTML = '<div class="subtext">Loading…</div>';
                const params = new URLSearchParams({ date });
                const sid = localStorage.getItem('patient_session_id') || '';
                const res = await fetch(`${API_BASE}/api/patient/booking/available-slots?${params.toString()}`, {
                    headers: { 'ngrok-skip-browser-warning': 'true', 'x-session-id': sid }
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    slotsContainer.innerHTML = '<div class="subtext" style="color:#991b1b;">Unable to load times. ' + (data.error || 'Try again.') + '</div>';
                    showMessage(data.error || 'Unable to load available times for this date.', 'error');
                    return;
                }
                const slots = data.slots_with_display || data.slots || [];
                if (!slots.length) {
                    slotsContainer.textContent = 'No slots available for this date.';
                    return;
                }
                slotsContainer.innerHTML = '';
                slots.forEach(s => {
                    const label = s.display || s.time || s;
                    const timeVal = s.time || s.value || s;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'slot-btn';
                    btn.textContent = label;
                    btn.dataset.time = timeVal;
                    btn.style.padding = '6px 10px';
                    btn.style.borderRadius = '999px';
                    btn.style.border = '1px solid var(--gray-300)';
                    btn.style.background = '#fff';
                    btn.style.fontSize = '13px';
                    btn.addEventListener('click', () => {
                        Array.from(slotsContainer.querySelectorAll('.slot-btn')).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    });
                    slotsContainer.appendChild(btn);
                });
            } catch (error) {
                console.error('Error loading reschedule slots:', error);
                slotsContainer.innerHTML = '<div class="subtext" style="color:#991b1b;">Network error. <button type="button" onclick="loadRescheduleSlots()" style="text-decoration:underline;">Try again</button></div>';
                showMessage('Network error while loading available times.', 'error');
            }
        }
        window.loadRescheduleSlots = loadRescheduleSlots;

        async function handleReschedule(e) {
            e.preventDefault();
            const apptId = document.getElementById('rescheduleApptId').value;
            const newDate = document.getElementById('rescheduleDate').value;
            const slotsContainer = document.getElementById('rescheduleSlots');
            const selected = slotsContainer ? slotsContainer.querySelector('.slot-btn.selected') : null;
            const newTime = selected ? (selected.dataset.time || '') : '';

            if (!newDate || !newTime) {
                showMessage('Please choose a new date and time from the available slots.', 'error');
                return;
            }

            try {
                const idempotencyKey = `reschedule-${apptId}-${newDate}-${newTime}`;
                const data = await patientApi.rescheduleAppointment(apptId, newDate, newTime, idempotencyKey);
                if (data.success) {
                    showMessage('Appointment rescheduled successfully!', 'success');
                    showToast('Rescheduled.', 'success');
                    closeRescheduleModal();
                    loadAppointments();
                } else {
                    showMessage('Failed to reschedule: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
                if (window.showPatientAlert) {
                    window.showPatientAlert({
                        type: 'error',
                        message: 'We could not cancel your appointment due to a network issue. Please try again.'
                    });
                }
            }
        }

        async function handleCancel(e) {
            e.preventDefault();
            const apptId = document.getElementById('cancelApptId').value;
            const reason = document.getElementById('cancelReason').value;

            if (!confirm('Are you sure you want to cancel this appointment?')) {
                return;
            }

            try {
                const idempotencyKey = `cancel-${apptId}-${(reason || '').slice(0, 20)}`;
                const data = await patientApi.cancelAppointment(apptId, reason, idempotencyKey);
                if (data.success) {
                    showMessage('Appointment cancelled successfully.', 'success');
                    showToast('Canceled.', 'success');
                    closeCancelModal();
                    loadAppointments();
                } else {
                    showMessage('Failed to cancel: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }
        }

        // Receipts moved to Wallet (patients/wallet.html)

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="message message-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.mobile-menu-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('patient_session_id');
            localStorage.removeItem('patient_phone');
            window.location.href = 'patient-login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const userInfo = document.querySelector('.sidebar-footer .user-info');
                if (userInfo) {
                    userInfo.style.cursor = 'pointer';
                    userInfo.addEventListener('click', (e) => {
                        if (e.target && e.target.closest && e.target.closest('.logout-btn')) return;
                        window.location.href = 'profile.html';
                    });
                }
            } catch (_) {}
        });
    </script>
</body>

</html>
