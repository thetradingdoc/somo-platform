<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <title>Payment Successful - Consʌlt Patient Portal</title>
  <link rel="stylesheet" href="../assets/css/global.css" />
  <script src="../assets/js/config.js" defer></script>
  <script>
    (function() {
      const sid = localStorage.getItem('patient_session_id');
      if (!sid) {
        const returnTo = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.replace('patient-login.html?return=' + returnTo);
      }
    })();
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      margin: 0 0 6px 0;
      color: #0f172a;
    }

    .sub {
      margin: 0 0 16px 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.4;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      min-height: 44px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: #1e40af;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #ecfdf3;
      color: #166534;
      font-weight: 900;
      border: 1px solid #bbf7d0;
      margin: 10px 0 14px;
    }
    .pill-warn {
      background: #fff7ed;
      color: #9a3412;
      border-color: #fed7aa;
    }
  </style>
</head>

<body>
  <div class="card">
    <div style="text-align:center; margin-bottom: 10px;">
      <div style="font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: -2px; font-size: 44px; color: #1e40af; line-height: 1;">Consʌlt</div>
    </div>
    <div id="paymentStatePill" class="pill pill-warn">⏳ Confirming payment...</div>
    <h1 class="title">You’re all set</h1>
    <p class="sub">
      Your receipt is available in your Wallet. If you booked a visit, you can see it under Appointments.
    </p>
    <div id="appointmentDetails" class="hidden" style="margin: 16px 0; padding: 12px; background: #f0fdf4; border-radius: 10px; text-align: left;">
      <div style="font-size: 13px; font-weight: 600; color: #166534; margin-bottom: 6px;">Your visit</div>
      <div id="appointmentSummary" style="font-size: 14px; color: #374151;"></div>
      <div id="nextSteps" style="margin-top: 10px; font-size: 12px; color: #6b7280;"></div>
    </div>
    <div class="btn-row">
      <a class="btn btn-primary" href="wallet.html">View Wallet</a>
      <a class="btn btn-secondary" href="appointments.html">View Appointments</a>
      <a class="btn btn-secondary" href="patient-dashboard.html">Go to Dashboard</a>
    </div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const appointmentId = params.get('appointment_id');
      const paymentPill = document.getElementById('paymentStatePill');
      if (!appointmentId) return;
      const API_BASE = window.API_BASE || 'http://localhost:4000';
      const sid = localStorage.getItem('patient_session_id');
      if (!sid) return;
      async function pollPaymentStatus() {
        const maxAttempts = 15;
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          try {
            const r = await fetch(`${API_BASE}/api/patient/appointments/${encodeURIComponent(appointmentId)}/payment-status`, {
              headers: { 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' }
            });
            const data = await r.json();
            if (data && data.success && data.settled) {
              if (paymentPill) {
                paymentPill.classList.remove('pill-warn');
                paymentPill.textContent = '✅ Payment confirmed';
              }
              return;
            }
          } catch (_) {}
          await new Promise((resolve) => setTimeout(resolve, 1500));
        }
        if (paymentPill) {
          paymentPill.textContent = '✅ Payment received (processing confirmation)';
        }
      }
      pollPaymentStatus();

      fetch(`${API_BASE}/api/patient/appointments`, { headers: { 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' } })
        .then(r => r.json())
        .then(data => {
          if (!data.success || !data.appointments) return;
          const apt = data.appointments.find(a => String(a.id) === String(appointmentId));
          if (!apt) return;
          const el = document.getElementById('appointmentDetails');
          const summary = document.getElementById('appointmentSummary');
          const steps = document.getElementById('nextSteps');
          if (!el || !summary) return;
          const dt = apt.start_time ? new Date(apt.start_time).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : (apt.date && apt.time ? apt.date + ' at ' + apt.time : 'Scheduled');
          summary.textContent = (apt.appointment_type || 'Visit') + ' - ' + dt;
          const isSync = (apt.visit_mode || 'sync_video') === 'sync_video';
          steps.textContent = isSync ? "You'll receive reminders with an upload link and a tech check link before your visit." : "You'll receive a link to upload photos. A specialist will review within ~4 hours.";
          el.classList.remove('hidden');
        })
        .catch(function() {});
    })();
  </script>
</body>

</html>
