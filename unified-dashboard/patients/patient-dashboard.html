<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#314DB6">
    <link rel="manifest" href="../manifest.webmanifest">
    <title>Home - Skin &amp; Care Patient Portal</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <script src="../assets/js/config.js" defer></script>
    <style>
        :root {
            --primary: #314DB6;
            --primary-dark: #2a409a;
            --primary-light: #5b77de;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .layout {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
        }

        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e7ebf4;
            box-shadow: 2px 0 14px rgba(21, 36, 88, 0.05);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 18px 16px;
            border-bottom: 1px solid var(--gray-200);
        }
        .sidebar-logo {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 2px;
            color: #131a2e;
            text-decoration: none;
        }
        .sidebar-mark {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1e3a8a;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: sidebarSpin 6s linear infinite;
        }
        @keyframes sidebarSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .sidebar-subtitle {
            font-size: 11px;
            color: var(--gray-500);
            margin-top: 2px;
            margin-left: 0;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-nav {
            padding: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--gray-700);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--gray-50);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }
        .nav-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--gray-200);
            position: absolute;
            bottom: 0;
            width: 260px;
            background: white;
        }

        .main-content {
            margin-left: 260px;
            padding: var(--patient-space-5);
            flex: 1;
        }

        .page-header {
            margin-bottom: var(--patient-space-5);
            margin-top: var(--patient-space-4);
            padding-top: 0;
        }

        .page-title {
            font-size: var(--patient-title-size);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
            margin-top: 0;
            line-height: 1.05;
        }

        .page-subtitle {
            font-size: var(--patient-subtitle-size);
            color: var(--gray-600);
        }

        .routine-board {
            background: #fff;
            border-radius: 26px;
            padding: 24px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            margin-top: 18px;
        }
        .routine-board-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
        }
        .routine-board-title {
            font-size: 28px;
            line-height: 1;
            letter-spacing: -0.02em;
            margin: 0 0 6px 0;
            color: #1f2937;
        }
        .routine-board-subtitle {
            margin: 0;
            font-size: var(--patient-row-meta-size);
            color: #6b7280;
        }
        .routine-board-date {
            font-size: var(--patient-stat-size);
            font-weight: 700;
            color: #1f2937;
            line-height: 1;
            white-space: nowrap;
        }
        .routine-board-topline {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .routine-stats {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
        }
        .routine-stat .n {
            font-size: var(--patient-stat-size);
            font-weight: 700;
            color: #111827;
            line-height: 1;
        }
        .routine-stat .k {
            margin-top: 4px;
            color: #4b5563;
            font-size: var(--patient-row-meta-size);
        }
        .routine-view-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .routine-view-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #fff;
            color: #374151;
            font-size: 18px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .routine-view-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .routine-card-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }
        .routine-card-grid.list-mode {
            grid-template-columns: 1fr;
        }
        .routine-card {
            border-radius: 24px;
            padding: 18px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, #3d5ed3 0%, #314DB6 100%);
            color: #fff;
        }
        .routine-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .routine-card-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.84);
        }
        .routine-card-title {
            margin: 10px 0 2px 0;
            font-size: 24px;
            line-height: 1;
            color: #fff;
        }
        .routine-card-sub {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: var(--patient-row-meta-size);
        }
        .routine-progress-label {
            margin-top: 14px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.96);
        }
        .routine-progress-track {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.35);
            overflow: hidden;
        }
        .routine-progress-bar {
            height: 100%;
            border-radius: 999px;
        }
        .routine-progress-pct {
            margin-top: 8px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-align: right;
        }
        .routine-card-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }
        .routine-card-actions .btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .routine-create-btn {
            background: var(--primary);
            color: #fff;
        }
        .routine-open-products-btn {
            background: #eef0f6;
            color: #4f46e5;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.01em;
        }
        .routine-card.peach { background: linear-gradient(135deg, #3d5ed3 0%, #314DB6 100%); }
        .routine-card.lilac { background: linear-gradient(135deg, #3d5ed3 0%, #314DB6 100%); }
        .routine-card.sky { background: linear-gradient(135deg, #3d5ed3 0%, #314DB6 100%); }
        .routine-empty-state {
            border: 1px dashed #93c5fd;
            background: #eff6ff;
            border-radius: 14px;
            padding: 16px;
            color: #1e3a8a;
            display: none;
        }

        .home-empty-card .routine-card-title {
            font-size: 22px;
        }

        .home-stats-summary {
            margin-top: 6px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }
        .home-stat-tile {
            background: #f3f5fb;
            border: 1px solid #e4e8f4;
            border-radius: 14px;
            padding: 12px 14px;
        }
        .home-stat-label {
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: var(--patient-section-label-size);
            color: #6b7280;
            font-weight: 700;
        }
        .home-stat-value {
            margin-top: 6px;
            font-size: var(--patient-stat-size);
            font-weight: 800;
            line-height: 1;
            color: #111827;
        }
        .home-create-row {
            margin-top: 14px;
        }
        .home-create-btn {
            width: 100%;
            min-height: 50px;
            border-radius: 999px;
            border: 0;
            background: var(--primary);
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.01em;
            font-size: 15px;
            cursor: pointer;
        }
        .home-create-btn:hover {
            background: var(--primary-dark);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .user-role {
            font-size: 12px;
            color: var(--gray-500);
        }

        .logout-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--gray-200);
            background: #ffffff;
            color: var(--gray-600);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            border-color: #c7d2fe;
            color: var(--primary);
            background: #f7f9ff;
        }
        .logout-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
        }

        .loading {
            text-align: center;
            padding: 48px;
            color: var(--gray-600);
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--gray-500);
        }

        .refresh-btn {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none !important;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1001;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            width: 48px;
            height: 48px;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* Mobile-First Responsive Design */
        @media (max-width: 768px) {
            .mobile-menu-toggle { display: none !important; }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-menu-overlay.active {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding: 16px;
                padding-top: 80px;
                padding-bottom: 170px;
            }

            .page-header {
                margin-top: 16px;
                margin-bottom: 24px;
            }

            .page-title {
                font-size: var(--patient-title-size);
                margin-top: 0;
            }

            .page-subtitle {
                font-size: var(--patient-subtitle-size);
            }

            .routine-card-grid {
                grid-template-columns: 1fr;
            }
            .routine-board-title {
                font-size: 24px;
            }
            .routine-board-date {
                font-size: var(--patient-stat-size);
            }
            .routine-stat .n {
                font-size: var(--patient-stat-size);
            }
            .home-stats-summary {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 480px) {
            .main-content {
                padding: 12px;
                padding-top: 70px;
                padding-bottom: 170px;
            }

            .page-header {
                margin-top: 12px;
                margin-bottom: 20px;
            }

            .page-title {
                font-size: var(--patient-title-size);
                margin-bottom: 4px;
            }

            .btn-primary,
            .btn-secondary {
                padding: 12px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
    <div class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-logo">
                    <span class="sidebar-mark" aria-hidden="true">S&C</span>
                </a>
                <div class="sidebar-subtitle">Patient Portal</div>
            </div>

            <nav class="sidebar-nav">
                <a href="patient-dashboard.html" class="nav-item active">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg></span>
                    <span>Home</span>
                </a>
                <a href="schedule.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></span>
                    <span>Calendar</span>
                </a>
                <a href="appointments.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></span>
                    <span>Routine</span>
                </a>
                <a href="my-records.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6"/></svg></span>
                    <span>Products</span>
                </a>
                <a href="wallet.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><path d="M2.5 10.5h19"/><path d="M16 14h3"/></svg></span>
                    <span>Wallet</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg></span>
                    <span>Profile</span>
                </a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title" id="greetingTitle">Home</h1>
                <p class="page-subtitle">Routine progress for this week and quick access to your journal.</p>
            </div>
            

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="portalHealthBanner" class="error-message" style="display: none; background: #fffbeb; color: #92400e; border: 1px solid #fcd34d;"></div>

            <section class="routine-board" aria-label="Routine management board">
                <div class="routine-board-header">
                    <div>
                        <h2 class="routine-board-title">Routines</h2>
                        <p class="routine-board-subtitle">Routine summary with quick actions for current tasks.</p>
                    </div>
                    <div class="routine-board-date" id="routineBoardDate" aria-live="polite">—</div>
                </div>
                <div class="routine-board-topline" id="homeRoutineTopline">
                    <div class="routine-view-actions">
                        <button class="routine-view-btn active" id="homeListBtn" type="button" aria-pressed="true" aria-label="Switch to list view">≣</button>
                        <button class="routine-view-btn" id="homeGridBtn" type="button" aria-pressed="false" aria-label="Switch to grid view">⊞</button>
                    </div>
                </div>
                <div class="home-stats-summary" aria-label="Stats summary">
                    <article class="home-stat-tile">
                        <div class="home-stat-label">In Progress</div>
                        <div class="home-stat-value" id="summaryInProgress">0</div>
                    </article>
                    <article class="home-stat-tile">
                        <div class="home-stat-label">Upcoming</div>
                        <div class="home-stat-value" id="summaryUpcoming">0</div>
                    </article>
                    <article class="home-stat-tile">
                        <div class="home-stat-label">Total Tasks</div>
                        <div class="home-stat-value" id="summaryTotalTasks">0</div>
                    </article>
                </div>
                <div class="routine-card-grid list-mode" id="homeCardsGrid"></div>
                <div class="home-create-row">
                    <button class="home-create-btn" id="homeCreateRoutineBtn" type="button">Create your first routine</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = window.API_BASE || 'http://localhost:4000';

        // Check authentication - patient portal session only (mvp-fhir-14: no PHI in storage)
        function checkAuth() {
            const patientSessionId = localStorage.getItem('patient_session_id');
            if (!patientSessionId) {
                window.location.href = 'patient-login.html';
                return false;
            }
            return true;
        }

        // Initialize authentication check
        if (!checkAuth()) {
            // Will redirect, so stop execution
        }

        // Load user info - will be updated with patient data
        let patientId = null;
        const userData = JSON.parse(sessionStorage.getItem('user') || '{}');
        const patientName = userData.name || userData.patientName || '';
        const fallbackLabel = patientName || 'Patient';
        const initials = fallbackLabel
            .split(' ')
            .map(part => part.charAt(0))
            .join('')
            .substring(0, 2)
            .toUpperCase() || 'PT';

        document.getElementById('userName').textContent = fallbackLabel;
        document.getElementById('userAvatar').textContent = initials;

        // Update with server-resolved patient identity (mvp-fhir-12/13)
        async function updateUserInfo() {
            try {
                const sid = localStorage.getItem('patient_session_id') || '';
                if (!sid) return;
                const r = await fetch(`${API_BASE}/api/patient/me`, {
                    headers: { 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await r.json();
                if (!r.ok || !data.success) return;
                const name = (data.patient && data.patient.name) ? data.patient.name : 'Patient';
                patientId = (data.patient && data.patient.id) ? data.patient.id : null;
                document.getElementById('userName').textContent = name;
                const nameParts = name.split(' ').filter(Boolean);
                const firstName = nameParts[0] || name;
                const initials2 = nameParts.map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'PT';
                document.getElementById('greetingTitle').textContent = `Hi ${firstName}`;
                document.getElementById('userAvatar').textContent = initials2;
            } catch (_) { }
        }
        updateUserInfo();

        document.addEventListener('DOMContentLoaded', () => {
            try { configureHomeFab(false); } catch (_) {}
            void (async () => {
                try {
                    await loadHomeProgressSummary();
                } catch (_) {}
                try {
                    await loadCatalogHealthBanner();
                } catch (_) {}
            })();
            try {
                const gridBtn = document.getElementById('homeGridBtn');
                const listBtn = document.getElementById('homeListBtn');
                const grid = document.getElementById('homeCardsGrid');
                if (gridBtn && listBtn && grid) {
                    gridBtn.addEventListener('click', () => {
                        grid.classList.remove('list-mode');
                        gridBtn.classList.add('active');
                        listBtn.classList.remove('active');
                        gridBtn.setAttribute('aria-pressed', 'true');
                        listBtn.setAttribute('aria-pressed', 'false');
                    });
                    listBtn.addEventListener('click', () => {
                        grid.classList.add('list-mode');
                        listBtn.classList.add('active');
                        gridBtn.classList.remove('active');
                        listBtn.setAttribute('aria-pressed', 'true');
                        gridBtn.setAttribute('aria-pressed', 'false');
                    });
                }
            } catch (_) {}
            try {
                const userInfo = document.querySelector('.sidebar-footer .user-info');
                if (userInfo) {
                    userInfo.style.cursor = 'pointer';
                    userInfo.addEventListener('click', (e) => {
                        if (e.target && e.target.closest && e.target.closest('.logout-btn')) return;
                        window.location.href = 'profile.html';
                    });
                }
            } catch (_) {}
            try {
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach((item) => {
                    item.addEventListener('click', () => {
                        const sidebar = document.getElementById('sidebar');
                        const overlay = document.querySelector('.mobile-menu-overlay');
                        if (sidebar) sidebar.classList.remove('mobile-open');
                        if (overlay) overlay.classList.remove('active');
                    });
                });
            } catch (_) {}
            try { setRoutineBoardDate(); } catch (_) {}
        });

        function setRoutineBoardDate() {
            const el = document.getElementById('routineBoardDate');
            if (!el) return;
            const d = new Date();
            el.textContent = d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
        }

        function homeEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function setHomeRoutineChrome(hasTemplate) {
            const top = document.getElementById('homeRoutineTopline');
            if (top) {
                top.style.display = hasTemplate ? '' : 'none';
                top.setAttribute('aria-hidden', hasTemplate ? 'false' : 'true');
            }
        }

        function renderRoutineCards(cards = [], opts = {}) {
            const grid = document.getElementById('homeCardsGrid');
            if (!grid) return;
            const empty = opts.emptyNewUser === true;
            if (!Array.isArray(cards) || !cards.length) {
                grid.classList.add('list-mode');
                if (empty) {
                    grid.innerHTML = `
                    <article class="routine-card lilac home-empty-card">
                        <div>
                            <div class="routine-card-top">
                                <div class="routine-card-date">Routine</div>
                            </div>
                            <h3 class="routine-card-title">No routine yet. Create your first routine.</h3>
                            <p class="routine-card-sub">Start with name, products, and timing to unlock daily logging.</p>
                        </div>
                    </article>
                `;
                } else {
                    grid.innerHTML = `
                    <article class="routine-card lilac">
                        <div>
                            <h3 class="routine-card-title">Could not load routine</h3>
                            <p class="routine-card-sub">Check your connection and refresh the page.</p>
                        </div>
                    </article>
                `;
                }
                return;
            }
            const palettes = [
                { cls: 'peach', bar: '#f59e0b' },
                { cls: 'lilac', bar: '#4f46e5' },
                { cls: 'sky', bar: '#0e7490' }
            ];
            grid.innerHTML = cards.map((c, idx) => {
                const p = palettes[idx % palettes.length];
                const pct = Math.max(0, Math.min(100, Number(c.progress_pct) || 0));
                return `
                    <article class="routine-card ${p.cls}">
                        <div>
                            <div class="routine-card-top">
                                <div class="routine-card-date">${homeEsc(c.date_label || 'This week')}</div>
                            </div>
                            <h3 class="routine-card-title">${homeEsc(c.title || 'Routine task')}</h3>
                            <p class="routine-card-sub">${homeEsc(c.subtitle || 'Progress')}</p>
                            <div class="routine-progress-label">Progress</div>
                            <div class="routine-progress-track"><div class="routine-progress-bar" style="width:${pct}%;background:${p.bar};"></div></div>
                            <div class="routine-progress-pct">${pct}%</div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function configureHomeFab(hasTemplate) {
            const fab = document.getElementById('patientScanFab');
            if (!fab) return;
            if (!hasTemplate) {
                fab.style.display = 'none';
                fab.setAttribute('aria-hidden', 'true');
                return;
            }
            fab.style.display = '';
            fab.removeAttribute('aria-hidden');
            fab.textContent = '+';
            fab.href = 'appointments.html';
            fab.classList.add('compact');
            fab.setAttribute('aria-label', 'Add routine entry');
            fab.title = 'Add';
        }

        function configureHomePrimaryCta(hasTemplate) {
            const btn = document.getElementById('homeCreateRoutineBtn');
            if (!btn) return;
            if (hasTemplate) {
                btn.textContent = 'Open routine';
            } else {
                btn.textContent = 'Create your first routine';
            }
            btn.onclick = () => {
                window.location.href = 'appointments.html';
            };
        }

        async function fireHomeSummaryViewed() {
            try {
                const sid = localStorage.getItem('patient_session_id') || '';
                if (!sid) return;
                await fetch(`${API_BASE}/api/patient/analytics/event`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ event: 'home_summary_viewed' })
                });
            } catch (_) {}
        }

        async function loadCatalogHealthBanner() {
            const el = document.getElementById('portalHealthBanner');
            const err = document.getElementById('errorMessage');
            if (!el) return;
            try {
                const sid = localStorage.getItem('patient_session_id') || '';
                if (!sid) return;
                const r = await fetch(`${API_BASE}/api/patient/health/catalog`, {
                    headers: { 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok || !data.success || data.catalog_ok) {
                    el.style.display = 'none';
                    return;
                }
                el.textContent = data.message || 'Product search indexes may be unavailable.';
                el.style.display = 'block';
                if (err && err.style.display === 'block') {
                    el.style.marginTop = '8px';
                }
            } catch (_) {
                el.style.display = 'none';
            }
        }

        async function loadHomeProgressSummary() {
            try {
                const sid = localStorage.getItem('patient_session_id') || '';
                if (!sid) return;
                const errEl = document.getElementById('errorMessage');
                const r = await fetch(`${API_BASE}/api/patient/home/progress-summary`, {
                    headers: { 'x-session-id': sid, 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok || !data.success) {
                    if (errEl) {
                        errEl.textContent = 'Could not load your home summary. Check your connection and refresh.';
                        errEl.style.display = 'block';
                    }
                    return;
                }
                if (errEl) errEl.style.display = 'none';
                void fireHomeSummaryViewed();
                const s = data.summary || {};
                const setText = (id, v) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = String(v);
                };
                const hasTemplate = !!data.has_template;
                setHomeRoutineChrome(hasTemplate);
                setText('summaryInProgress', Number(hasTemplate ? (s.in_progress || 0) : 0));
                setText('summaryUpcoming', Number(hasTemplate ? (s.upcoming || 0) : 0));
                setText('summaryTotalTasks', Number(hasTemplate ? (s.total_tasks || 0) : 0));
                if (!hasTemplate) {
                    renderRoutineCards([], { emptyNewUser: true });
                } else {
                    const c = Array.isArray(data.cards) ? data.cards : [];
                    if (!c.length) {
                        renderRoutineCards([{
                            title: 'Your routine',
                            subtitle: 'Add steps and products on the Routine page.',
                            progress_pct: 0,
                            date_label: 'This week'
                        }]);
                    } else {
                        renderRoutineCards(c);
                    }
                }
                configureHomeFab(hasTemplate);
                configureHomePrimaryCta(hasTemplate);
            } catch (_) {
                const errEl = document.getElementById('errorMessage');
                if (errEl) {
                    errEl.textContent = 'Could not load your home summary. Check your connection and refresh.';
                    errEl.style.display = 'block';
                }
                setHomeRoutineChrome(true);
                const setText = (id, v) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = String(v);
                };
                setText('summaryInProgress', '—');
                setText('summaryUpcoming', '—');
                setText('summaryTotalTasks', '—');
                renderRoutineCards([], { emptyNewUser: false });
                configureHomeFab(true);
                configureHomePrimaryCta(false);
            }
        }

        // Mobile menu toggle
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.mobile-menu-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }

        function logout() {
            // Clear both patient and business sessions
            localStorage.removeItem('patient_session_id');
            localStorage.removeItem('patient_phone');
            sessionStorage.clear();
            window.location.href = 'patient-login.html';
        }

    </script>
    <script type="module">
        import { mountBottomTabs } from '../assets/js/patient-shell.js';
        mountBottomTabs();
    </script>
</body>

</html>
