<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <link rel="manifest" href="../manifest.webmanifest">
    <title>Consult Patient Portal</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <script src="../assets/js/config.js" defer></script>
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
        }

        body {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 36px;
            text-align: center;
            color: white;
        }

        .auth-body {
            padding: 40px;
        }

        .logo-brand {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -0.02em;
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .logo-subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        .portal-title {
            margin: 8px 0 0 0;
            font-size: 22px;
            font-weight: 800;
        }

        .portal-sub {
            margin: 6px 0 0 0;
            font-size: 13px;
            opacity: 0.92;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .step-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 8px 0;
            color: var(--gray-900);
            text-align: center;
        }

        .step-description {
            color: var(--gray-600);
            margin: 0 0 18px 0;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gray-900);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(30, 64, 175, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            padding: 10px 14px;
            background: #f7fafc;
            color: #2d3748;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #eef2ff;
            border-color: rgba(30, 64, 175, 0.35);
        }

        .code-input {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .code-digit {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
        }

        .code-digit:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--gray-600);
        }

        .resend-link {
            text-align: center;
            margin-top: 16px;
        }

        .resend-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .resend-link a:hover {
            text-decoration: underline;
        }

        /* Mobile-First Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .auth-header {
                padding: 28px 20px;
            }

            .auth-body {
                padding: 24px 20px;
            }

            .step-title {
                font-size: 20px;
            }

            .code-digit {
                width: 44px;
                height: 56px;
                font-size: 20px;
            }

            .code-input {
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .auth-header {
                padding: 24px 16px;
            }
            .auth-body {
                padding: 20px 16px;
            }

            .step-title {
                font-size: 18px;
            }

            .code-digit {
                width: 40px;
                height: 52px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-brand">Consʌlt</div>
            <div class="portal-title">Patient Portal</div>
            <div class="portal-sub">Secure email code access</div>
        </div>
        <div class="auth-body">

        <!-- Step 1: Enter Email -->
        <div class="step active" id="stepEmail">
            <h2 class="step-title" id="authTitle">Sign in</h2>
            <p class="step-description" id="authDescription">Enter your email to receive a secure 6-digit code.</p>

            <div style="margin:-8px 0 18px 0; text-align:center;">
                <button type="button" id="toggleIntentBtn" class="btn-secondary" style="margin-top:0; width:auto; padding:8px 12px;">
                    New here? Create account
                </button>
            </div>

            <div id="emailMessage"></div>

            <form id="emailForm" onsubmit="handleEmailSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" class="form-input" placeholder="your.email@example.com" required
                        autocomplete="email">
                </div>
                <button type="submit" class="btn-primary" id="emailSubmitBtn">
                    Continue
                </button>
            </form>
        </div>

        <!-- Step 2: Enter Code -->
        <div class="step" id="stepCode">
            <h2 class="step-title">Enter Verification Code</h2>
            <p class="step-description">We sent a 6-digit code to <strong id="emailDisplay"></strong></p>

            <div id="codeMessage"></div>

            <form id="codeForm" onsubmit="handleCodeSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Verification Code</label>
                    <div class="code-input">
                        <input type="text" class="code-digit" maxlength="1" id="code1" autocomplete="off">
                        <input type="text" class="code-digit" maxlength="1" id="code2" autocomplete="off">
                        <input type="text" class="code-digit" maxlength="1" id="code3" autocomplete="off">
                        <input type="text" class="code-digit" maxlength="1" id="code4" autocomplete="off">
                        <input type="text" class="code-digit" maxlength="1" id="code5" autocomplete="off">
                        <input type="text" class="code-digit" maxlength="1" id="code6" autocomplete="off">
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="codeSubmitBtn">
                    Verify & Sign In
                </button>
                <div class="resend-link">
                    <a href="#" onclick="resendCode(); return false;">Didn't receive code? Resend</a>
                </div>
            </form>
        </div>

        <!-- Step 3: Loading -->
        <div class="step" id="stepLoading">
            <div class="loading">
                <div style="font-size: 48px; margin-bottom: 16px;">⏳</div>
                <div>Signing you in...</div>
            </div>
        </div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_BASE || 'http://localhost:4000';
        const API_HEADERS = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' };
        let currentEmail = '';
        let sessionId = '';

        // Auto-advance code inputs
        const codeInputs = ['code1', 'code2', 'code3', 'code4', 'code5', 'code6'];
        codeInputs.forEach((id, index) => {
            const input = document.getElementById(id);
            input.addEventListener('input', (e) => {
                if (e.target.value && index < codeInputs.length - 1) {
                    document.getElementById(codeInputs[index + 1]).focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    document.getElementById(codeInputs[index - 1]).focus();
                }
            });
        });

        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function showMessage(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="message message-${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        async function handleEmailSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();

            if (!email) {
                showMessage('emailMessage', 'Please enter your email address', 'error');
                return;
            }

            // Basic email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('emailMessage', 'Please enter a valid email address', 'error');
                return;
            }

            currentEmail = email;
            const btn = document.getElementById('emailSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE}/api/patient/verify/send`, {
                    method: 'POST',
                    headers: API_HEADERS,
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    sessionId = data.session_id;
                    // If backend knows whether account exists, set the UI intent accordingly
                    if (typeof data.existing_patient === 'boolean') {
                        setAuthIntent(data.existing_patient ? 'signin' : 'signup');
                    }
                    document.getElementById('emailDisplay').textContent = email;
                    showStep('stepCode');
                    // Focus first code input
                    document.getElementById('code1').focus();
                } else {
                    showMessage('emailMessage', data.error || 'Failed to send code', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Continue';
                }
            } catch (error) {
                showMessage('emailMessage', 'Network error. Please try again.', 'error');
                if (window.showPatientAlert) {
                    window.showPatientAlert({
                        type: 'error',
                        message: 'We could not send a code due to a network issue. Please check your connection and try again.',
                        retry: () => handleEmailSubmit(new Event('submit'))
                    });
                }
                btn.disabled = false;
                btn.textContent = 'Continue';
            }
        }

        async function handleCodeSubmit(e) {
            e.preventDefault();

            const code = codeInputs.map(id => document.getElementById(id).value).join('');

            if (code.length !== 6) {
                showMessage('codeMessage', 'Please enter the full 6-digit code', 'error');
                return;
            }

            const btn = document.getElementById('codeSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const response = await fetch(`${API_BASE}/api/patient/verify/confirm`, {
                    method: 'POST',
                    headers: API_HEADERS,
                    body: JSON.stringify({ email: currentEmail, code })
                });

                const data = await response.json();

                if (data.success) {
                    sessionId = data.session_id;
                    // Store session in localStorage
                    localStorage.setItem('patient_session_id', sessionId);

                    showStep('stepLoading');

                    // If required onboarding fields are missing, route to onboarding
                    const needsOnboarding = (data.created_patient === true) || (data.onboarding_complete === false);
                    window.location.href = needsOnboarding ? 'onboarding.html' : 'appointments.html';
                } else {
                    showMessage('codeMessage', data.error || 'Invalid verification code', 'error');
                    // Clear code inputs
                    codeInputs.forEach(id => document.getElementById(id).value = '');
                    document.getElementById('code1').focus();
                    btn.disabled = false;
                    btn.textContent = 'Verify & Sign In';
                }
            } catch (error) {
                showMessage('codeMessage', 'Network error. Please try again.', 'error');
                if (window.showPatientAlert) {
                    window.showPatientAlert({
                        type: 'error',
                        message: 'We could not verify your code due to a network issue. Please try again.',
                        retry: () => handleCodeSubmit(new Event('submit'))
                    });
                }
                btn.disabled = false;
                btn.textContent = 'Verify & Sign In';
            }
        }

        async function resendCode() {
            if (!currentEmail) return;

            try {
                const response = await fetch(`${API_BASE}/api/patient/verify/send`, {
                    method: 'POST',
                    headers: API_HEADERS,
                    body: JSON.stringify({ email: currentEmail })
                });

                const data = await response.json();
                if (data.success) {
                    showMessage('codeMessage', 'New verification code sent to your email!', 'success');
                } else {
                    showMessage('codeMessage', data.error || 'Failed to resend code', 'error');
                }
            } catch (error) {
                showMessage('codeMessage', 'Network error. Please try again.', 'error');
                if (window.showPatientAlert) {
                    window.showPatientAlert({
                        type: 'error',
                        message: 'We could not resend your code due to a network issue. Please try again.'
                    });
                }
            }
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            // Show session expired message when redirected after invalid session
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('expired') === '1') {
                const emailMsg = document.getElementById('emailMessage');
                if (emailMsg) {
                    emailMsg.innerHTML = '<div class="alert alert-info" style="display:block;">Your session expired. Please sign in again to continue.</div>';
                }
            }
            // default intent
            setAuthIntent('signin');

            const toggle = document.getElementById('toggleIntentBtn');
            toggle.addEventListener('click', () => {
                const next = (window.__patientAuthIntent === 'signin') ? 'signup' : 'signin';
                setAuthIntent(next);
            });

            const existingSession = localStorage.getItem('patient_session_id');
            if (existingSession) {
                // Validate session
                fetch(`${API_BASE}/api/patient/appointments`, { headers: { 'ngrok-skip-browser-warning': 'true', 'x-session-id': existingSession } })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = 'appointments.html';
                        } else {
                            localStorage.removeItem('patient_session_id');
                        }
                    })
                    .catch(() => {
                        // Stay on login page
                    });
            }
        });

        function setAuthIntent(intent) {
            window.__patientAuthIntent = intent === 'signup' ? 'signup' : 'signin';
            const title = document.getElementById('authTitle');
            const desc = document.getElementById('authDescription');
            const toggle = document.getElementById('toggleIntentBtn');

            if (window.__patientAuthIntent === 'signup') {
                title.textContent = 'Create account';
                desc.textContent = 'Enter your email to create your patient account. We’ll send a secure 6-digit code.';
                toggle.textContent = 'Already have an account? Sign in';
            } else {
                title.textContent = 'Sign in';
                desc.textContent = 'Enter your email to receive a secure 6-digit code.';
                toggle.textContent = 'New here? Create account';
            }
        }
    </script>
</body>

</html>
